      drawRange(t.x + 0.5, t.y + 0.5, st.range, 'rgba(110,168,255,.55)');
    } else if (S.build && !isSpike && hoverCell) {
      const def = TOWER_DEF[S.build];
      if (def) {
        const ok = canBuild(hoverCell.x, hoverCell.y) && S.gold >= def.lv[0].cost;
        drawRange(hoverCell.x + 0.5, hoverCell.y + 0.5, def.lv[0].range,
          ok ? 'rgba(74,217,145,.6)' : 'rgba(255,107,107,.6)');
      }
    }
  }

  // 建造预览
  if (S.build && hoverCell) {
    const def2 = TOWER_DEF[S.build];
    const cost2 = def2 ? def2.lv[0].cost : SPIKE_DEF.cost;
    const ok = (isSpike ? (S.grid[hoverCell.y * N + hoverCell.x] === ROAD || S.mode === 'hex')
                        : canBuild(hoverCell.x, hoverCell.y))
      && S.gold >= cost2;
    const [sx, sy] = w2s(hoverCell.x, hoverCell.y);
    ctx.fillStyle = ok ? 'rgba(74,217,145,.18)' : 'rgba(255,107,107,.18)';
    ctx.fillRect(sx, sy, z, z);
    ctx.strokeStyle = ok ? 'rgba(74,217,145,.8)' : 'rgba(255,107,107,.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, z - 2, z - 2);
  }

  // 选中的格子高亮
  if (S.selected) {
    const [sx, sy] = w2s(S.selected.x, S.selected.y);
    ctx.strokeStyle = 'rgba(110,168,255,.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, z - 2, z - 2);
  }

  // 基地防御指示
  if (S.baseTier > 0 && S.base) {
    const bq = w2s(S.base.x + 0.5, S.base.y + 0.5);
    const b = BASE_BRANCH[S.baseBranch];
    const pu = 0.5 + Math.sin(S.time * 4) * 0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = 0.45 + pu * 0.4;
    ctx.lineWidth = Math.max(1.5, z * 0.08);
    ctx.beginPath(); ctx.arc(bq[0], bq[1], z * (0.62 + pu * 0.06), 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < S.baseTier; i++) {
      const a2 = S.time * 1.6 + i * Math.PI * 2 / 5;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(bq[0] + Math.cos(a2) * z * 0.78, bq[1] + Math.sin(a2) * z * 0.78, z * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 出生点标记
  if (S.spawns) {
    for (const sp of S.spawns) {
      const [ax, ay] = w2s(sp.x + 0.5, sp.y + 0.5);
      const pu = 0.5 + Math.sin(S.time * 3) * 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const sg = ctx.createRadialGradient(ax, ay, 0, ax, ay, z * (0.95 + pu * 0.3));
      sg.addColorStop(0, 'rgba(255,70,70,.55)');
      sg.addColorStop(0.6, 'rgba(200,30,30,.22)');
      sg.addColorStop(1, 'rgba(200,30,30,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(ax, ay, z * (0.95 + pu * 0.3), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,120,120,' + (0.55 + pu * 0.4) + ')';
      ctx.lineWidth = Math.max(1.5, z * 0.08);
      ctx.beginPath(); ctx.arc(ax, ay, z * 0.38, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,150,150,' + (0.6 + pu * 0.4) + ')';
      ctx.beginPath();
      ctx.moveTo(ax - z * 0.18, ay - z * 0.10);
      ctx.lineTo(ax + z * 0.18, ay - z * 0.10);
      ctx.lineTo(ax, ay + z * 0.16);
      ctx.closePath(); ctx.fill();
    }
  }

  // 基地
  drawBase();

  // 敌人：按高度分层绘制，飞行单位在最上层
  // 视口范围（带 2 格余量），用于剔除屏幕外单位
  const _vx0 = cam.x - cw / 2 / cam.z - 2, _vx1 = cam.x + cw / 2 / cam.z + 2;
  const _vy0 = cam.y - ch / 2 / cam.z - 2, _vy1 = cam.y + ch / 2 / cam.z + 2;
  _drawBuf.length = 0;
  _bufGround.length = 0;
  _bufAir.length = 0;
  _bufGiant.length = 0;
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.x < _vx0 || e.x > _vx1 || e.y < _vy0 || e.y > _vy1) continue;
    if (e.giant) _bufGiant.push(e);
    else if (e.flying || e.type === 'flock') _bufAir.push(e);
    else _bufGround.push(e);
  }
  // 地面 → 飞行 → 巨型，无需每帧排序
  for (const e of _bufGround) _drawBuf.push(e);
  for (const e of _bufAir) _drawBuf.push(e);
  for (const e of _bufGiant) _drawBuf.push(e);
  for (const e of _drawBuf) {
    drawEnemy(e);
    // 图腾法师：头顶名牌 + 底部紫环，避免混在怪群里看不见
    if (e.type === 'totemMage' && !e.dead) {
      const q2 = w2s(e.x, e.y);
      const rr = ENEMY_DEF.totemMage.r * cam.z;
      const pu = 0.5 + Math.sin(S.time * 4) * 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(192,132,252,' + (0.5 + pu * 0.45) + ')';
      ctx.lineWidth = Math.max(1.5, cam.z * 0.07);
      ctx.beginPath();
      ctx.ellipse(q2[0], q2[1] + rr * 0.9, rr * 0.95, rr * 0.34, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.fillStyle = 'rgba(216,180,254,.95)';
      ctx.font = '700 ' + Math.max(9, cam.z * 0.24) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('图腾法师', q2[0], q2[1] - rr * 1.5);
      ctx.restore();
      ctx.textAlign = 'start';
    }
  }

  // 地刺
  if (S.spikes) {
    for (const sp of S.spikes) {
      const q = w2s(sp.x, sp.y);
      const k = sp.uses / sp.max;
      ctx.save();
      ctx.globalAlpha = 0.45 + k * 0.5;
      ctx.fillStyle = '#cbd5e1';
      for (let i = 0; i < 3; i++) {
        const px = q[0] - z * 0.22 + i * z * 0.22;
        ctx.beginPath();
        ctx.moveTo(px - z * 0.09, q[1] + z * 0.16);
        ctx.lineTo(px, q[1] - z * 0.18);
        ctx.lineTo(px + z * 0.09, q[1] + z * 0.16);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(40,50,65,.8)';
      ctx.lineWidth = Math.max(1, z * 0.03);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 框选区域
  if (S.boxSel) {
    const b = S.boxSel;
    const bx = Math.min(b.x0, b.x1), by = Math.min(b.y0, b.y1);
    const bw = Math.abs(b.x1 - b.x0), bh = Math.abs(b.y1 - b.y0);
    ctx.save();
    ctx.fillStyle = 'rgba(148,163,184,.18)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(203,213,225,.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.restore();
  }

  // 士兵
  for (const sd of S.soldiers) {
    if (sd.dead) continue;
    const q = w2s(sd.x, sd.y);
    const r = cam.z * 0.2;
    const st2 = towerStats(sd.tower);
    const hpR = clamp(sd.hp / Math.max(1, st2.hp), 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(q[0], q[1] + r * 0.7, r * 0.8, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    const sg = ctx.createRadialGradient(q[0] - r * 0.3, q[1] - r * 0.3, r * 0.2, q[0], q[1], r * 1.1);
    sg.addColorStop(0, '#d7ecc6');
    sg.addColorStop(1, '#5d7a4e');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth = Math.max(1, r * 0.15);
    ctx.stroke();
    ctx.strokeStyle = '#e8eef6';
    ctx.lineWidth = Math.max(1, r * 0.16);
    ctx.beginPath();
    ctx.moveTo(q[0] + r * 0.5, q[1] - r * 0.2);
    ctx.lineTo(q[0] + r * 1.3, q[1] - r * 0.85);
    ctx.stroke();
    const bw = r * 2.2, bh = Math.max(2, cam.z * 0.055);
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(q[0] - bw / 2 - 1, q[1] - r - bh - 3, bw + 2, bh + 2);
    ctx.fillStyle = hpR > 0.5 ? '#9df0b5' : hpR > 0.25 ? '#ffd76a' : '#ff9a9a';
    ctx.fillRect(q[0] - bw / 2, q[1] - r - bh - 2, bw * hpR, bh);
  }

  // 子弹
  for (const s of S.shots) drawShot(s);

  // 掉落道具
  for (const d of S.drops) {
    const [sx, sy] = w2s(d.x, d.y);
    const def = ITEMS[d.kind];
    const rise = 1 - d.life / d.max;
    ctx.save();
    ctx.translate(sx, sy - cam.z * (0.35 + rise * 0.45));
    ctx.globalAlpha = 0.55 + Math.sin(S.time * 12) * 0.25;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.arc(0, 0, cam.z * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = def.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, cam.z * 0.3, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = def.color;
    ctx.font = '700 ' + Math.max(10, cam.z * 0.36) + 'px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(def.icon, 0, cam.z * 0.13);
    ctx.textAlign = 'start';
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 特效
  for (const f of S.fx) {
    if (f.x < _vx0 || f.x > _vx1 || f.y < _vy0 || f.y > _vy1) continue;
    drawFx(f);
  }

  ctx.restore();

  // 暗角，让画面有电影感
  const vg = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.34,
                                      cw / 2, ch / 2, Math.max(cw, ch) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.52)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, cw, ch);

  // 技能 / 事件闪光
  if (S.flashA > 0) {
    ctx.globalAlpha = S.flashA;
    ctx.fillStyle = S.flashC;
    ctx.fillRect(0, 0, cw, ch);
    ctx.globalAlpha = 1;
  }

  // 浓雾事件
  if (S.event && S.event.def.dark) {
    ctx.fillStyle = 'rgba(10,14,20,0.40)';
    ctx.fillRect(0, 0, cw, ch);
  }
}

/* ══════════════════════════════════════════════════════════════
   绘制（美术重绘版）
   ══════════════════════════════════════════════════════════════ */

function drawTower(sx, sy, z, t, iconMode) {
  const def = TOWER_DEF[t.type];
  const st = towerStats(t);
  const R = z * (iconMode ? 1 : 0.42);
  const cx = sx, cy = sy;

  // 狂怒药水：红色脉冲光环
  if (!iconMode && S.rageT > 0) {
    const pul = 0.5 + 0.5 * Math.sin(S.time * 9);
    const k7 = Math.min(1, S.rageT / 1.2);   // 末尾淡出
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(cx, cy, R * 0.35, cx, cy, R * 1.55);
    rg.addColorStop(0, 'rgba(255,110,80,' + (0.34 + pul * 0.22) * k7 + ')');
    rg.addColorStop(0.6, 'rgba(255,70,50,' + (0.20 + pul * 0.14) * k7 + ')');
    rg.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.7, 0, Math.PI * 2); ctx.fill();
    // 旋转的脉冲环
    ctx.strokeStyle = 'rgba(255,120,90,' + (0.65 + pul * 0.35) * k7 + ')';
    ctx.lineWidth = Math.max(2, z * 0.10);
    ctx.beginPath();
    ctx.arc(cx, cy, R * (1.45 + pul * 0.16), S.time * 2.2, S.time * 2.2 + Math.PI * 1.5);
    ctx.stroke();
    // 内圈红点
    ctx.fillStyle = 'rgba(255,180,120,' + (0.5 + pul * 0.4) * k7 + ')';
    ctx.beginPath(); ctx.arc(cx, cy - R * 1.85, Math.max(1.6, z * 0.055), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (!iconMode) {
    // 落影（低画质时省略）
    if (S.q < 2) { /* skip shadow */ } else {
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    ctx.beginPath();
    ctx.ellipse(cx + z * 0.06, cy + z * 0.11, R * 1.25, R * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    }

    // 石台（径向渐变）
    const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.45, R * 0.15, cx, cy, R * 1.2);
    g.addColorStop(0, '#4a5970');
    g.addColorStop(0.55, '#2b3546');
    g.addColorStop(1, '#161d28');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.12, 0, Math.PI * 2); ctx.fill();

    // 类型色外环
    ctx.strokeStyle = def.color;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = Math.max(1.2, R * 0.15);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.12, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    // ── 等级外观：每一级都有肉眼可见的变化 ──
    const lv = t.level || 1;
    if (lv >= 2) {
      // 内圈银环
      ctx.strokeStyle = 'rgba(230,240,255,.6)';
      ctx.lineWidth = Math.max(1, R * 0.09);
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.96, 0, Math.PI * 2); ctx.stroke();
    }
    if (lv >= 3) {
      // 六根尖刺
      ctx.fillStyle = def.color;
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + Math.PI / 6;
        const x1 = cx + Math.cos(a) * R * 1.10, y1 = cy + Math.sin(a) * R * 1.10;
        const x2 = cx + Math.cos(a + 0.19) * R * 1.46, y2 = cy + Math.sin(a + 0.19) * R * 1.46;
        const x3 = cx + Math.cos(a - 0.19) * R * 1.46, y3 = cy + Math.sin(a - 0.19) * R * 1.46;
        ctx.beginPath();
        ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
        ctx.closePath(); ctx.fill();
      }
    }
    if (lv >= 4) {
      // 金色五芒星法阵（缓慢旋转）
      const pu = 0.5 + Math.sin(S.time * 4) * 0.5;
      ctx.fillStyle = 'rgba(255,220,120,' + (0.05 + pu * 0.07) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.7, 0, Math.PI * 2); ctx.fill();
      drawPentagram(ctx, cx, cy, R * 1.62, S.time * 0.5,
        'rgba(255,224,130,' + (0.5 + pu * 0.45) + ')', 1);

      // 环绕的能量球
      for (let i = 0; i < 3; i++) {
        const a = S.time * 1.7 + i * Math.PI * 2 / 3;
        const px = cx + Math.cos(a) * R * 1.38;
        const py = cy + Math.sin(a) * R * 1.38;
        const og = ctx.createRadialGradient(px, py, 0, px, py, R * 0.36);
        og.addColorStop(0, '#ffffff');
        og.addColorStop(0.5, def.color);
        og.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = og;
        ctx.beginPath(); ctx.arc(px, py, R * 0.36, 0, Math.PI * 2); ctx.fill();
      }

      // 上升的火花
      for (let i = 0; i < 4; i++) {
        const ph = (S.time * 0.55 + i * 0.25) % 1;
        ctx.globalAlpha = (1 - ph) * 0.85;
        ctx.fillStyle = i % 2 ? def.color : '#fff6d0';
        const sp = cx + Math.sin(i * 2.4 + S.time) * R * 0.75;
        ctx.beginPath();
        ctx.arc(sp, cy - ph * R * 2.4, R * (0.10 - ph * 0.04), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // 电系塔：环绕电弧
      if (t.type === 'tesla' || t.type === 'railgun' || t.type === 'aa') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(170,235,255,.9)';
        ctx.lineWidth = Math.max(1, R * 0.06);
        ctx.beginPath();
        for (let i = 0; i <= 8; i++) {
          const a = i / 8 * Math.PI * 2 + S.time * 2.6;
          const rr = R * (1.05 + Math.sin(S.time * 9 + i * 1.7) * 0.28);
          const px = cx + Math.cos(a) * rr;
          const py = cy + Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }

    // 开火脉冲
    if (t.type !== 'flame' && t.cd > 0) {
      const k = Math.max(0, 1 - t.cd / Math.max(0.08, st.rate || 0.3));
      ctx.globalAlpha = 0.25 * k;
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(cx, cy, R * (1.2 + k * 0.5), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // 圣光塔：神圣气场
  if (!iconMode && t.type === 'holy') {
    const pu = 0.5 + Math.sin(S.time * 2.2) * 0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 外层圣光
    const hr = R * (2.3 + pu * 0.35);
    const hg = ctx.createRadialGradient(cx, cy, R * 0.3, cx, cy, hr);
    hg.addColorStop(0, 'rgba(255,246,200,.36)');
    hg.addColorStop(0.5, 'rgba(255,220,120,.16)');
    hg.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(cx, cy, hr, 0, Math.PI * 2); ctx.fill();

    // 旋转光芒
    ctx.translate(cx, cy);
    ctx.rotate(S.time * 0.6);
    ctx.fillStyle = 'rgba(255,245,190,.20)';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a - 0.10) * hr * 1.15, Math.sin(a - 0.10) * hr * 1.15);
      ctx.lineTo(Math.cos(a + 0.10) * hr * 1.15, Math.sin(a + 0.10) * hr * 1.15);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // 上升的光点
    for (let i = 0; i < 5; i++) {
      const ph = (S.time * 0.5 + i * 0.2) % 1;
      ctx.globalAlpha = (1 - ph) * 0.9;
      ctx.fillStyle = '#fff8d8';
      ctx.beginPath();
      ctx.arc(cx + Math.sin(i * 2 + S.time) * R * 0.8,
              cy - ph * R * 2.9, R * (0.12 - ph * 0.05), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 头顶圣光十字
    const cy2 = cy - R * 2.15 - pu * R * 0.18;
    ctx.fillStyle = 'rgba(255,250,215,' + (0.55 + pu * 0.4) + ')';
    ctx.fillRect(cx - R * 0.09, cy2 - R * 0.44, R * 0.18, R * 0.88);
    ctx.fillRect(cx - R * 0.42, cy2 - R * 0.11, R * 0.84, R * 0.18);
    ctx.fillStyle = 'rgba(255,255,240,' + (0.7 + pu * 0.3) + ')';
    ctx.beginPath(); ctx.arc(cx, cy2, R * 0.13, 0, Math.PI * 2); ctx.fill();

    // 治疗光束（连到附近士兵）
    for (const sd of S.soldiers) {
      if (sd.dead) continue;
      if (dist(cx, cy, sd.x, sd.y) > 7) continue;
      const q = w2s(sd.x, sd.y);
      ctx.strokeStyle = 'rgba(255,242,175,' + (0.20 + pu * 0.22) + ')';
      ctx.lineWidth = Math.max(1, R * 0.09);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(q[0], q[1]);
      ctx.stroke();
    }
  }

  // 毒气塔：整片毒雾（覆盖实际伤害范围）
  if (!iconMode && t.type === 'poison') {
    const pr = (st.range * 0.70 + 0.15) * cam.z;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    const pg = ctx.createRadialGradient(cx, cy, pr * 0.12, cx, cy, pr);
    pg.addColorStop(0, 'rgba(150,220,80,.32)');
    pg.addColorStop(0.55, 'rgba(115,185,55,.19)');
    pg.addColorStop(1, 'rgba(80,140,40,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(cx, cy, pr, 0, Math.PI * 2); ctx.fill();

    // 翻滚的雾团
    for (let i = 0; i < 6; i++) {
      const a2 = S.time * 0.55 + i * 1.047;
      const rr = pr * (0.30 + Math.sin(S.time * 1.3 + i) * 0.15);
      ctx.globalAlpha = 0.15 + Math.sin(S.time * 2 + i) * 0.06;
      ctx.fillStyle = i % 3 === 0 ? '#bef264' : '#84cc16';
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a2) * rr, cy + Math.sin(a2) * rr, pr * 0.30, 0, Math.PI * 2);
      ctx.fill();
    }

    // 上升气泡
    for (let i = 0; i < 5; i++) {
      const ph = (S.time * 0.5 + i * 0.2) % 1;
      ctx.globalAlpha = (1 - ph) * 0.6;
      ctx.fillStyle = '#d9f99d';
      ctx.beginPath();
      ctx.arc(cx + Math.sin(i * 2.6 + S.time) * pr * 0.55,
              cy + pr * 0.35 - ph * pr * 0.95,
              cam.z * 0.07 * (1 - ph * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  ctx.save();
  ctx.translate(cx, cy);
  if (!iconMode) {
    const sc = 1 + ((t.level || 1) - 1) * 0.075;
    ctx.scale(sc, sc);
    ctx.rotate(t.angle + Math.PI / 2);
    // 后坐：刚开火时向后缩一点
    const back = t.cd > 0 ? Math.min(0.16, (t.cd / Math.max(0.1, st.rate || 0.5)) * 0.18) : 0;
    ctx.translate(0, back * z);
  }

  const c = def.color;
  const dark = 'rgba(0,0,0,.35)';
  ctx.lineWidth = Math.max(1, R * 0.16);

  // 金属渐变
  const mg = ctx.createLinearGradient(-R, -R, R, R);
  mg.addColorStop(0, c);
  mg.addColorStop(0.5, shade(c, 0.72));
  mg.addColorStop(1, shade(c, 1.18));

  switch (def.icon) {
    case 'gun':
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.15, -R * 0.95, R * 0.3, R * 1.55);
      ctx.fillStyle = dark;
      ctx.fillRect(-R * 0.15, R * 0.2, R * 0.3, R * 0.4);
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.44, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = Math.max(0.6, R * 0.06);
      ctx.beginPath(); ctx.arc(0, 0, R * 0.3, -2.4, -0.6); ctx.stroke();
      break;

    case 'cannon':
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(-R * 0.38, R * 0.55);
      ctx.lineTo(-R * 0.26, -R * 0.75);
      ctx.lineTo(R * 0.26, -R * 0.75);
      ctx.lineTo(R * 0.38, R * 0.55);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(0, -R * 0.75, R * 0.26, R * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, R * 0.15, R * 0.46, 0, Math.PI * 2); ctx.fill();
      break;

    case 'frost':
      ctx.strokeStyle = c;
      ctx.lineWidth = Math.max(1.2, R * 0.18);
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + (S.time * 0.6);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * R * 0.85, Math.sin(a) * R * 0.85);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(Math.cos(a) * R * 0.85, Math.sin(a) * R * 0.85, R * 0.09, 0, Math.PI * 2);
        ctx.fillStyle = '#e8fbff';
        ctx.fill();
      }
      ctx.fillStyle = '#dff6ff';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.26, 0, Math.PI * 2); ctx.fill();
      break;

    case 'sniper':
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.11, -R * 1.1, R * 0.22, R * 1.75);
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.fillRect(-R * 0.11, -R * 0.2, R * 0.22, R * 0.3);
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, -R * 0.18, R * 0.38, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b2230';
      ctx.beginPath(); ctx.arc(0, -R * 0.18, R * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -R * 0.18, R * 0.1, 0, Math.PI * 2); ctx.fill();
      break;

    case 'flame':
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.95);
      ctx.quadraticCurveTo(R * 0.55, R * 0.15, 0, R * 0.8);
      ctx.quadraticCurveTo(-R * 0.55, R * 0.15, 0, -R * 0.95);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,240,180,.85)';
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.45);
      ctx.quadraticCurveTo(R * 0.24, R * 0.2, 0, R * 0.5);
      ctx.quadraticCurveTo(-R * 0.24, R * 0.2, 0, -R * 0.45);
      ctx.fill();
      break;

    case 'tesla':
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(-R * 0.22, -R * 0.95);
      ctx.lineTo(R * 0.32, -R * 0.18);
      ctx.lineTo(R * 0.04, -R * 0.12);
      ctx.lineTo(R * 0.3, R * 0.85);
      ctx.lineTo(-R * 0.32, R * 0.02);
      ctx.lineTo(0, 0);
      ctx.closePath(); ctx.fill();
      // 电球
      const pulse = 0.5 + Math.sin(S.time * 9) * 0.5;
      ctx.fillStyle = 'rgba(255,246,170,' + (0.5 + pulse * 0.5) + ')';
      ctx.beginPath(); ctx.arc(0, -R * 0.1, R * 0.2 + pulse * R * 0.06, 0, Math.PI * 2); ctx.fill();
      break;

    case 'barracks':
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.85);
      ctx.lineTo(R * 0.82, R * 0.5);
      ctx.lineTo(-R * 0.82, R * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.38)';
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.25);
      ctx.lineTo(R * 0.38, R * 0.5);
      ctx.lineTo(-R * 0.38, R * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8eef6';
      ctx.fillRect(-R * 0.04, -R * 1.1, R * 0.08, R * 0.6);
      break;
    case 'aa':
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.34, -R * 1.0, R * 0.18, R * 1.5);
      ctx.fillRect(R * 0.16, -R * 1.0, R * 0.18, R * 1.5);
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(-R * 0.34, -R * 0.28, R * 0.18, R * 0.16);
      ctx.fillRect(R * 0.16, -R * 0.28, R * 0.18, R * 0.16);
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, R * 0.2, R * 0.36, 0, Math.PI * 2); ctx.fill();
      break;

    case 'poison':
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, R * 0.55, R * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -R * 0.05, R * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -R * 0.6, R * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(40,80,20,.65)';
      ctx.beginPath(); ctx.arc(-R * 0.12, R * 0.5, R * 0.12, 0, Math.PI * 2); ctx.fill();
      break;

    case 'magnet':
      ctx.strokeStyle = mg; ctx.lineWidth = Math.max(2, R * 0.26);
      ctx.beginPath(); ctx.arc(0, 0, R * 0.55, Math.PI * 0.15, Math.PI * 0.85, false); ctx.stroke();
      ctx.fillStyle = '#e8eef6';
      ctx.fillRect(-R * 0.62, R * 0.1, R * 0.28, R * 0.3);
      ctx.fillRect(R * 0.34, R * 0.1, R * 0.28, R * 0.3);
      break;

    case 'holy':
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.13, -R * 0.85, R * 0.26, R * 1.7);
      ctx.fillRect(-R * 0.55, -R * 0.32, R * 1.1, R * 0.26);
      ctx.fillStyle = 'rgba(255,255,220,.55)';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.16, 0, Math.PI * 2); ctx.fill();
      break;

    case 'missile':
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.95);
      ctx.lineTo(R * 0.3, -R * 0.25);
      ctx.lineTo(R * 0.3, R * 0.5);
      ctx.lineTo(-R * 0.3, R * 0.5);
      ctx.lineTo(-R * 0.3, -R * 0.25);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(-R * 0.45, R * 0.3, R * 0.9, R * 0.22);
      ctx.fillStyle = '#ffb35c';
      ctx.beginPath();
      ctx.moveTo(-R * 0.16, R * 0.52); ctx.lineTo(0, R * 0.95); ctx.lineTo(R * 0.16, R * 0.52);
      ctx.closePath(); ctx.fill();
      break;

    case 'totem':
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.22, -R * 0.8, R * 0.44, R * 1.3);
      ctx.beginPath();
      ctx.moveTo(-R * 0.42, -R * 0.8); ctx.lineTo(0, -R * 1.05); ctx.lineTo(R * 0.42, -R * 0.8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.beginPath(); ctx.arc(-R * 0.1, -R * 0.35, R * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(R * 0.1, -R * 0.35, R * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.42, R * 0.5, R * 0.84, R * 0.16);
      break;

    case 'wind':
      ctx.strokeStyle = mg;
      ctx.lineWidth = Math.max(2, R * 0.22);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-R * 0.1, -R * 0.45 + i * R * 0.45, R * 0.55, -0.9, 1.5);
        ctx.stroke();
      }
      break;

    case 'railgun':
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.5, -R * 0.75, R * 0.14, R * 1.45);
      ctx.fillRect(R * 0.36, -R * 0.75, R * 0.14, R * 1.45);
      ctx.fillStyle = 'rgba(160,230,255,.85)';
      ctx.fillRect(-R * 0.36, -R * 0.2, R * 0.72, R * 0.14);
      ctx.fillStyle = mg;
      ctx.fillRect(-R * 0.55, R * 0.55, R * 1.1, R * 0.2);
      break;

    default:
      // 通用造型：菱形核心 + 外框
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.85);
      ctx.lineTo(R * 0.7, 0);
      ctx.lineTo(0, R * 0.85);
      ctx.lineTo(-R * 0.7, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(0, 0, R * 0.22, 0, Math.PI * 2); ctx.fill();
      break;
  }
  ctx.restore();

  // 火焰喷射锥
  if (!iconMode && t.type === 'flame' && t.firing) {
    const len = (st.range + 0.45) * cam.z;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.angle);
    ctx.globalCompositeOperation = 'lighter';
    const flick = 0.92 + Math.sin(S.time * 21) * 0.08;
    const fg = ctx.createRadialGradient(cam.z * 0.18, 0, cam.z * 0.08, 0, 0, len * flick);
    fg.addColorStop(0, 'rgba(255,252,220,.60)');
    fg.addColorStop(0.22, 'rgba(255,186,80,.42)');
    fg.addColorStop(0.55, 'rgba(255,112,32,.22)');
    fg.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, len * flick, -0.44, 0.44);
    ctx.closePath();
    ctx.fill();
    // 火星
    for (let i = 0; i < 6; i++) {
      const ph = (S.time * 2.6 + i * 0.62) % 1;
      const rr = len * (0.3 + ph * 0.66);
      const aa = Math.sin(i * 2.1 + S.time * 5) * 0.34;
      ctx.globalAlpha = (1 - ph) * 0.75;
      ctx.fillStyle = i % 2 ? '#ffd27a' : '#ff8a3d';
      ctx.beginPath();
      ctx.arc(Math.cos(aa) * rr, Math.sin(aa) * rr, cam.z * 0.055 * (1.2 - ph), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  if (!iconMode) {
    // 等级宝石
    const n = t.level;
    for (let i = 0; i < n; i++) {
      const px = cx - (n - 1) * z * 0.055 + i * z * 0.11;
      const py = cy + z * 0.43;
      ctx.fillStyle = i >= 3 ? '#ffe9a8' : '#ffc94a';
      ctx.beginPath();
      ctx.moveTo(px, py - z * 0.035);
      ctx.lineTo(px + z * 0.028, py);
      ctx.lineTo(px, py + z * 0.035);
      ctx.lineTo(px - z * 0.028, py);
      ctx.closePath(); ctx.fill();
    }
  }
}

const TOTEM_COLOR = {
  speed: '#ffd76a', heal: '#7ce8b0', shield: '#7fe3ff',
  ward: '#e8eef6', fly: '#c084fc',
  armor: '#a3a3a3', curse: '#ef4444', boom: '#fb923c',
  evade: '#22d3ee', split: '#f472b6', decay: '#84cc16',
  blind: '#64748b', frenzy: '#dc2626',
};

function drawZone(zn, z) {
  const q = w2s(zn.x, zn.y);
  const R = zn.r * z;
  const k = clamp(zn.life / zn.max, 0, 1);

  if (zn.kind === 'ice') {
    // 冰墙
    ctx.save();
    ctx.globalAlpha = 0.75 * k;
    const ig = ctx.createLinearGradient(q[0], q[1] - R, q[0], q[1] + R);
    ig.addColorStop(0, 'rgba(200,245,255,.85)');
    ig.addColorStop(0.5, 'rgba(120,210,255,.55)');
    ig.addColorStop(1, 'rgba(70,150,220,.35)');
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.moveTo(q[0] - R * 0.9, q[1] + R * 0.45);
    ctx.lineTo(q[0] - R * 0.45, q[1] - R * 0.75);
    ctx.lineTo(q[0] - R * 0.1, q[1] - R * 0.25);
    ctx.lineTo(q[0] + R * 0.3, q[1] - R * 0.85);
    ctx.lineTo(q[0] + R * 0.9, q[1] + R * 0.45);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = Math.max(1, z * 0.05);
    ctx.stroke();
    // 雪花
    ctx.globalAlpha = k;
    for (let i = 0; i < 8; i++) {
      const a = S.time * 0.8 + i * Math.PI / 4;
      const rx = q[0] + Math.cos(a) * R * (0.4 + (i % 3) * 0.25);
      const ry = q[1] + Math.sin(a * 1.3) * R * 0.6 - ((S.time * 20 + i * 30) % (R * 1.4));
      ctx.fillStyle = '#eafaff';
      ctx.beginPath();
      ctx.arc(rx, ry, z * 0.045, 0, Math.PI * 2);
      ctx.fill();
    }
    // 血条
    const hpR = clamp(zn.hp / zn.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(q[0] - R * 0.6, q[1] - R * 1.15, R * 1.2, Math.max(3, z * 0.07));
    ctx.fillStyle = '#9fe8ff';
    ctx.fillRect(q[0] - R * 0.6, q[1] - R * 1.15, R * 1.2 * hpR, Math.max(3, z * 0.07));
    ctx.restore();
  } else if (zn.kind === 'storm') {
    // 磁暴雨云
    ctx.save();
    ctx.globalAlpha = 0.85 * k;
    const cg = ctx.createRadialGradient(q[0], q[1] - R * 0.3, R * 0.2, q[0], q[1], R * 1.1);
    cg.addColorStop(0, 'rgba(90,110,140,.85)');
    cg.addColorStop(1, 'rgba(40,55,80,.25)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.ellipse(q[0], q[1] - R * 0.25, R * 0.95, R * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    // 雨
    ctx.strokeStyle = 'rgba(150,200,255,.55)';
    ctx.lineWidth = Math.max(1, z * 0.035);
    for (let i = 0; i < 12; i++) {
      const rx = q[0] + ((i * 37) % 100 - 50) / 50 * R * 0.8;
      const ry = q[1] + ((S.time * 260 + i * 41) % (R * 1.6)) - R * 0.2;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - R * 0.05, ry + R * 0.22);
      ctx.stroke();
    }
    // 闪电
    if (Math.sin(S.time * 7) > 0.85) {
      ctx.strokeStyle = 'rgba(180,230,255,.95)';
      ctx.lineWidth = Math.max(1.5, z * 0.06);
      ctx.beginPath();
      let lx = q[0] + rnd(-R * 0.5, R * 0.5), ly = q[1] - R * 0.15;
      ctx.moveTo(lx, ly);
      for (let i = 0; i < 4; i++) {
        lx += rnd(-R * 0.2, R * 0.2);
        ly += R * 0.22;
        ctx.lineTo(lx, ly);
      }
      ctx.stroke();
    }
    ctx.restore();
  } else if (zn.kind === 'tornado') {
    // 龙卷风
    ctx.save();
    ctx.globalAlpha = 0.9 * k;
    for (let i = 0; i < 9; i++) {
      const p2 = i / 8;
      const rr = R * (0.18 + p2 * 0.85);
      const yy = q[1] + R * 0.9 - p2 * R * 2.0;
      const a0 = S.time * (4 - p2 * 2) + i;
      ctx.strokeStyle = 'rgba(190,240,225,' + (0.75 - p2 * 0.4) + ')';
      ctx.lineWidth = Math.max(1.5, z * (0.10 - p2 * 0.06));
      ctx.beginPath();
      ctx.arc(q[0], yy, rr, a0, a0 + 2.4);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(160,225,205,.12)';
    ctx.beginPath(); ctx.ellipse(q[0], q[1] + R * 0.95, R * 0.9, R * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawTotem(tm, z) {
  const q = w2s(tm.cx, tm.cy);
  const col = TOTEM_COLOR[tm.variant] || '#ffd76a';
  const pu = 0.5 + Math.sin(S.time * 3) * 0.5;
  const rr = tm.r * z * 0.82;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 基础光域
  ctx.globalAlpha = 0.07 + pu * 0.04;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(q[0], q[1], rr, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  if (tm.variant === 'armor') {
    // 铁壁：金属护盾环层层收缩
    for (let i = 0; i < 3; i++) {
      const kk = (S.time * 0.7 + i * 0.33) % 1;
      ctx.globalAlpha = (1 - kk) * 0.85;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = Math.max(2, z * 0.10);
      ctx.beginPath();
      ctx.arc(q[0], q[1], rr * (0.35 + kk * 0.6), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#94a3b8';
    for (let i = 0; i < 6; i++) {
      const a2 = i * Math.PI / 3 + S.time * 0.5;
      ctx.fillRect(q[0] + Math.cos(a2) * rr * 0.72 - z * 0.06,
                   q[1] + Math.sin(a2) * rr * 0.72 - z * 0.06, z * 0.12, z * 0.12);
    }
    ctx.globalAlpha = 1;
  } else if (tm.variant === 'curse') {
    // 咒怨：暗红尖刺 + 逆时针符环
    ctx.strokeStyle = '#ef4444';
    ctx.globalAlpha = 0.55 + pu * 0.35;
    ctx.lineWidth = Math.max(2, z * 0.09);
    for (let i = 0; i < 8; i++) {
      const a2 = -S.time * 1.4 + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(q[0] + Math.cos(a2) * rr * 0.45, q[1] + Math.sin(a2) * rr * 0.45);
      ctx.lineTo(q[0] + Math.cos(a2) * rr * 0.82, q[1] + Math.sin(a2) * rr * 0.82);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.30 + pu * 0.25;
    ctx.strokeStyle = '#7f1d1d';
    ctx.beginPath(); ctx.arc(q[0], q[1], rr * 0.88, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (tm.variant === 'boom') {
    // 引爆：橙色脉冲三连
    for (let i = 0; i < 3; i++) {
      const kk = (S.time * 1.1 + i * 0.33) % 1;
      ctx.globalAlpha = (1 - kk) * 0.95;
      ctx.strokeStyle = '#fb923c';
      ctx.lineWidth = Math.max(2, z * 0.11);
      ctx.beginPath();
      ctx.arc(q[0], q[1], rr * (0.2 + kk * 0.85), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#fdba74';
    for (let i = 0; i < 5; i++) {
      const a2 = i * Math.PI * 2 / 5 + S.time * 2.5;
      ctx.beginPath();
      ctx.arc(q[0] + Math.cos(a2) * rr * 0.55, q[1] + Math.sin(a2) * rr * 0.55,
              z * 0.09 * (0.6 + pu * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (tm.variant === 'speed') {
    // 疾行：高速环绕的气流弧
    for (let i = 0; i < 4; i++) {
      const a2 = S.time * 3.6 + i * Math.PI / 2;
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.55 + pu * 0.3;
      ctx.lineWidth = Math.max(1.5, z * 0.10);
      ctx.beginPath();
      ctx.arc(q[0], q[1], rr * (0.42 + i * 0.15), a2, a2 + 1.1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (tm.variant === 'heal') {
    // 回生：不断升起的十字
    for (let i = 0; i < 4; i++) {
      const ph = (S.time * 0.65 + i * 0.25) % 1;
      ctx.globalAlpha = (1 - ph) * 0.95;
      ctx.fillStyle = col;
      const px = q[0] + Math.sin(i * 2.1 + S.time) * rr * 0.55;
      const py = q[1] + rr * 0.45 - ph * rr * 1.25;
      const ss = z * 0.11;
      ctx.fillRect(px - ss * 0.30, py - ss, ss * 0.6, ss * 2);
      ctx.fillRect(px - ss, py - ss * 0.30, ss * 2, ss * 0.6);
      ctx.globalAlpha = 1;
    }
  } else if (tm.variant === 'shield') {
    // 守护：双层六边形护罩
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.2, z * 0.07);
    for (let ring = 0; ring < 2; ring++) {
      ctx.globalAlpha = (ring ? 0.28 : 0.55) + pu * 0.25;
      const k = 0.55 + ring * 0.38;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a2 = i * Math.PI / 3 + S.time * 0.45;
        const px = q[0] + Math.cos(a2) * rr * k;
        const py = q[1] + Math.sin(a2) * rr * k;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (tm.variant === 'ward') {
    // 净化：白色光环 + 环绕星点
    ctx.strokeStyle = '#ffffff';
    ctx.globalAlpha = 0.5 + pu * 0.45;
    ctx.lineWidth = Math.max(1.5, z * 0.09);
    ctx.beginPath();
    ctx.arc(q[0], q[1], rr * (0.74 + pu * 0.09), 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a2 = i * Math.PI / 3 + S.time * 1.3;
      ctx.globalAlpha = 0.45 + pu * 0.55;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(q[0] + Math.cos(a2) * rr * 0.8, q[1] + Math.sin(a2) * rr * 0.8, z * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (tm.variant === 'fly') {
    // 浮空：上升气流柱 + 粒子
    const bg = ctx.createLinearGradient(q[0], q[1] + rr * 0.5, q[0], q[1] - rr * 0.95);
    bg.addColorStop(0, 'rgba(192,132,252,0)');
    bg.addColorStop(0.5, 'rgba(192,132,252,.26)');
    bg.addColorStop(1, 'rgba(192,132,252,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(q[0] - rr * 0.33, q[1] - rr * 0.95, rr * 0.66, rr * 1.45);
    for (let i = 0; i < 5; i++) {
      const ph = (S.time * 0.85 + i * 0.2) % 1;
      ctx.globalAlpha = (1 - ph) * 0.9;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(q[0] + Math.sin(i * 1.7 + S.time * 2) * rr * 0.6,
              q[1] + rr * 0.5 - ph * rr * 1.45, z * 0.09, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();

  // 图腾柱
  ctx.fillStyle = '#4a3620';
  ctx.fillRect(q[0] - z * 0.13, q[1] - z * 0.55, z * 0.26, z * 1.05);
  ctx.fillStyle = '#6b4f2a';
  ctx.fillRect(q[0] - z * 0.18, q[1] - z * 0.62, z * 0.36, z * 0.16);

  // 顶部宝珠
  const og = ctx.createRadialGradient(q[0], q[1] - z * 0.78, 0, q[0], q[1] - z * 0.78, z * 0.34);
  og.addColorStop(0, '#ffffff');
  og.addColorStop(0.4, col);
  og.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = og;
  ctx.beginPath(); ctx.arc(q[0], q[1] - z * 0.78, z * 0.34, 0, Math.PI * 2); ctx.fill();

  // 符文环
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1, z * 0.05);
  ctx.globalAlpha = 0.6 + pu * 0.4;
  ctx.beginPath();
  ctx.arc(q[0], q[1] - z * 0.78, z * (0.42 + pu * 0.06), S.time * 2, S.time * 2 + Math.PI * 1.5);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 血条
  const hpR = clamp(tm.hp / tm.maxHp, 0, 1);
  const bw = z * 0.92, bh = Math.max(3, z * 0.08);
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(q[0] - bw / 2 - 1, q[1] - z * 1.15 - bh - 2, bw + 2, bh + 2);
  ctx.fillStyle = hpR > 0.4 ? col : '#ff6b6b';
  ctx.fillRect(q[0] - bw / 2, q[1] - z * 1.15 - bh - 1, bw * hpR, bh);
}

function drawObstacle(o, z) {
  const def = OBSTACLE_DEF[o.kind] || OBSTACLE_SEAL;
  if (!isFinite(o.x) || !isFinite(o.y)) return;
  const sz = o.size || 1;
  const [sx, sy] = w2s(o.x, o.y);
  const w = z * sz;
  const ratio = clamp(o.hp / (o.maxHp || 1), 0, 1);
  const pad = z * 0.08;

  // 落影
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  roundRect(sx + pad * 0.7 + z * 0.05, sy + pad * 0.7 + z * 0.08,
            w - pad * 1.4, w - pad * 1.4, z * 0.18);
  ctx.fill();

  ctx.save();
  ctx.translate(sx + w / 2, sy + w / 2);
  const c = def.color;

  if (o.kind === 'tree') {
    // 树干
    ctx.fillStyle = '#4a3928';
    ctx.beginPath();
    ctx.moveTo(-z * 0.07, z * 0.34);
    ctx.lineTo(-z * 0.04, -z * 0.02);
    ctx.lineTo(z * 0.04, -z * 0.02);
    ctx.lineTo(z * 0.07, z * 0.34);
    ctx.closePath(); ctx.fill();
    // 三层树冠
    const layers = [[0, -z * 0.12, z * 0.30], [-z * 0.10, -z * 0.22, z * 0.22], [z * 0.10, -z * 0.24, z * 0.20]];
    layers.forEach(([dx, dy, r], i) => {
      const g = ctx.createRadialGradient(dx - r * 0.3, dy - r * 0.3, r * 0.1, dx, dy, r);
      g.addColorStop(0, shade(c, 1.35));
      g.addColorStop(1, shade(c, 0.65));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill();
    });

  } else if (o.kind === 'crate') {
    const s = z * 0.62;
    ctx.fillStyle = '#8a6a3f';
    roundRect(-s / 2, -s / 2, s, s, z * 0.05); ctx.fill();
    // 木板纹
    ctx.strokeStyle = 'rgba(0,0,0,.28)';
    ctx.lineWidth = Math.max(1, z * 0.03);
    for (let i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-s / 2, -s / 2 + s * i / 3);
      ctx.lineTo(s / 2, -s / 2 + s * i / 3);
      ctx.stroke();
    }
    ctx.strokeStyle = '#5f4526';
    ctx.lineWidth = Math.max(1, z * 0.05);
    ctx.beginPath();
    ctx.moveTo(-s / 2, -s / 2); ctx.lineTo(s / 2, s / 2);
    ctx.moveTo(s / 2, -s / 2); ctx.lineTo(-s / 2, s / 2);
    ctx.stroke();
    ctx.strokeRect(-s / 2, -s / 2, s, s);
    // 钉子
    ctx.fillStyle = 'rgba(230,230,240,.5)';
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => {
      ctx.beginPath(); ctx.arc(a * s * 0.34, b * s * 0.34, z * 0.022, 0, Math.PI * 2); ctx.fill();
    });

  } else if (o.kind === 'crystal') {
    const pulse = 0.7 + Math.sin(S.time * 3) * 0.3;
    // 外发光
    ctx.globalAlpha = 0.25 * pulse;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, z * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // 宝石本体
    const g = ctx.createLinearGradient(-z * 0.2, -z * 0.4, z * 0.2, z * 0.4);
    g.addColorStop(0, '#e8fbff');
    g.addColorStop(0.5, c);
    g.addColorStop(1, shade(c, 0.6));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -z * 0.44); ctx.lineTo(z * 0.26, 0);
    ctx.lineTo(0, z * 0.44); ctx.lineTo(-z * 0.26, 0);
    ctx.closePath(); ctx.fill();
    // 切面
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = Math.max(0.8, z * 0.02);
    ctx.beginPath();
    ctx.moveTo(0, -z * 0.44); ctx.lineTo(0, z * 0.44);
    ctx.moveTo(-z * 0.26, 0); ctx.lineTo(z * 0.26, 0);
    ctx.stroke();

  } else if (o.kind === 'ruin') {
    // 两块石柱 + 横梁，带裂纹
    const g = ctx.createLinearGradient(-w * 0.35, -w * 0.4, w * 0.35, w * 0.4);
    g.addColorStop(0, shade(c, 1.25));
    g.addColorStop(1, shade(c, 0.7));
    ctx.fillStyle = g;
    ctx.fillRect(-w * 0.32, -w * 0.28, w * 0.17, w * 0.60);
    ctx.fillRect(w * 0.15, -w * 0.28, w * 0.17, w * 0.60);
    ctx.fillRect(-w * 0.37, -w * 0.40, w * 0.74, w * 0.13);
    // 柱头
    ctx.fillStyle = shade(c, 1.35);
    ctx.fillRect(-w * 0.35, -w * 0.30, w * 0.23, w * 0.05);
    ctx.fillRect(w * 0.12, -w * 0.30, w * 0.23, w * 0.05);
    // 暗部
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(-w * 0.32, -w * 0.28, w * 0.06, w * 0.60);
    // 裂纹
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth = Math.max(0.8, z * 0.018);
    ctx.beginPath();
    ctx.moveTo(-w * 0.24, -w * 0.1); ctx.lineTo(-w * 0.19, w * 0.06);
    ctx.moveTo(w * 0.2, -w * 0.18); ctx.lineTo(w * 0.26, w * 0.02);
    ctx.stroke();

  } else {
    // 岩石 / 巨岩：多面体
    const s = w * (sz >= 2 ? 0.84 : 0.74);
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, s * 0.1);
    ctx.lineTo(-s * 0.34, -s * 0.42);
    ctx.lineTo(s * 0.1, -s * 0.5);
    ctx.lineTo(s * 0.46, -s * 0.16);
    ctx.lineTo(s * 0.42, s * 0.36);
    ctx.lineTo(-s * 0.1, s * 0.48);
    ctx.closePath();
    const g = ctx.createLinearGradient(-s * 0.4, -s * 0.4, s * 0.4, s * 0.4);
    g.addColorStop(0, shade(c, 1.3));
    g.addColorStop(0.6, c);
    g.addColorStop(1, shade(c, 0.62));
    ctx.fillStyle = g;
    ctx.fill();
    // 亮面
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath();
    ctx.moveTo(-s * 0.34, -s * 0.42);
    ctx.lineTo(s * 0.1, -s * 0.5);
    ctx.lineTo(s * 0.05, -s * 0.1);
    ctx.lineTo(-s * 0.25, -s * 0.05);
    ctx.closePath(); ctx.fill();
    // 裂纹随血量增多
    if (ratio < 0.95) {
      ctx.strokeStyle = 'rgba(0,0,0,' + (0.2 + (1 - ratio) * 0.45) + ')';
      ctx.lineWidth = Math.max(1, z * 0.035);
      const n = Math.floor((1 - ratio) * 4) + 1;
      for (let i = 0; i < n; i++) {
        const a = hash2(o.x * 3 + i, o.y * 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * s * 0.08, Math.sin(a) * s * 0.08);
        ctx.lineTo(Math.cos(a + 0.6) * s * 0.34, Math.sin(a + 0.6) * s * 0.34);
        ctx.stroke();
      }
    }
  }
  ctx.restore();

  // 掉落炮塔标记
  if (def.reward === 'tower') {
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = '700 ' + Math.max(9, z * 0.28) + 'px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', sx + w / 2, sy + z * 0.34);
    ctx.textAlign = 'start';
  }

  // 血条
  if (ratio < 1) {
    const bw = w * 0.68, bh = Math.max(2.5, z * 0.07);
    const bx = sx + (w - bw) / 2, by = sy + w - bh - z * 0.05;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = ratio > 0.5 ? '#7be29a' : ratio > 0.25 ? '#ffc94a' : '#ff6b6b';
    ctx.fillRect(bx, by, bw * ratio, bh);
  }
}

function drawEnemy(e) {
  if (e.type === 'ufo') { drawUfo(e); return; }
  if (e.giant) { drawGiant(e); return; }
  if (e.type === 'totemMage') { drawMage(e); return; }
  if (e.type === 'flock') { drawFlockBird(e); return; }
  {
    const tex = enemyTex(e);
    if (tex && tex.complete && tex.width) { drawTexEnemy(e); return; }
  }
  const d = ENEMY_DEF[e.type];
  const [sx, sy0] = w2s(e.x, e.y);
  let sy = sy0;
  if (e.route === 0 && S.mergeIdx && e.t < S.mergeIdx[0]) sy -= cam.z * BRIDGE_LIFT;
  const r = d.r * cam.z;
  const hpR = clamp(e.hp / e.maxHp, 0, 1);
  const bob = e.flying ? Math.sin(S.time * 5 + e.t) * r * 0.12 : Math.sin(S.time * 7 + e.t * 2) * r * 0.05;
  const alt = e.flying ? cam.z * 0.16 : 0;

  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + r * 0.6, r * (e.flying ? 0.6 : 0.85), r * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();

  // 冲刺残影
  if (e.dashT > 0) {
    for (const back of [0.7, 1.3]) {
      const pp = pathPos(Math.max(0, e.t - back), e.route);
      const [qx, qy] = w2s(pp.x, pp.y);
      ctx.globalAlpha = back < 1 ? 0.26 : 0.12;
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(qx, qy, r * (back < 1 ? 0.85 : 0.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(sx, sy - alt + bob);

  // 身体渐变
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.1);
  g.addColorStop(0, shade(d.color, 1.35));
  g.addColorStop(0.7, d.color);
  g.addColorStop(1, shade(d.color, 0.62));

  ctx.fillStyle = g;
  ctx.strokeStyle = 'rgba(0,0,0,.5)';
  ctx.lineWidth = Math.max(1, r * 0.13);

  if (d.shape === 'circle') {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (d.shape === 'tri') {
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.05); ctx.lineTo(r * 0.95, r * 0.72); ctx.lineTo(-r * 0.95, r * 0.72);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 翅膀
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.75, -r * 0.1, r * 0.45, r * 0.18, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.75, -r * 0.1, r * 0.45, r * 0.18, 0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (d.shape === 'square') {
    const s = r * 0.82;
    roundRect(-s, -s, s * 2, s * 2, r * 0.2);
    ctx.fill(); ctx.stroke();
    // 装甲片
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    roundRect(-s * 0.7, -s * 0.8, s * 1.4, s * 0.34, r * 0.1); ctx.fill();
  } else {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2;
      const rr = i % 2 ? r * 0.52 : r;
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // ── 各类小怪的专属外形特征 ──
  if (e.type === 'normal') {
    ctx.fillStyle = '#3c4a34';
    for (const sxg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sxg * r * 0.45, -r * 0.75);
      ctx.lineTo(sxg * r * 0.75, -r * 1.25);
      ctx.lineTo(sxg * r * 0.72, -r * 0.62);
      ctx.closePath(); ctx.fill();
    }
  } else if (e.type === 'fast') {
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (const sxg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sxg * r * 0.8, r * 0.35);
      ctx.lineTo(sxg * r * 1.45, r * 0.62);
      ctx.lineTo(sxg * r * 0.8, r * 0.68);
      ctx.closePath(); ctx.fill();
    }
  } else if (e.type === 'tank' || e.type === 'armored') {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(-r * 0.6, -r * 0.15, r * 1.2, r * 0.3);
    ctx.fillStyle = 'rgba(255,120,120,.85)';
    ctx.fillRect(-r * 0.45, -r * 0.06, r * 0.9, r * 0.12);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (const [ox, oy] of [[-0.55, -0.6], [0.55, -0.6], [-0.55, 0.6], [0.55, 0.6]]) {
      ctx.beginPath(); ctx.arc(ox * r, oy * r, r * 0.09, 0, Math.PI * 2); ctx.fill();
    }
  } else if (e.type === 'swarm') {
    ctx.strokeStyle = 'rgba(30,40,20,.9)';
    ctx.lineWidth = Math.max(1, r * 0.16);
    for (let i = 0; i < 3; i++) {
      const a = -0.6 + i * 0.6;
      ctx.beginPath();
      ctx.moveTo(0, r * 0.3);
      ctx.lineTo(Math.cos(a + Math.PI / 2) * r * 1.2, r * 0.3 + Math.sin(a + Math.PI / 2) * r * 0.1);
      ctx.stroke();
    }
  } else if (e.type === 'ghost' || e.type === 'warlock' || e.type === 'summoner') {
    // 长袍 / 残影下摆
    ctx.fillStyle = 'rgba(30,20,50,.55)';
    ctx.beginPath();
    ctx.moveTo(-r * 0.85, r * 0.35);
    ctx.quadraticCurveTo(0, r * 1.9, r * 0.85, r * 0.35);
    ctx.closePath(); ctx.fill();
    if (e.type === 'warlock') {
      ctx.fillStyle = '#3b2455';
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.55);
      ctx.lineTo(r * 0.85, -r * 0.55);
      ctx.lineTo(-r * 0.85, -r * 0.55);
      ctx.closePath(); ctx.fill();
    }
    if (e.type === 'summoner') {
      ctx.fillStyle = 'rgba(192,132,252,.9)';
      ctx.beginPath(); ctx.arc(0, r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();
    }
  } else if (e.type === 'medic') {
    ctx.fillStyle = '#0f2a1c';
    ctx.fillRect(-r * 0.42, -r * 0.1, r * 0.84, r * 0.22);
    ctx.fillRect(-r * 0.12, -r * 0.44, r * 0.24, r * 0.9);
  } else if (e.type === 'bomber' || e.type === 'kamikaze') {
    ctx.strokeStyle = '#4a3320';
    ctx.lineWidth = Math.max(1.2, r * 0.14);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.95);
    ctx.quadraticCurveTo(r * 0.4, -r * 1.4, r * 0.15, -r * 1.7);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,220,120,.95)';
    ctx.beginPath(); ctx.arc(r * 0.15, -r * 1.72, r * 0.14, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'digger') {
    ctx.fillStyle = '#8d99a8';
    ctx.beginPath();
    ctx.moveTo(0, r * 1.25);
    ctx.lineTo(r * 0.45, r * 0.55);
    ctx.lineTo(-r * 0.45, r * 0.55);
    ctx.closePath(); ctx.fill();
  } else if (e.type === 'splitter') {
    ctx.fillStyle = 'rgba(168,216,168,.75)';
    ctx.beginPath(); ctx.arc(-r * 0.55, r * 0.45, r * 0.26, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.55, r * 0.45, r * 0.26, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'frostTroll') {
    ctx.fillStyle = 'rgba(200,240,255,.8)';
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + 0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
      ctx.lineTo(Math.cos(a) * r * 1.45, Math.sin(a) * r * 1.45);
      ctx.lineTo(Math.cos(a + 0.3) * r * 0.8, Math.sin(a + 0.3) * r * 0.8);
      ctx.closePath(); ctx.fill();
    }
  } else if (e.type === 'gargoyle') {
    ctx.fillStyle = 'rgba(120,130,150,.85)';
    for (const sxg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sxg * r * 0.5, -r * 0.3);
      ctx.lineTo(sxg * r * 1.5, -r * 0.75);
      ctx.lineTo(sxg * r * 1.35, r * 0.25);
      ctx.lineTo(sxg * r * 0.6, r * 0.15);
      ctx.closePath(); ctx.fill();
    }
  } else if (e.type === 'rider') {
    // 骑手：头顶小人 + 鞍
    ctx.fillStyle = '#3b4a5a';
    ctx.fillRect(-r * 0.36, -r * 0.62, r * 0.72, r * 0.16);
    ctx.fillStyle = '#f0e6d2';
    ctx.beginPath(); ctx.arc(0, -r * 0.92, r * 0.26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-r * 0.20, -r * 1.22, r * 0.40, r * 0.14);
    ctx.strokeStyle = '#e8d9b8';
    ctx.lineWidth = Math.max(1, r * 0.10);
    ctx.beginPath();
    ctx.moveTo(r * 0.26, -r * 0.55);
    ctx.lineTo(r * 0.62, -r * 0.15);
    ctx.stroke();
  } else if (e.type === 'bird') {
    // 脱缰坐骑：展开双翼
    ctx.fillStyle = 'rgba(255,210,140,.75)';
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sgn * r * 0.35, -r * 0.15);
      ctx.lineTo(sgn * r * 1.7, -r * 0.55);
      ctx.lineTo(sgn * r * 1.5, r * 0.25);
      ctx.closePath(); ctx.fill();
    }
  } else if (e.type === 'thief') {
    ctx.fillStyle = 'rgba(25,20,15,.8)';
    ctx.beginPath();
    ctx.arc(0, -r * 0.35, r * 0.75, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  // ── 首领 / 空中母舰：压迫感造型 ──
  if (e.type === 'boss' || e.type === 'dragon') {
    const t0 = S.time;
    const pulse = 0.5 + Math.sin(t0 * 3) * 0.5;

    // 外圈暗红煞气
    const ag = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 2.3);
    ag.addColorStop(0, 'rgba(120,10,10,.42)');
    ag.addColorStop(1, 'rgba(120,10,10,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.3, 0, Math.PI * 2); ctx.fill();

    // 放射状尖刺冠
    const spikes = e.type === 'dragon' ? 12 : 9;
    for (let i = 0; i < spikes; i++) {
      const a = i / spikes * Math.PI * 2 + t0 * 0.35;
      const rr = r * (1.05 + Math.sin(t0 * 5 + i) * 0.08);
      ctx.fillStyle = i % 2 ? '#2a0a0a' : '#57101 0'.replace(' ', '');
      ctx.fillStyle = i % 2 ? '#2a0a0a' : '#5a1212';
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.16) * r * 0.9, Math.sin(a - 0.16) * r * 0.9);
      ctx.lineTo(Math.cos(a) * rr * 1.55, Math.sin(a) * rr * 1.55);
      ctx.lineTo(Math.cos(a + 0.16) * r * 0.9, Math.sin(a + 0.16) * r * 0.9);
      ctx.closePath(); ctx.fill();
    }

    // 三只血红眼
    const eyes = e.type === 'dragon' ? [[-0.45, -0.12], [0, -0.3], [0.45, -0.12]] : [[-0.34, -0.1], [0.34, -0.1], [0, -0.42]];
    for (const [ex, ey2] of eyes) {
      ctx.fillStyle = '#1a0000';
      ctx.beginPath(); ctx.ellipse(ex * r, ey2 * r, r * 0.16, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,40,40,' + (0.75 + pulse * 0.25) + ')';
      ctx.beginPath(); ctx.arc(ex * r, ey2 * r, r * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex * r - r * 0.02, ey2 * r - r * 0.02, r * 0.03, 0, Math.PI * 2); ctx.fill();
    }

    // 獠牙
    ctx.fillStyle = '#e8e2d8';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.14 - r * 0.045, r * 0.42);
      ctx.lineTo(i * r * 0.14, r * 0.66 + Math.abs(i) * r * 0.03);
      ctx.lineTo(i * r * 0.14 + r * 0.045, r * 0.42);
      ctx.closePath(); ctx.fill();
    }
  }

  // 眼睛
  const eyeY = -r * 0.12;
  ctx.fillStyle = '#10151c';
  ctx.beginPath(); ctx.arc(-r * 0.3, eyeY, r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.3, eyeY, r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(-r * 0.26, eyeY - r * 0.05, r * 0.05, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.34, eyeY - r * 0.05, r * 0.05, 0, Math.PI * 2); ctx.fill();

  // 状态
  if (e.slowT > 0) {
    ctx.strokeStyle = 'rgba(90,209,255,.9)';
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.28, 0, Math.PI * 2); ctx.stroke();
  }
  if (e.markT > 0) {
    ctx.strokeStyle = 'rgba(192,132,252,.9)';
    ctx.setLineDash([r * 0.3, r * 0.22]);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.42, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  if (e.burnT > 0) {
    ctx.fillStyle = 'rgba(255,140,40,.55)';
    ctx.beginPath();
    ctx.arc(-r * 0.3, -r * 0.95, r * 0.22, 0, Math.PI * 2);
    ctx.arc(r * 0.25, -r * 1.02, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
  if (e.shield > 0) {
    const p = clamp(e.shield / (e.shieldMax || 1), 0, 1);
    ctx.strokeStyle = 'rgba(120,220,255,' + (0.45 + p * 0.5) + ')';
    ctx.lineWidth = Math.max(1.6, r * 0.18);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
    ctx.stroke();
  }
  if (e.enraged) {
    const pulse = 0.6 + Math.sin(S.time * 10) * 0.4;
    ctx.strokeStyle = 'rgba(255,80,80,' + (0.45 + pulse * 0.4) + ')';
    ctx.lineWidth = Math.max(1.6, r * 0.14);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.65 + pulse * r * 0.1, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();

  // ── 怪物技能视觉 ──
  const tt = S.time;
  const cyb = sy - alt + bob;

  if (e.type === 'medic') {
    const g2 = ctx.createRadialGradient(sx, cyb, r * 0.4, sx, cyb, r * 2.6);
    g2.addColorStop(0, 'rgba(124,232,176,.30)');
    g2.addColorStop(1, 'rgba(124,232,176,0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(sx, cyb, r * 2.6, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const ph = (tt * 0.7 + i / 3) % 1;
      ctx.globalAlpha = 1 - ph;
      ctx.fillStyle = '#7ce8b0';
      ctx.fillRect(sx - r * 0.1 + Math.sin(i * 2) * r * 0.8, cyb - r * (0.5 + ph * 2), r * 0.22, r * 0.6);
      ctx.fillRect(sx - r * 0.3 + Math.sin(i * 2) * r * 0.8, cyb - r * (0.35 + ph * 2), r * 0.6, r * 0.22);
      ctx.globalAlpha = 1;
    }
  } else if (e.type === 'bomber' || e.type === 'kamikaze') {
    const pu = 0.5 + Math.sin(tt * 12) * 0.5;
    ctx.fillStyle = 'rgba(255,90,60,' + (0.12 + pu * 0.22) + ')';
    ctx.beginPath(); ctx.arc(sx, cyb, r * (1.3 + pu * 0.5), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,140,80,' + (0.4 + pu * 0.5) + ')';
    ctx.lineWidth = Math.max(1, r * 0.1);
    ctx.beginPath(); ctx.arc(sx, cyb, r * (1.25 + pu * 0.4), 0, Math.PI * 2); ctx.stroke();
  } else if (e.type === 'digger' && e.burrowT > 0) {
    ctx.fillStyle = 'rgba(120,90,50,.85)';
    ctx.beginPath();
    ctx.ellipse(sx, cyb + r * 0.7, r * 1.1, r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = tt * 4 + i * 1.6;
      ctx.fillStyle = 'rgba(150,115,70,.6)';
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a) * r * 1.2, cyb + r * 0.6 + Math.sin(a) * r * 0.3, r * 0.14, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (e.type === 'summoner') {
    ctx.strokeStyle = 'rgba(192,132,252,.75)';
    ctx.lineWidth = Math.max(1, r * 0.09);
    for (let i = 0; i < 2; i++) {
      const a0 = tt * 1.6 + i * Math.PI;
      ctx.beginPath();
      ctx.arc(sx, cyb, r * (1.5 + i * 0.35), a0, a0 + 1.9);
      ctx.stroke();
    }
  } else if (e.type === 'mimic') {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#7fe3ff';
    ctx.beginPath(); ctx.arc(sx - r * 0.5, cyb + r * 0.2, r * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (e.type === 'frostTroll') {
    const g3 = ctx.createRadialGradient(sx, cyb, r * 0.5, sx, cyb, r * 2.2);
    g3.addColorStop(0, 'rgba(159,216,255,.22)');
    g3.addColorStop(1, 'rgba(159,216,255,0)');
    ctx.fillStyle = g3;
    ctx.beginPath(); ctx.arc(sx, cyb, r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(200,240,255,.5)';
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.setLineDash([r * 0.35, r * 0.25]);
    ctx.beginPath(); ctx.arc(sx, cyb, r * 1.5, tt, tt + Math.PI * 1.6); ctx.stroke();
    ctx.setLineDash([]);
  } else if (e.type === 'thief') {
    for (let i = 0; i < 3; i++) {
      const ph = (tt * 1.4 + i * 0.33) % 1;
      ctx.globalAlpha = (1 - ph) * 0.9;
      ctx.fillStyle = '#ffc94a';
      ctx.beginPath();
      ctx.arc(sx + Math.sin(ph * 6 + i) * r * 0.9, cyb - ph * r * 1.6, r * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else if (e.type === 'armored') {
    ctx.strokeStyle = 'rgba(220,230,245,.35)';
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.beginPath();
    ctx.moveTo(sx - r * 0.7, cyb - r * 0.3); ctx.lineTo(sx, cyb - r * 0.85);
    ctx.lineTo(sx + r * 0.7, cyb - r * 0.3);
    ctx.stroke();
  } else if (e.type === 'gargoyle') {
    ctx.fillStyle = 'rgba(200,210,225,.25)';
    ctx.beginPath(); ctx.arc(sx + r * 0.3, cyb - r * 0.2, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx - r * 0.35, cyb + r * 0.25, r * 0.12, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'ghost' && e.ghostT > 0) {
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#d8ccff';
    ctx.lineWidth = Math.max(1, r * 0.1);
    ctx.setLineDash([r * 0.25, r * 0.2]);
    ctx.beginPath(); ctx.arc(sx, cyb, r * 1.35, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // 血条（带边框）
  const bw = Math.max(r * 2.1, cam.z * 0.5), bh = Math.max(3, cam.z * 0.08);
  const bx = sx - bw / 2, by = sy - alt - r - bh - 4;
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(bx - 1.5, by - 1.5, bw + 3, bh + 3);
  const hg = ctx.createLinearGradient(bx, by, bx, by + bh);
  hg.addColorStop(0, hpR > 0.5 ? '#9df0b5' : hpR > 0.25 ? '#ffd76a' : '#ff9a9a');
  hg.addColorStop(1, hpR > 0.5 ? '#3fae63' : hpR > 0.25 ? '#d99a1e' : '#d33');
  ctx.fillStyle = hg;
  ctx.fillRect(bx, by, bw * hpR, bh);
  // 护盾条叠在上方
  if (e.shieldMax > 0) {
    const sp = clamp(e.shield / e.shieldMax, 0, 1);
    ctx.fillStyle = 'rgba(120,220,255,.85)';
    ctx.fillRect(bx, by - bh - 1, bw * sp, bh * 0.7);
  }
}

const _glowCache = new Map();
function glowSprite(col) {
  let c = _glowCache.get(col);
  if (c) return c;
  const size = 64;
  c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(0.35, col);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  _glowCache.set(col, c);
  return c;
}

function drawShot(s) {
  const z = cam.z;
  const [sx, sy] = w2s(s.x, s.y);
  const prev = (s.px != null) ? w2s(s.px, s.py) : null;
  const ang = prev ? Math.atan2(sy - prev[1], sx - prev[0]) : 0;

  const trail = (col, w, a, back) => {
    if (!prev) return;
    const bx = sx - Math.cos(ang) * back;
    const by = sy - Math.sin(ang) * back;
    ctx.strokeStyle = col;
    ctx.globalAlpha = a;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineCap = 'butt';
  };
  const orb = (col, rad) => {
    // 用预渲染贴图代替每次新建渐变（子弹数量多时收益显著）
    const img = glowSprite(col);
    ctx.drawImage(img, sx - rad, sy - rad, rad * 2, rad * 2);
  };

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  switch (s.type) {
    case 'railgun': {
      // 白热长光束 + 电弧
      trail('rgba(56,189,248,.95)', z * 0.16, 0.95, z * 2.6);
      trail('rgba(255,255,255,.95)', z * 0.06, 1, z * 2.6);
      orb('#38bdf8', z * 0.34);
      ctx.strokeStyle = 'rgba(200,245,255,.9)';
      ctx.lineWidth = z * 0.035;
      ctx.beginPath();
      ctx.arc(sx, sy, z * 0.30, 0, Math.PI * 2);
      ctx.stroke();
      break;
    }
    case 'sniper': {
      trail('rgba(192,132,252,.9)', z * 0.09, 0.85, z * 1.6);
      orb('#c084fc', z * 0.26);
      break;
    }
    case 'cannon': {
      trail('rgba(120,90,60,.85)', z * 0.16, 0.7, z * 1.3);
      for (let i = 0; i < 3; i++) {
        const d = i * 0.28;
        ctx.globalAlpha = 0.35 - i * 0.1;
        ctx.fillStyle = '#8a7663';
        ctx.beginPath();
        ctx.arc(sx - Math.cos(ang) * d * z + 0, sy - Math.sin(ang) * d * z, z * (0.16 - i * 0.04), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#3a2c1c';
      ctx.beginPath(); ctx.arc(sx, sy, z * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffb35c';
      ctx.lineWidth = z * 0.045;
      ctx.beginPath(); ctx.arc(sx, sy, z * 0.18, 0, Math.PI * 2); ctx.stroke();
      break;
    }
    case 'missile': {
      trail('rgba(255,140,60,.85)', z * 0.11, 0.75, z * 1.9);
      trail('rgba(220,225,235,.5)', z * 0.05, 0.5, z * 1.4);
      ctx.fillStyle = '#f2f6ff';
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(ang) * z * 0.16, sy + Math.sin(ang) * z * 0.16);
      ctx.lineTo(sx + Math.cos(ang + 2.4) * z * 0.11, sy + Math.sin(ang + 2.4) * z * 0.11);
      ctx.lineTo(sx + Math.cos(ang - 2.4) * z * 0.11, sy + Math.sin(ang - 2.4) * z * 0.11);
      ctx.closePath(); ctx.fill();
      orb('#ff7a3d', z * 0.22);
      break;
    }
    case 'frost': {
      trail('rgba(120,220,255,.8)', z * 0.09, 0.7, z * 1.5);
      ctx.translate(sx, sy);
      ctx.rotate(S.time * 6);
      ctx.fillStyle = '#dff8ff';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        const rr = i % 2 ? z * 0.08 : z * 0.22;
        i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'poison': {
      trail('rgba(132,204,22,.85)', z * 0.12, 0.7, z * 1.5);
      orb('#84cc16', z * 0.24);
      for (let i = 0; i < 3; i++) {
        const ph = (S.time * 2 + i * 0.33) % 1;
        ctx.globalAlpha = (1 - ph) * 0.7;
        ctx.fillStyle = '#bef264';
        ctx.beginPath();
        ctx.arc(sx + Math.sin(ph * 8 + i) * z * 0.16, sy + ph * z * 0.3, z * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      break;
    }
    case 'magnet': {
      orb('#6ee7ff', z * 0.24);
      ctx.strokeStyle = 'rgba(110,231,255,.95)';
      ctx.lineWidth = z * 0.05;
      for (let i = 0; i < 2; i++) {
        const a0 = S.time * 8 + i * Math.PI;
        ctx.beginPath();
        ctx.arc(sx, sy, z * (0.20 + i * 0.09), a0, a0 + 2.2);
        ctx.stroke();
      }
      break;
    }
    case 'holy': {
      trail('rgba(255,233,168,.95)', z * 0.10, 0.9, z * 1.8);
      orb('#ffe9a8', z * 0.28);
      ctx.fillStyle = '#fffbe8';
      ctx.fillRect(sx - z * 0.025, sy - z * 0.16, z * 0.05, z * 0.32);
      ctx.fillRect(sx - z * 0.16, sy - z * 0.025, z * 0.32, z * 0.05);
      break;
    }
    case 'aa': {
      trail('rgba(127,227,255,.8)', z * 0.08, 0.75, z * 1.4);
      orb('#7fe3ff', z * 0.22);
      break;
    }
    default: {
      trail('rgba(207,224,255,.85)', z * 0.07, 0.75, z * 1.4);
      orb('#9ec5ff', z * 0.22);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(sx, sy, z * 0.06, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.restore();
}

function drawPentagram(g, cx, cy, r, rot, col, alpha) {
  g.save();
  g.globalAlpha = alpha;
  g.translate(cx, cy);
  g.rotate(rot);
  g.strokeStyle = col;
  g.lineWidth = Math.max(1, r * 0.06);
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(0, 0, r * 0.62, 0, Math.PI * 2); g.stroke();
  const pts = [];
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    pts.push([Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86]);
  }
  g.lineWidth = Math.max(1, r * 0.05);
  g.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = pts[i], b = pts[(i + 2) % 5];
    g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]);
  }
  g.stroke();
  g.fillStyle = col;
  for (const q of pts) {
    g.beginPath(); g.arc(q[0], q[1], r * 0.07, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

function drawFx(f) {
  const [sx, sy] = w2s(f.x, f.y);
  const k = f.life / f.max;

  if (f.type === 'death') {
    // 爆开的小碎片
    const rad = cam.z * (0.2 + (1 - k) * 0.45);
    ctx.globalAlpha = k * 0.8;
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 0.4 + (1 - k) * 2;
      ctx.fillStyle = i % 2 ? '#ffd9a0' : '#ff9a5c';
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a) * rad, sy + Math.sin(a) * rad, cam.z * 0.045 * k, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

  } else if (f.type === 'fog') {
    const grow = 1 - k;
    const rad = cam.z * (0.55 + grow * 2.0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
    fg.addColorStop(0, 'rgba(170,235,95,' + (k * 0.42) + ')');
    fg.addColorStop(0.55, 'rgba(120,195,60,' + (k * 0.26) + ')');
    fg.addColorStop(1, 'rgba(70,150,40,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(sx, sy, rad, 0, Math.PI * 2); ctx.fill();
    // 翻滚的雾团
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05 + S.time * 0.9;
      const rr = rad * (0.32 + Math.sin(S.time * 2.2 + i * 1.7) * 0.18);
      ctx.globalAlpha = k * 0.34;
      ctx.fillStyle = i % 2 ? '#a3e635' : '#6ee7a0';
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr, rad * 0.30, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  } else if (f.type === 'bombwave') {
    const k3 = 1 - k;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 冲击波环
    for (let i = 0; i < 2; i++) {
      const t3 = clamp(k3 * 1.5 - i * 0.25, 0, 1);
      if (t3 <= 0) continue;
      ctx.strokeStyle = 'rgba(255,' + (170 - i * 40) + ',80,' + (k * 0.85) + ')';
      ctx.lineWidth = Math.max(1.5, cam.z * 0.10 * (1 - t3 * 0.6));
      ctx.beginPath();
      ctx.arc(sx, sy, cam.z * 2.4 * t3, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 核心闪光
    if (k3 < 0.55) {
      const fk = 1 - k3 / 0.55;
      ctx.fillStyle = 'rgba(255,240,190,' + (fk * 0.9) + ')';
      ctx.beginPath();
      ctx.arc(sx, sy, cam.z * 0.65 * fk, 0, Math.PI * 2);
      ctx.fill();
    }
    // 飞散碎片
    for (let i = 0; i < 7; i++) {
      const a3 = i * 0.9 + (f.seed || 0);
      const rr = cam.z * 2.2 * k3;
      ctx.fillStyle = 'rgba(255,' + (150 + (i * 17) % 80) + ',70,' + (k * 0.8) + ')';
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a3) * rr, sy + Math.sin(a3) * rr, cam.z * 0.10 * (1 - k3 * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  } else if (f.type === 'tp') {
    const grow = 1 - k;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const kk = clamp(grow * 1.4 - i * 0.25, 0, 1);
      if (kk <= 0) continue;
      ctx.strokeStyle = 'rgba(167,139,250,' + (k * 0.9) + ')';
      ctx.lineWidth = Math.max(1.5, cam.z * 0.05 * (1 - kk * 0.5));
      ctx.beginPath();
      ctx.arc(sx, sy, cam.z * (0.15 + kk * 1.1), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(230,220,255,' + (k * 0.8) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, cam.z * 0.35 * k, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + S.time * 6;
      const rr = cam.z * (0.25 + grow * 0.9);
      ctx.fillStyle = 'rgba(200,180,255,' + (k * 0.9) + ')';
      ctx.beginPath();
      ctx.arc(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr, cam.z * 0.05, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  } else if (f.type === 'penta') {
    const grow = 1 - k;
    drawPentagram(ctx, sx, sy,
      cam.z * (0.8 + grow * 4.5), grow * 2.2,
      f.col || '#ffd76a', k * 0.9);
  } else if (f.type === 'hit') {
    ctx.strokeStyle = 'rgba(255,255,255,' + (k * 0.9) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sx, sy, cam.z * (0.1 + (1 - k) * 0.16), 0, Math.PI * 2);
    ctx.stroke();

  } else if (f.type === 'boom') {
    // 双层冲击环 + 中心闪光
    for (const d of [0, 0.35]) {
      const kk = clamp((1 - k) - d, 0, 1);
      if (kk <= 0) continue;
      ctx.strokeStyle = 'rgba(255,' + Math.round(200 - d * 120) + ',80,' + (k * 0.75) + ')';
      ctx.lineWidth = 3 * k + 1;
      ctx.beginPath();
      ctx.arc(sx, sy, cam.z * (0.25 + kk * 1.7), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,220,150,' + (k * 0.35) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, cam.z * 0.5 * k, 0, Math.PI * 2); ctx.fill();

  } else if (f.type === 'gold') {
    ctx.fillStyle = 'rgba(255,205,80,' + k + ')';
    ctx.font = '700 ' + Math.max(11, cam.z * 0.42) + 'px "Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, sx, sy - cam.z * (1 - k) * 0.9);
    ctx.textAlign = 'start';

  } else if (f.type === 'leak') {
    ctx.strokeStyle = 'rgba(255,90,90,' + k + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sx, sy, cam.z * (0.3 + (1 - k) * 1.3), 0, Math.PI * 2);
    ctx.stroke();

  } else if (f.type === 'chain') {
    // 锯齿闪电
    ctx.strokeStyle = 'rgba(255,246,140,' + k + ')';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i < f.pts.length - 1; i++) {
      const a = f.pts[i], b = f.pts[i + 1];
      const [ax, ay] = w2s(a.x, a.y);
      const [bx2, by2] = w2s(b.x, b.y);
      ctx.moveTo(ax, ay);
      const segs = 4;
      for (let j = 1; j <= segs; j++) {
        const t2 = j / segs;
        const jx = ax + (bx2 - ax) * t2 + (j < segs ? rnd(-1, 1) * cam.z * 0.12 : 0);
        const jy = ay + (by2 - ay) * t2 + (j < segs ? rnd(-1, 1) * cam.z * 0.12 : 0);
        ctx.lineTo(jx, jy);
      }
    }
    ctx.stroke();
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;

  } else if (f.type === 'chip') {
    ctx.fillStyle = 'rgba(210,215,225,' + (k * 0.8) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, cam.z * 0.07, 0, Math.PI * 2); ctx.fill();

  } else if (f.type === 'muzzle') {
    const col = f.col || '#ffe9a8';
    const ang = f.ang || 0;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = k * 0.9;
    const R = cam.z * 0.42 * (0.5 + k * 0.7);
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, col);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, Math.PI * 2); ctx.fill();
    // 四向星芒
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = Math.max(1.5, cam.z * 0.05 * k);
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a = ang + i * Math.PI / 2 + 0.2;
      const len = R * (i === 0 ? 1.35 : 0.85);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(a) * len, sy + Math.sin(a) * len);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/** 颜色明暗调整 */
function shade(hex, k) {
  if (hex[0] !== '#') return hex;
  let h = hex.slice(1);
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const r = Math.min(255, Math.round(parseInt(h.slice(0, 2), 16) * k));
  const g = Math.min(255, Math.round(parseInt(h.slice(2, 4), 16) * k));
  const b = Math.min(255, Math.round(parseInt(h.slice(4, 6), 16) * k));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawRange(cx, cy, r, color) {
  const [sx, sy] = w2s(cx, cy);
  ctx.beginPath();
  ctx.arc(sx, sy, r * cam.z, 0, Math.PI * 2);
  ctx.fillStyle = color.replace(/[\d.]+\)$/, '0.08)');
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}


function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  const rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}





function drawBase() {
  const b = S.base;
  const [sx, sy] = w2s(b.x + 0.5, b.y + 0.5);
  const z = cam.z;

  const l = S.lives / 25;
  ctx.fillStyle = 'rgba(110,168,255,.18)';
  roundRect(sx - z * 0.45, sy - z * 0.45, z * 0.9, z * 0.9, z * 0.14);
  ctx.fill();
  ctx.strokeStyle = l > 0.5 ? '#6ea8ff' : l > 0.25 ? '#ffc94a' : '#ff6b6b';
  ctx.lineWidth = 2;
  roundRect(sx - z * 0.45, sy - z * 0.45, z * 0.9, z * 0.9, z * 0.14);
  ctx.stroke();

  // 心形
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  const s = z * 0.2;
  ctx.moveTo(sx, sy + s * 0.7);
  ctx.bezierCurveTo(sx - s * 1.4, sy - s * 0.4, sx - s * 0.5, sy - s * 1.2, sx, sy - s * 0.35);
  ctx.bezierCurveTo(sx + s * 0.5, sy - s * 1.2, sx + s * 1.4, sy - s * 0.4, sx, sy + s * 0.7);
  ctx.fill();
}

/* ══════════════════════════════════════════════════════════════
   输入
   ══════════════════════════════════════════════════════════════ */
let dragging = false, dragMoved = 0, lastX = 0, lastY = 0;
let hoverCell = null;

cv.addEventListener('pointerdown', e => {
  dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY;
});
cv.addEventListener('pointermove', e => {
  const [wx, wy] = s2w(e.clientX, e.clientY);
  hoverCell = (wx >= 0 && wy >= 0 && wx < N && wy < N)
    ? { x: Math.floor(wx), y: Math.floor(wy) } : null;

  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (dragMoved > 5) {
      cam.x -= dx / cam.z;
      cam.y -= dy / cam.z;
      clampCam();
    }
    lastX = e.clientX; lastY = e.clientY;
  }
});
cv.addEventListener('pointerup', e => {
  dragging = false;
  if (dragMoved > 5) return;
  click(e.clientX, e.clientY);
});
cv.addEventListener('pointerleave', () => { dragging = false; hoverCell = null; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const [wx, wy] = s2w(e.clientX, e.clientY);
  cam.z = clamp(cam.z * (e.deltaY > 0 ? 0.9 : 1.1), 10, 64);
  const [ax, ay] = s2w(e.clientX, e.clientY);
  cam.x += (wx - ax);
  cam.y += (wy - ay);
  clampCam();
}, { passive: false });

// 右键：取消建造状态
window.addEventListener('mousedown', e => {
  if (e.button !== 2) return;
  if (S.targeting) {
    S.targeting = null;
    renderItems();
    toast('已取消使用道具');
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  if (S.build) {
    setBuild(null);
    deselect();
    toast('已取消建造');
    sfx('sell');
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

window.addEventListener('contextmenu', e => {
  if (S.build) e.preventDefault();
});

// Esc 也可取消
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.targeting) { S.targeting = null; renderItems(); toast('已取消使用道具'); return; }
  if (S.build) { setBuild(null); deselect(); toast('已取消建造'); }
});

function findFocusTarget(wx, wy) {
  let best = null, bd = 0.95;
  for (const o of S.obs) {
    if (o.hp <= 0) continue;
    for (const c of o.cells) {
      const d = dist(wx, wy, c.x + 0.5, c.y + 0.5);
      if (d < bd) { bd = d; best = o; }
    }
  }
  if (best) return best;
  for (const e of S.enemies) {
    if (e.dead) continue;
    const d = dist(wx, wy, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// 地刺：长按左键框选批量铺设
window.addEventListener('pointerdown', e => {
  if (S.build !== 'spike' || e.button !== 0) return;
  if (e.target && e.target.id !== 'cv') return;
  S.boxSel = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY };
  e.preventDefault();
  e.stopPropagation();
}, true);

window.addEventListener('pointermove', e => {
  if (!S.boxSel) return;
  S.boxSel.x1 = e.clientX;
  S.boxSel.y1 = e.clientY;
}, true);

window.addEventListener('pointerup', e => {
  if (!S.boxSel) return;
  const b = S.boxSel;
  S.boxSel = null;
  const x0 = Math.min(b.x0, b.x1), x1 = Math.max(b.x0, b.x1);
  const y0 = Math.min(b.y0, b.y1), y1 = Math.max(b.y0, b.y1);
