  let placed = 0;
  const stepPx = Math.max(6, cam.z * 0.45);
  for (let sy = y0; sy <= y1 + 0.1; sy += stepPx) {
    for (let sx = x0; sx <= x1 + 0.1; sx += stepPx) {
      const [wx, wy] = s2w(sx, sy);
      if (placeSpike(cellIdAt(wx, wy))) placed++;
    }
  }
  toast(placed ? ('铺设了 ' + placed + ' 个地刺') : '框选范围内没有可铺设的路面');
  sfx(placed ? 'build' : 'sell');
  updateHud();
  e.preventDefault();
  e.stopPropagation();
}, true);

function click(sx, sy) {
  const [wx, wy] = s2w(sx, sy);

  // 道具定向释放
  if (S.targeting) {
    applyItem(S.targeting, wx, wy);
    if (!S.items[S.targeting]) S.targeting = null;   // 用完后还有存货就继续瞄准
    renderItems();
    return;
  }

  // 点击锁定目标（土块 / 图腾 / 巢穴 / 障碍 / 怪物）
  // 建造模式下不触发，否则会误选障碍物而建不了塔
  if (!S.build) {
    const foc = findFocusTarget(wx, wy);
    if (foc) {
      S.focus = foc;
      deselect();
      addFx(wx, wy, 'tp', 0.45);
      sfx('rock');
      return;
    }
  }

  const cid = cellIdAt(wx, wy);
  if (cid < 0) { deselect(); return; }

  // 点塔
  const sealedTower = S.towers.find(x => x.cell === cid && x.sealed);
  if (!S.build && sealedTower) {
    S.focus = sealedTower.sealed;
    deselect();
    addFx(wx, wy, 'tp', 0.45);
    sfx('rock');
    return;
  }

  const t = S.towers.find(t => t.cell === cid);
  if (t) { S.focus = null; selectTower(t); return; }

  // 建塔
  if (S.build && S.build !== 'spike') {
    if (buildTower(cid, S.build)) {
      updateHud();
      if (S.gold < TOWER_DEF[S.build].lv[0].cost) setBuild(null);
    }
    return;
  }

  S.focus = null;
  deselect();
}

   UI

const uiGold = document.getElementById('uiGold');
const uiLife = document.getElementById('uiLife');
const uiWave = document.getElementById('uiWave');
const uiEnemy = document.getElementById('uiEnemy');
const btnWave = document.getElementById('btnWave');
const btnSpeed = document.getElementById('btnSpeed');
const btnPause = document.getElementById('btnPause');
const panel = document.getElementById('panel');

let hudCache = { gold: -1, lives: -1, wave: -1, enemy: -1, active: null, next: -99 };

let _hudLastT = 0;

function updateHud(force) {
  const now = performance.now();
  if (!force && now - _hudLastT < 100) return;
  _hudLastT = now;
  updateHudBody();
}

function updateHudBody() {
  const g = Math.floor(S.gold);
  if (g !== hudCache.gold) {
    uiGold.textContent = g;
    document.querySelectorAll('.tw').forEach(el => {
      const d = TOWER_DEF[el.dataset.key];
      const cost = d ? d.lv[0].cost
        : (el.dataset.key === 'spike' ? SPIKE_DEF.cost : 0);
      el.classList.toggle('poor', g < cost);
    });
    hudCache.gold = g;
  }
  if (S.lives !== hudCache.lives) { uiLife.textContent = S.lives; hudCache.lives = S.lives; }
  if (S.wave !== hudCache.wave) {
    uiWave.textContent = S.wave + (S.wave > WAVE_MAX ? ' (无尽)' : '/' + WAVE_MAX);
    hudCache.wave = S.wave;
  }
  if (S.enemies.length !== hudCache.enemy) { uiEnemy.textContent = S.enemies.length; hudCache.enemy = S.enemies.length; }

  const shown = S.waveActive ? -1 : Math.max(0, Math.ceil(S.nextT));
  if (shown !== hudCache.next) {
    btnWave.textContent = S.waveActive
      ? '第 ' + S.wave + ' 波进行中'
      : '下一波：' + shown + 's';
    btnWave.classList.toggle('on', S.waveActive);
    hudCache.next = shown;
  }
}
function resetHudCache() { hudCache = { gold: -1, lives: -1, wave: -1, enemy: -1, active: null, next: -99 }; }

function setBuild(k) {
  if (k === 'spike' || k === 'barracks') { toast('该建筑已移除'); return; }
  S.build = (S.build === k) ? null : k;
  S.selected = null;
  document.querySelectorAll('.tw').forEach(el => {
    el.classList.toggle('sel', el.dataset.key === S.build);
  });
  panel.classList.remove('on');
}

function selectTower(t) {
  S.selected = t;
  S.build = null;
  document.querySelectorAll('.tw').forEach(el => el.classList.remove('sel'));
  panel.classList.add('on');
  renderPanel();
}

function deselect() {
  S.selected = null;
  panel.classList.remove('on');
}

function renderPanel() {
  const t = S.selected;
  if (!t) return;
  const def = TOWER_DEF[t.type];
  const st = towerStats(t);

  document.getElementById('pName').textContent = towerName(t);
  const lvTxt = ['等级 1 / 4', '等级 2 / 4', '等级 3 / 4 · 已进化', '等级 4 / 4 · 终极形态'];
  document.getElementById('pLv').textContent = lvTxt[t.level - 1] || '';

  const rows = [];
  if (st.dmg) rows.push('伤害 <span>' + Math.round(st.dmg) + '</span>');
  if (st.dps) rows.push('每秒伤害 <span>' + Math.round(st.dps) + '</span>');
  if (st.rate) rows.push('攻击间隔 <span>' + st.rate.toFixed(2) + 's</span>');
  rows.push('射程 <span>' + st.range.toFixed(1) + '</span> 格');
  if (st.splash) rows.push('爆炸半径 <span>' + st.splash.toFixed(1) + '</span>');
  if (st.slow) rows.push('减速 <span>' + Math.round(st.slow * 100) + '%</span>');
  if (st.chain) rows.push('连锁 <span>' + Math.round(st.chain) + '</span> 个');
  if (st.arcs) rows.push('电弧 <span>' + Math.round(st.arcs) + '</span> 道');
  if (st.burn) rows.push('灼烧 <span>' + Math.round(st.burn) + '/秒</span>');
  if (st.pierce) rows.push('贯穿 <span>' + Math.round(st.pierce) + '</span>');
  if (st.stun) rows.push('眩晕 <span>' + st.stun.toFixed(1) + 's</span>');
  if (st.count) rows.push('士兵 <span>' + Math.round(st.count) + '</span> 名');
  if (st.hp) rows.push('士兵血量 <span>' + Math.round(st.hp) + '</span>');
  if (st.respawn) rows.push('复活 <span>' + st.respawn + 's</span>');
  if (st.crit) rows.push('暴击 <span>' + Math.round(st.crit * 100) + '%</span>');
  if (st.cluster) rows.push('集束 <span>' + Math.round(st.cluster) + '</span> 个');
  if (t.boon) rows.push('<span style="color:#ffd76a">符文地块 +25% 伤害 / +10% 射程</span>');
  if (t.high) rows.push('<span style="color:#a3e635">高地 +15% 射程 / +10% 伤害</span>');
  if (t.goldGen) rows.push('<span style="color:#ffc94a">金矿 +' + t.goldGen.toFixed(1) + ' 金/秒</span>');
  if (t.totemAura) {
    rows.push('<span style="color:#c084fc">图腾塔光环 射速 +' +
      Math.round((t.totemBonus || 0.22) * 100) + '%</span>');
  }
  if (t.invulnT > 0) {
    rows.push('<span style="color:#7fe3ff">圣域护盾：无敌 ' + t.invulnT.toFixed(1) + ' 秒</span>');
  }
  rows.push('总伤害 <span>' + Math.round(t.dmgDealt) + '</span>');
  document.getElementById('pRows').innerHTML = rows.join('<br>');

  // 优先级
  const prio = document.getElementById('pPrio');
  prio.innerHTML = '';
  [['first', '最前'], ['last', '最后'], ['strong', '最强'], ['near', '最近']].forEach(([k, label]) => {
    const b = document.createElement('button');
    b.className = 'btn' + (t.priority === k ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { t.priority = k; renderPanel(); };
    prio.appendChild(b);
  });

  const act = document.getElementById('pActions');
  act.innerHTML = '';

  // ── 主动技能 ──
  const sk = TOWER_ACTIVE[t.type];
  if (sk) {
    const sb = document.createElement('button');
    const ready = t.cdActive <= 0;
    sb.className = 'btn' + (ready ? ' gold' : '');
    sb.innerHTML = '技能 · ' + sk.name + (ready ? '' : '（' + Math.ceil(t.cdActive) + 's）') +
      '<br><span style="color:#7f8da0;font-size:11px">' + sk.desc + '</span>';
    sb.disabled = !ready;
    sb.style.opacity = ready ? '1' : '.55';
    sb.onclick = () => useActive(t);
    act.appendChild(sb);
  }

  // ── 升级 / 进化 ──
  if (t.level === 1) {
    const cost = costOf(def.lv[1].cost);
    const b = document.createElement('button');
    b.className = 'btn gold';
    b.textContent = '升级到 Lv2 — ' + cost + ' 金';
    b.onclick = () => {
      if (S.gold < cost) { toast('金币不够'); return; }
      S.gold -= cost; t.level = 2; t.totalCost += cost; refreshTowerHp(t, true);
      sfx('upgrade'); renderPanel(); updateHud();
    };
    act.appendChild(b);
  } else if (t.level === 2) {
    def.evolve.forEach((ev, i) => {
      const eb = document.createElement('button');
      eb.className = 'btn gold';
      eb.innerHTML = '进化：' + ev.name + ' — ' + costOf(ev.cost) + ' 金<br>' +
        '<span style="color:#7f8da0;font-size:11px">' + ev.desc + '</span>';
      eb.onclick = () => {
        const c = costOf(ev.cost);
        if (S.gold < c) { toast('金币不够'); return; }
        S.gold -= c; t.level = 3; t.branch = i; t.totalCost += c; refreshTowerHp(t, true);
        sfx('upgrade'); renderPanel(); updateHud();
      };
      act.appendChild(eb);
    });
  } else if (t.level === 3) {
    const l4 = def.evolve[t.branch].l4;
    const b = document.createElement('button');
    b.className = 'btn gold';
    b.innerHTML = '终极：' + l4.name + ' — ' + costOf(l4.cost) + ' 金<br>' +
      '<span style="color:#7f8da0;font-size:11px">数值全面提升</span>';
    b.onclick = () => {
      const c = costOf(l4.cost);
      if (S.gold < c) { toast('金币不够'); return; }
      S.gold -= c; t.level = 4; t.totalCost += c; refreshTowerHp(t, true);
      sfx('upgrade'); renderPanel(); updateHud();
    };
    act.appendChild(b);
  } else {
    const d = document.createElement('div');
    d.style.cssText = 'font-size:11.5px;color:#7f8da0;text-align:center;padding:6px 0';
    d.textContent = '已是终极形态';
    act.appendChild(d);
  }

  const sell = document.createElement('button');
  sell.className = 'btn';
  const refund = Math.floor(t.totalCost * 0.6);
  let confirmSell = false;
  sell.textContent = '拆除（返还 ' + refund + ' 金）';
  sell.onclick = () => {
    if (!confirmSell) {
      confirmSell = true;
      sell.textContent = '再点一次确认拆除（返还 ' + refund + ' 金）';
      sell.classList.add('danger');
      sfx('rock');
      clearTimeout(sell._tm);
      sell._tm = setTimeout(() => {
        confirmSell = false;
        sell.textContent = '拆除（返还 ' + refund + ' 金）';
        sell.classList.remove('danger');
      }, 2600);
      return;
    }
    clearTimeout(sell._tm);
    S.gold += refund;
    releaseTowerCell(t);
    S.soldiers = S.soldiers.filter(x => x.tower !== t);
    S.towers = S.towers.filter(x => x !== t);
    deselect(); sfx('sell'); updateHud();
  };
  act.appendChild(sell);
}

function openBasePanel() {
  let el = document.getElementById('basePanel');
  if (!el) {
    el = document.createElement('div');
    el.id = 'basePanel';
    document.body.appendChild(el);
  }
  const next = S.baseTier + 1;
  let html = '<h3>基地防御 Lv.' + S.baseTier + '</h3>';
  if (S.baseTier > 0) {
    html += '<p style="color:#7ce8b0">全局炮塔：伤害 +' +
      Math.round(BASE_GD[S.baseTier] * 100) + '%　射速 +' +
      Math.round(BASE_GR[S.baseTier] * 100) + '%</p>';
  }
  if (S.baseTier > 0) {
    const cur = BASE_BRANCH[S.baseBranch];
    html += '<p style="color:' + cur.color + '">当前：' + cur.name +
      '　伤害 ' + Math.round(cur.dmg * BASE_MULT[S.baseTier - 1]) + '</p>';

    html += '<p>已满级</p>';

    html += '<p>下一级需第 ' + (next * 5) + ' 波　费用 <b>' + BASE_COST[next - 1] + '</b></p>';

      html += '<button class="btn gold" data-b="' + i + '">' + b.name +
        '（伤害 ' + Math.round(b.dmg * BASE_MULT[next - 1]) + '）</button>';
    });
  }
  html += '<button class="btn" data-close="1">关闭</button>';
  el.innerHTML = html;
  el.classList.add('on');
  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {

/* ══════════════════════════════════════════════════════════════
   音效（WebAudio 程序生成）
   ══════════════════════════════════════════════════════════════ */
let AC = null;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  return AC;
}
let lastSfx = {};

function beep(freq, dur, type, vol, slide) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.05, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}

let noiseBuf = null;
function getNoise() {
  const a = ac(); if (!a) return null;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.7), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function noiseHit(vol, dur, f0, f1, type) {
  const a = ac(); if (!a) return;
  const buf = getNoise(); if (!buf) return;
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = type || 'lowpass';
  f.frequency.setValueAtTime(f0, a.currentTime);
  f.frequency.exponentialRampToValueAtTime(Math.max(50, f1), a.currentTime + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(); src.stop(a.currentTime + dur + 0.03);
}

/* ── 休闲背景音乐 ── */
let bgmOn = false, bgmTimer = null, bgmStep = 0, bgmStarted = false;

// 柔和的和弦进行：Am - F - G - Em
const BGM_CHORDS = [
  [146.83, 174.61, 220.00],   // Dm
  [116.54, 146.83, 174.61],   // Bb
  [174.61, 220.00, 261.63],   // F
  [130.81, 164.81, 196.00],   // C
];

function bgmPad(freqs, dur, vol) {
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime;
  freqs.forEach((f, i) => {
    const o = a.createOscillator();
    o.type = i === 2 ? 'square' : 'sawtooth';
    o.frequency.value = f;
    o.detune.value = (i - 1) * 7;
    const flt = a.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(2600, t0);
    flt.frequency.exponentialRampToValueAtTime(900, t0 + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.22);
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    o.connect(flt); flt.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.1);
  });
}

function bgmBass(freq, vol) {
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  const flt = a.createBiquadFilter();
  flt.type = 'lowpass';
  flt.frequency.value = 520;
  o.connect(flt); flt.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + 0.28);
}

function bgmBrass(freqs, when, vol) {
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime + (when || 0);
  freqs.forEach(f => {
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.value = f;
    const flt = a.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(3200, t0);
    flt.frequency.exponentialRampToValueAtTime(1200, t0 + 0.45);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.026, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(flt); flt.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + 0.52);
  });
}

function bgmLead(freq, when, dur) {
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime + (when || 0);
  const d = dur || 0.30;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.034, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}

function bgmKick() {
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t0);
  o.frequency.exponentialRampToValueAtTime(42, t0 + 0.14);
  g.gain.setValueAtTime(0.20, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.20);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + 0.22);
}

function bgmSnare() {
  noiseHit(0.06, 0.16, 2600, 900);
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(220, t0);
  g.gain.setValueAtTime(0.07, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + 0.14);
}

function bgmTimpani() {
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, t0);
  o.frequency.exponentialRampToValueAtTime(44, t0 + 0.4);
  g.gain.setValueAtTime(0.24, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.72);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + 0.74);
  noiseHit(0.05, 0.22, 500, 80);
}

function bgmHat(when) {
  if (!when) { noiseHit(0.030, 0.05, 9500, 6500, 'highpass'); return; }
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime + when;
  const len = Math.floor(a.sampleRate * 0.045);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const ch2 = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch2[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource();
  src.buffer = buf;
  const flt = a.createBiquadFilter();
  flt.type = 'highpass';
  flt.frequency.value = 7000;
  const g = a.createGain();
  g.gain.value = 0.05;
  src.connect(flt); flt.connect(g); g.connect(a.destination);
  src.start(t0);
}

let bgmBeat = 0;
const BGM_MEL = [0, 1, 2, 1, 2, 0, 1, 2];

function bgmTick() {
  if (!bgmOn) return;
  const ch = BGM_CHORDS[Math.floor(bgmBeat / 8) % BGM_CHORDS.length];
  const b = bgmBeat % 8;

  if (b === 0) {
    bgmPad(ch, 2.2, 0.045);
    bgmPad(ch.map(f => f * 0.5), 2.4, 0.038);
    bgmTimpani();
    bgmBrass([ch[0] * 2, ch[1] * 2, ch[2] * 2], 0, 0.028);
  }
  if (b === 4) bgmBrass([ch[0], ch[1], ch[2]], 0, 0.022);

  bgmBass(ch[0] * (b % 2 === 0 ? 1 : 0.5), b === 0 ? 0.125 : 0.085);
  bgmBass(ch[0] * 0.5, 0.055, 0.07);
  if (b % 4 === 0) bgmKick();
  if (b % 4 === 2) bgmSnare();
  bgmHat();
  bgmHat(0.135);
  bgmLead(ch[BGM_MEL[b]] * 2, 0, 0.22);
  bgmLead(ch[BGM_MEL[(b + 2) % 8]] * 3, 0.135, 0.16);

  bgmBeat++;
}

function toggleBgm() {
  bgmOn = !bgmOn;
  if (bgmOn) {
    bgmTick();
    bgmTimer = setInterval(bgmTick, 265);
  } else if (bgmTimer) {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
  if (btnBgm) btnBgm.classList.toggle('on', bgmOn);
}

function sfx(kind) {
  const now = performance.now();
  const gap = { shoot: 55, boom: 80, kill: 60, tesla: 90, sniper: 120, frost: 110, wind: 140 }[kind] || 0;
  if (gap && lastSfx[kind] && now - lastSfx[kind] < gap) return;
  lastSfx[kind] = now;

  switch (kind) {
    case 'shoot':  beep(760, 0.05, 'square', 0.014, 420); break;
    case 'sniper': beep(240, 0.12, 'sawtooth', 0.04, 90); noiseHit(0.05, 0.1, 3000, 800); break;
    case 'boom':   noiseHit(0.13, 0.38, 1400, 110); beep(80, 0.25, 'sine', 0.05, 40); break;
    case 'kill':   beep(520, 0.07, 'sine', 0.022, 700); break;
    case 'rock':   noiseHit(0.09, 0.22, 2200, 220); break;
    case 'build':
      beep(300, 0.06, 'square', 0.05, 420);
      beep(600, 0.10, 'triangle', 0.06, 900);
      noiseHit(0.05, 0.12, 2500, 600);
      break;
    case 'event':
      [523, 659, 784, 1046].forEach((f, i) => {
        setTimeout(() => beep(f, 0.16, 'triangle', 0.07, f * 1.5), i * 110);
      });
      noiseHit(0.06, 0.5, 3000, 800, 'highpass');
      break;
    case 'upgrade':
      beep(660, 0.09, 'triangle', 0.07, 990);
      beep(990, 0.12, 'sine', 0.05, 1480);
      beep(1320, 0.16, 'sine', 0.035, 1760);
      break;
    case 'sell':   beep(380, 0.1, 'sine', 0.04, 220); break;
    case 'leak':   beep(160, 0.3, 'sawtooth', 0.06, 70); noiseHit(0.05, 0.3, 500, 100); break;
    case 'wave':   beep(330, 0.12, 'square', 0.04, 440); beep(495, 0.16, 'sine', 0.03, 660); break;
    case 'boss':   beep(55, 0.8, 'sawtooth', 0.09, 40); noiseHit(0.10, 0.9, 700, 90); break;
    case 'win':    beep(660, 0.3, 'sine', 0.07, 990); beep(880, 0.5, 'sine', 0.04, 1320); break;
    case 'lose':   beep(140, 0.5, 'sawtooth', 0.08, 60); noiseHit(0.12, 0.7, 800, 70); break;
    case 'frost':
      beep(2400, 0.07, 'sine', 0.030, 3600);
      beep(1700, 0.13, 'sine', 0.022, 2700);
      noiseHit(0.030, 0.13, 9000, 3200, 'highpass');
      break;
    case 'wind':
      noiseHit(0.055, 0.42, 500, 2600, 'bandpass');
      break;
    case 'bomb':
      beep(1500, 0.09, 'sine', 0.045, 420);        // 投弹下滑音
      setTimeout(() => {
        noiseHit(0.05, 0.22, 900, 120, 'lowpass');  // 低频爆震
        beep(90, 0.18, 'sine', 0.05, 40);
      }, 90);
      break;
    case 'teleport':
      beep(1200, 0.10, 'sine', 0.05, 2400);
      beep(600, 0.16, 'triangle', 0.04, 180);
      noiseHit(0.04, 0.18, 4000, 600, 'highpass');
      break;
    case 'tesla':  beep(1400, 0.05, 'square', 0.016, 700); noiseHit(0.03, 0.08, 6000, 2000, 'highpass'); break;
  }
}

      const px = 24 + i * 16;
      cc.beginPath();
      cc.moveTo(px - 7, 46); cc.lineTo(px, 18); cc.lineTo(px + 7, 46);
      cc.closePath(); cc.fill();
    }
    cc.restore();
    el.onclick = () => setBuild(S.build === 'spike' ? null : 'spike');
    pal.appendChild(el);
  }
}

function drawIcon(cc, def) {
  const g = cc;
  g.save();
  g.translate(40, 34);

  // 底盘，保证图标在任何背景上都看得清
  g.fillStyle = 'rgba(24,31,42,1)';
  g.beginPath(); g.arc(0, 0, 31, 0, Math.PI * 2); g.fill();
  g.strokeStyle = def.color;
  g.lineWidth = 2.5;
  g.beginPath(); g.arc(0, 0, 31, 0, Math.PI * 2); g.stroke();

  const c = def.color;
  g.fillStyle = c; g.strokeStyle = c; g.lineWidth = 2.5;
  const R = 22;
  switch (def.icon) {
    case 'gun':
      g.fillRect(-R * 0.16, -R * 0.85, R * 0.32, R * 1.5);
      g.beginPath(); g.arc(0, 0, R * 0.42, 0, Math.PI * 2); g.fill();
      break;
    case 'cannon':
      g.beginPath();
      g.moveTo(-R * 0.34, R * 0.5); g.lineTo(-R * 0.22, -R * 0.7);
      g.lineTo(R * 0.22, -R * 0.7); g.lineTo(R * 0.34, R * 0.5);
      g.closePath(); g.fill();
      g.beginPath(); g.arc(0, R * 0.1, R * 0.42, 0, Math.PI * 2); g.fill();
      break;
    case 'frost':
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        g.beginPath(); g.moveTo(0, 0);
        g.lineTo(Math.cos(a) * R * 0.85, Math.sin(a) * R * 0.85); g.stroke();
      }
      g.beginPath(); g.arc(0, 0, R * 0.24, 0, Math.PI * 2); g.fill();
      break;
    case 'sniper':
      g.fillRect(-R * 0.12, -R * 1.05, R * 0.24, R * 1.7);
      g.beginPath(); g.arc(0, -R * 0.15, R * 0.36, 0, Math.PI * 2); g.fill();
      break;
    case 'flame':
      g.beginPath();
      g.moveTo(0, -R * 0.9);
      g.quadraticCurveTo(R * 0.55, R * 0.1, 0, R * 0.75);
      g.quadraticCurveTo(-R * 0.55, R * 0.1, 0, -R * 0.9);
      g.fill();
      break;
    case 'tesla':
      g.beginPath();
      g.moveTo(-R * 0.2, -R * 0.9); g.lineTo(R * 0.3, -R * 0.15);
      g.lineTo(R * 0.02, -R * 0.1); g.lineTo(R * 0.28, R * 0.85);
      g.lineTo(-R * 0.3, R * 0.05); g.lineTo(0, 0);
      g.closePath(); g.fill();
      break;
    case 'barracks':
      g.beginPath();
      g.moveTo(0, -R * 0.85);
      g.lineTo(R * 0.82, R * 0.5);
      g.lineTo(-R * 0.82, R * 0.5);
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,.4)';
      g.beginPath();
      g.moveTo(0, -R * 0.2);
      g.lineTo(R * 0.36, R * 0.5);
      g.lineTo(-R * 0.36, R * 0.5);
      g.closePath(); g.fill();
      break;
    case 'aa':
      g.fillRect(-R * 0.30, -R * 0.95, R * 0.16, R * 1.45);
      g.fillRect(R * 0.14, -R * 0.95, R * 0.16, R * 1.45);
      g.beginPath(); g.arc(0, R * 0.15, R * 0.34, 0, Math.PI * 2); g.fill();
      break;

    case 'poison':
      g.beginPath(); g.arc(0, R * 0.5, R * 0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(0, -R * 0.1, R * 0.34, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(0, -R * 0.65, R * 0.2, 0, Math.PI * 2); g.fill();
      break;
    case 'magnet':
      g.strokeStyle = g.fillStyle; g.lineWidth = Math.max(2, R * 0.26);
      g.beginPath(); g.arc(0, 0, R * 0.55, Math.PI * 0.15, Math.PI * 0.85); g.stroke();
      break;
    case 'holy':
      g.fillRect(-R * 0.13, -R * 0.85, R * 0.26, R * 1.7);
      g.fillRect(-R * 0.55, -R * 0.32, R * 1.1, R * 0.26);
      break;
    case 'missile':
      g.beginPath();
      g.moveTo(0, -R * 0.95); g.lineTo(R * 0.3, -R * 0.25);
      g.lineTo(R * 0.3, R * 0.5); g.lineTo(-R * 0.3, R * 0.5);
      g.lineTo(-R * 0.3, -R * 0.25); g.closePath(); g.fill();
      break;
    case 'totem':
      g.fillRect(-R * 0.22, -R * 0.8, R * 0.44, R * 1.3);
      g.beginPath();
      g.moveTo(-R * 0.42, -R * 0.8); g.lineTo(0, -R * 1.05); g.lineTo(R * 0.42, -R * 0.8);
      g.closePath(); g.fill();
      break;
    case 'railgun':
      g.fillRect(-R * 0.5, -R * 0.75, R * 0.14, R * 1.45);
      g.fillRect(R * 0.36, -R * 0.75, R * 0.14, R * 1.45);
      g.fillRect(-R * 0.55, R * 0.55, R * 1.1, R * 0.2);
      break;

    default:
      g.beginPath();
      g.moveTo(0, -R * 0.85);
      g.lineTo(R * 0.7, 0);
      g.lineTo(0, R * 0.85);
      g.lineTo(-R * 0.7, 0);
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,.6)';
      g.beginPath(); g.arc(0, 0, R * 0.22, 0, Math.PI * 2); g.fill();
      break;
  }

  // 名字底板：画在图标之上，保证文字不被图标压住
  g.restore();
  g.save();
  g.fillStyle = 'rgba(8,12,18,.95)';
  g.fillRect(0, 58, 80, 22);
  g.strokeStyle = 'rgba(255,255,255,.10)';
  g.lineWidth = 1;
  g.strokeRect(0.5, 58.5, 79, 21);
  g.font = '700 21px "Microsoft YaHei", sans-serif';
  g.fillStyle = def.color;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(def.name, 40, 69);
  g.restore();
}

function tick(now) {
  requestAnimationFrame(tick);
  if (!lastT) lastT = now;
  // FPS 统计
  _fpsFrames++;
  _fpsAcc += Math.min(0.2, (now - lastT) / 1000 || 0);
  if (_fpsAcc >= 0.5) {
    const f = Math.round(_fpsFrames / _fpsAcc);
    const el = document.getElementById('uiFps');
    if (el) el.textContent = f;
    fpsEMA = fpsEMA * 0.75 + f * 0.25;
    if (S) S.q = fpsEMA > 52 ? 2 : (fpsEMA > 42 ? 1 : 0);
    if (S && S.speed === 10) {
      const bs = document.getElementById('btnSpeed');
      if (bs) bs.textContent = '10× (' + Math.ceil(S.fast10Left || 0) + 's)';
    }
    _fpsFrames = 0; _fpsAcc = 0;
  }
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);

  _statFrame++;
  const steps = S.speed;
  for (let i = 0; i < steps; i++) update(dt);
  render();
}

function restoreFromSave(d) {
  if (!d || !Array.isArray(d.path) || d.path.length < 10) return false;
  if (!Array.isArray(d.routes) || d.routes.length < 2 || d.routes.length > 3 || !Array.isArray(d.trunk)) return false;
  try {
    S.grid = Uint8Array.from(d.grid);
    S.obs = [];
    S.obsAt = new Int32Array(N * N).fill(-1);
    for (const raw of (d.obs || [])) {
      const def = OBSTACLE_DEF[raw.kind];
      if (!def) continue;
      if (!isFinite(raw.x) || !isFinite(raw.y)) continue;
      const sw = def.size || def.w || raw.size || 1;
      const sh = def.size || def.h || raw.size || 1;
      const cells = [];
      for (let dy = 0; dy < sh; dy++) {
        for (let dx = 0; dx < sw; dx++) cells.push({ x: raw.x + dx, y: raw.y + dy });
      }
      const o = {
        id: S.obs.length, kind: raw.kind, cells,
        x: raw.x, y: raw.y, size: Math.max(sw, sh), w: sw, h: sh,
        hp: raw.hp, maxHp: raw.maxHp,
        cx: raw.x + sw / 2, cy: raw.y + sh / 2,
      };
      for (const c of cells) {
        S.grid[c.y * N + c.x] = ROCK;
        S.obsAt[c.y * N + c.x] = o.id;
      }
      S.obs.push(o);
    }
    S.path = d.path;
    S.pathLen = d.path.length;
    S.routes = d.routes;
    S.trunk = d.trunk;
    S.spawns = [S.routes[0][0], S.routes[1][0]];
    S.spawn = S.spawns[0];
    S.base = S.trunk[S.trunk.length - 1];
    S.gold = d.gold;
    S.lives = d.lives;
    S.wave = d.wave;
    S.kills = d.kills || 0;
    S.items = d.items || {};
    S.rageT = d.rageT || 0;
    S.towers = (d.towers || []).filter(t => TOWER_DEF[t.type]).map(t => ({
      x: t.x, y: t.y, type: t.type,
      level: t.level || 1, branch: t.branch || 0,
      cd: 0, angle: -Math.PI / 2, target: null,
      priority: t.priority || 'first',
      kills: t.kills || 0, dmgDealt: t.dmgDealt || 0, totalCost: t.totalCost || 0,
      activeT: 0, cdActive: 0,
    }));
    for (const t of S.towers) S.grid[t.y * N + t.x] = BUILT;
    if (d.cam) {
      cam.x = clamp(d.cam.x, 2, N - 2);
      cam.y = clamp(d.cam.y, 2, N - 2);
      cam.z = clamp(d.cam.z, 10, 64);
    }
    return true;
  } catch (e) {
    return false;
  }
}

  S = newState();            // 自检用干净状态
  const res = [];
  const ok = (n, c) => res.push((c ? 'PASS ' : 'FAIL ') + n);

  // 1 地图尺寸
  ok('grid400', S.grid.length === N * N && N === 20);

  // 2 两条路线各自连续
  let contiguous = true, badAt = '';
  for (const r of S.routes) {
    for (let i = 1; i < r.length; i++) {
      const a = r[i - 1], b = r[i];
      if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > 1) {
        contiguous = false;
        badAt = ' [' + a.x + ',' + a.y + ']->[' + b.x + ',' + b.y + '] @' + i;
        break;
      }
    }
    if (!contiguous) break;
  }
  ok('routeContiguous' + badAt, contiguous);

  // 3 两条支路在中点合并，终点就是基地
  const rA = S.routes[0], rB = S.routes[1];
  const endA = rA[rA.length - 1], endB = rB[rB.length - 1];
  ok('routesMerge [' + endA.x + ',' + endA.y + '] vs [' + endB.x + ',' + endB.y + ']', endA.x === endB.x && endA.y === endB.y);
  ok('baseAtEnd', S.base.x === endA.x && S.base.y === endA.y);

  // 4 两个入口不同且都在左边缘
  {
    const bb = S.trunk[S.trunk.length - 1];
    const sp0 = S.routes[0][0], sp1 = S.routes[1][0];
    const far = Math.abs(sp0.x - bb.x) + Math.abs(sp0.y - bb.y) >= 10 &&
                Math.abs(sp1.x - bb.x) + Math.abs(sp1.y - bb.y) >= 10;
    ok('spawnsFarFromBase', far);
  }
  ok('twoEntrances', rA[0].x === rB[0].x && (rA[0].x === 0 || rA[0].x === N - 1) && rA[0].y !== rB[0].y);

  // 5 路面覆盖率
  ok('pathCoverage', S.path.length / (N * N) > 0.20);

  // 6 所有路线格子都在地图范围内
  let inBounds = true;
  for (const r of S.routes) {
    for (const c of r) {
      if (c.x < 0 || c.y < 0 || c.x >= N || c.y >= N) inBounds = false;
    }
  }
  ok('routeInBounds', inBounds);

  // 两条支路不能并排贴在一起（否则玩家分不清是两条路）
  let touching = 0;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (S.roadTint[y * N + x] !== 1) continue;
      if (y + 1 < N && S.roadTint[(y + 1) * N + x] === 2) touching++;
      if (x + 1 < N && S.roadTint[y * N + x + 1] === 2) touching++;
    }
  }
  ok('routesSeparated', touching === 0);

  // 高架：上路有架空段，且两条路真的交叉
  const trunkSet = new Set(S.trunk.map(c => c.x + ',' + c.y));
  let elevCount = 0, crossCount = 0;
  for (let i = 0; i < N * N; i++) {
    if (S.elev[i]) elevCount++;
    if (S.roadTint[i] === 3 && !trunkSet.has((i % N) + ',' + Math.floor(i / N))) crossCount++;
  }
  ok('bridgeElevated', elevCount > 20);
  ok('routesCross', crossCount >= 2);

  // 6 塔不能在路上建造
  const roadCell = S.path[5];
  const beforeGold = S.gold;
  const built = buildTower(roadCell.y * N + roadCell.x, 'gun');
  ok('noBuildOnRoad', built === false && S.gold === beforeGold);

  // 7 空地可以建
  let grass = null;
  for (let i = 0; i < N * N; i++) if (S.grid[i] === GRASS) { grass = i; break; }
  const b2 = buildTower(grass, 'gun');
  ok('buildOnGrass', !!b2 && b2 !== false && S.grid[grass] === BUILT);

  // 8 塔属性随等级提升
  const t = S.towers[0];
  const s1 = towerStats(t);
  t.level = 2;
  const s2 = towerStats(t);
  t.level = 3; t.branch = 0;
  const s3 = towerStats(t);
  ok('levelScaling', (s2.dmg > s1.dmg) && (s3.dmg > s2.dmg));

  // 9 敌人沿路径移动
  S.enemies.length = 0;
  spawnEnemy('normal', 1);
  const e = S.enemies[0];
  e.t = 0;
  const p0 = pathPos(0);
  e.t = 5;
  const p5 = pathPos(5);
  ok('enemyMoves', Math.abs(p5.x - p0.x) + Math.abs(p5.y - p0.y) > 0.5);

  // 10 击杀给钱
  const g0 = S.gold;
  e.hp = 1;
  damageEnemy(e, 999, null);
  ok('killReward', S.gold > g0);

  // 11 障碍可被摧毁（掉落炮塔类型会就地建塔，所以只验证不再是障碍）
  if (S.obs.length) {
    const o0 = S.obs[0];
    o0.hp = 1;
    destroyObstacle(o0);
    ok('obstacleDestroyed',
       !S.obs.includes(o0) && o0.cells.every(c => S.grid[c.y * N + c.x] !== ROCK));
  } else {
    ok('obstacleDestroyed', false);
  }

  // 12 存在 2×2 障碍物时，占满 4 格
  const before = S.obs.length;
  let big = null;
  for (const o of S.obs) if (o.size === 2) { big = o; break; }
  ok('bigObstacle4cells', !big || big.cells.length === 4);

  // 12 塔的定义结构完整（2 级基础 + 3 个进化分支）
  let defOk = true;
  for (const k of TOWER_KEYS) {
    const d = TOWER_DEF[k];
    if (!d.lv || d.lv.length !== 2 || !d.evolve || d.evolve.length !== 3) defOk = false;
  }
  ok('towerDefs', defOk);

  // 波次生成检查
  {
    const w5 = waveComposition(5).list;
    const w12 = waveComposition(12).list;
    ok('wave5hasLevitator', w5.includes('levitator'));
    ok('wave12hasTpmage', w12.includes('tpmage'));
    ok('wave12hasUfo', w12.includes('ufo'));
    ok('wave5hasEarthfiend', w5.indexOf('earthfiend') < 0);
    ok('wave6hasEarthfiend', waveComposition(6).list.includes('earthfiend'));
  {
    const w5g = waveComposition(5).list.filter(t => ENEMY_DEF[t] && ENEMY_DEF[t].giant);
    const w10g = waveComposition(10).list.filter(t => ENEMY_DEF[t] && ENEMY_DEF[t].giant);
    ok('giantOnWave5', w5g.length === 1);
    ok('giantOnWave10', w10g.length === 1);
    ok('giantOnWave7', waveComposition(7).list.filter(t => ENEMY_DEF[t] && ENEMY_DEF[t].giant).length === 0);
    const ge = ENEMY_DEF.giantSaucer;
    ok('giantDefs', !!ge && ge.giant === 'saucer' && !!ENEMY_DEF.giantBalloon.giant && !!ENEMY_DEF.giantBomber.giant);
  }
    {
    const before = S.totems.length;
    const fe = { x: S.path[10].x + 0.5, y: S.path[10].y + 0.5, t: 10, route: 0 };
    for (let kk = 0; kk < 3; kk++) plantTotem(fe, 'speed', kk * 2.4);
    ok('totemPlantsThree', S.totems.length - before === 3);
    const cells = S.totems.map(t => t.cells[0].id);
    ok('totemCellsDistinct', new Set(cells).size === cells.length);
    S.totems.forEach(t => {
      const ix = S.obs.indexOf(t);
      if (ix >= 0) S.obs.splice(ix, 1);
    });
    S.totems = [];
  }
  ok('wave2hasTotemMage', waveComposition(2).list.includes('totemMage'));
  }

  // ── 怪物技能 ──
  // 坦克有护盾且优先吸收
  S.enemies.length = 0;
  spawnEnemy('tank', 1, 0);
  const tk = S.enemies[0];
  const sh0 = tk.shield;
  damageEnemy(tk, 50, null);
  ok('tankShield', sh0 > 0 && tk.shield < sh0 && tk.hp === tk.maxHp);

  // 首领半血进入狂暴
  S.enemies.length = 0;
  spawnEnemy('boss', 1, 0);
  const bs = S.enemies[0];
  bs.hp = bs.maxHp * 0.4;
  update(0.016);
  ok('bossEnrage', bs.enraged === true);

  // 快速怪有冲刺状态字段
  S.enemies.length = 0;
  spawnEnemy('fast', 1, 0);
  const ft = S.enemies[0];
  ok('fastDash', typeof ft.dashCd === 'number' && typeof ft.dashT === 'number');

  // 普通怪死亡分裂（固定随机数保证必定触发）
  S.enemies.length = 0;
  spawnEnemy('normal', 1, 0);
  const nm = S.enemies[0];
  const origRand = Math.random;
  Math.random = () => 0.05;
  const cnt0 = S.enemies.length;
  damageEnemy(nm, 999999, null);
  Math.random = origRand;
  ok('normalSplits', S.enemies.length > cnt0);

  // 残骸类型存在
  ok('larvaDef', !!ENEMY_DEF.larva);

  // ── 飞行 + 防空 ──
  // 飞行体走直线，不沿路线
  S.enemies.length = 0;
  spawnEnemy('flyer', 1, 0);
  const fl = S.enemies[0];
  ok('flyerFlying', fl.flying === true && fl.flyLen > 0);
  const flStart = { x: fl.x, y: fl.y };
  fl.t = fl.flyLen * 0.5;
  update(0.016);
  ok('flyerMoves', Math.hypot(fl.x - flStart.x, fl.y - flStart.y) > 1);

  // 高射炮只能打空中
  S.towers.length = 0;
  const aaTower = { x: 1, y: 1, type: 'aa', level: 1, branch: 0, cd: 0, angle: 0,
                    priority: 'first', kills: 0, dmgDealt: 0, totalCost: 0 };
  S.enemies.length = 0;
  spawnEnemy('flyer', 1, 0);
  spawnEnemy('normal', 1, 0);
  const airE = S.enemies[0], gndE = S.enemies[1];
  ok('aaHitsAir', canTarget(aaTower, airE) === true);
  ok('aaNoGround', canTarget(aaTower, gndE) === false);

  // 纯地面塔打不到空中
  const cannonTower = Object.assign({}, aaTower, { type: 'cannon' });
  ok('groundNoAir', canTarget(cannonTower, airE) === false);

  // 混合塔两种都能打
  const gunTower = Object.assign({}, aaTower, { type: 'gun' });
  ok('gunBoth', canTarget(gunTower, airE) === true && canTarget(gunTower, gndE) === true);

  // 自动开波：倒计时到 0 就开
  S.enemies.length = 0;
  S.wave = 0;
  S.waveActive = false;
  S.nextT = 0.01;
  update(0.05);
  ok('autoWave', S.wave === 1 && S.waveActive === true);

  // 倍速范围 1..5
  const sp0 = S.speed;
  S.speed = 5;
  ok('speedFive', S.speed === 5);
  S.speed = sp0;

  // ── 分支 / L4 / 技能 / 道具 ──
  let brOk = true;
  for (const k of TOWER_KEYS) {
    const d = TOWER_DEF[k];
    if (!d.evolve || d.evolve.length !== 3) brOk = false;
    for (const br of d.evolve) {
      if (!br.stats || !br.l4 || !br.l4.name || !br.l4.mult) brOk = false;
    }
  }
  ok('threeBranches', brOk);

  const base = { type: 'gun', branch: 0 };
  const lv3 = towerStats(Object.assign({}, base, { level: 3 }));
  const lv4 = towerStats(Object.assign({}, base, { level: 4 }));
  ok('l4Stronger', lv4.dmg > lv3.dmg && lv4.rate < lv3.rate);

  const skTower = {
    x: 0, y: 0, type: 'gun', level: 1, branch: 0,
    cd: 0, cdActive: 0, activeT: 0, priority: 'first', dmgDealt: 0,
  };
  S.towers.push(skTower);
  useActive(skTower);
  ok('activeSkill', skTower.cdActive > 0 && skTower.activeT > 0);

  S.items = {};
  S.drops = [];
  S.enemies.length = 0;
  spawnEnemy('normal', 1, 0);
  const origRand3 = Math.random;
  Math.random = () => 0.01;
  damageEnemy(S.enemies[0], 999999, null);
  Math.random = origRand3;
  ok('itemDrops', S.drops.length > 0);

  S.items = { gold: 1 };
  const gBefore = S.gold;
  applyItem('gold', 0, 0);
  ok('itemUse', S.gold === gBefore + 420 && !S.items.gold);

  // ── 随机事件 ──
  S.wave = 4;
  S.waveActive = false;
  S.enemies.length = 0;
  S.nextT = 999;
  startWave();
  ok('eventEvery5', S.wave === 5 && S.event !== null);

  // 事件倍率真的生效
  S.event = { def: { enemyHp: 2, goldMul: 1.5 }, t: 0 };
  S.enemies.length = 0;
  spawnEnemy('normal', 1, 0);
  ok('eventHpMul', Math.abs(S.enemies[0].maxHp - 200) < 1);

  // 军火补给半价
  S.event = { def: { discount: true }, t: 0 };
  ok('eventDiscount', costOf(100) === 50);
  S.event = null;

  // ── Boss 阶段 ──
  S.enemies.length = 0;
  S.waveActive = false;
  S.nextT = 999;
  spawnEnemy('boss', 1, 0);
  const bz = S.enemies[0];
  bz.hp = bz.maxHp * 0.7;
  update(0.016);
  ok('bossPhase2', bz.p2 === true);

  bz.hp = bz.maxHp * 0.2;
  update(0.016);
  ok('bossPhase4', bz.p4 === true);

  // 恐惧光环让塔变慢（间接：存在 boss 时 rate 变大）
  ok('bossAura', typeof shake === 'function');

  // ── 第二关：六边形地图 ──
  const savedCam = { x: cam.x, y: cam.y, z: cam.z };
  const hut = newState(false, 2);
  ok('hexGrid397', hut.grid.length === 397 && hut.hex.cells.length === 397);
  ok('hexPathLong', hut.path.length > 80);
  let hexContig = true;
  for (let i = 1; i < hut.pathIds.length; i++) {
    if (!hexNeighbors(hut.hex, hut.pathIds[i - 1]).includes(hut.pathIds[i])) {
      hexContig = false;
      break;
    }
  }
  ok('hexPathContiguous', hexContig);
  ok('hexEnds', hut.pathIds[0] !== hut.pathIds[hut.pathIds.length - 1]);

  // 世界坐标 → 六边形反查要能对上
  const mid = hut.hex.cells[hut.pathIds[Math.floor(hut.pathIds.length / 2)]];
  ok('hexPick', hexAt(hut.hex, mid.x, mid.y) === mid.id);

  // 兵营出兵与拦截
  const bar = {
    cell: 400, x: 1.5, y: 1.5, type: 'barracks', level: 1, branch: 0,
    cd: 0, cdActive: 0, activeT: 0, priority: 'first', dmgDealt: 0, totalCost: 0,
    rally: { x: 1.5, y: 1.5 },
  };
  S.towers.push(bar);
  updateSoldiers(0.016);
  ok('barracksSpawns', S.soldiers.filter(x => x.tower === bar).length >= 1);

  // ── 新怪技能 ──
  S.enemies.length = 0;
  spawnEnemy('armored', 1, 0);
  const ar = S.enemies[0];
  const hpBefore = ar.hp;
  damageEnemy(ar, 100, null);
  ok('armoredReduces', Math.abs((hpBefore - ar.hp) - 75) < 1);

  S.enemies.length = 0;
  spawnEnemy('digger', 1, 0);
  const dg = S.enemies[0];
  dg.burrowT = 1.5;
  const dgHp = dg.hp;
  damageEnemy(dg, 500, null);
  ok('diggerImmune', dg.hp === dgHp);

  S.enemies.length = 0;
  spawnEnemy('ghost', 1, 0);
  const gh = S.enemies[0];
  gh.ghostT = 1;
  const gunT = { type: 'gun', cell: 0, x: 0, y: 0 };
  ok('ghostUntarget', canTarget(gunT, gh) === false);

  S.enemies.length = 0;
  spawnEnemy('splitter', 1, 0);
  const sp2 = S.enemies[0];
  damageEnemy(sp2, 99999, null);
  ok('splitterSpawns', S.enemies.filter(x => x.type === 'splitter').length >= 3);
  cam.x = savedCam.x; cam.y = savedCam.y; cam.z = savedCam.z;

  const pre = document.createElement('pre');
  pre.style.cssText = 'position:fixed;inset:0;background:#0a0f16;color:#e8eef6;' +
    'font:600 20px/2 monospace;padding:36px;z-index:999;margin:0;white-space:pre-wrap';
  pre.textContent = res.join('\n');
  document.body.appendChild(pre);
}
</script>
