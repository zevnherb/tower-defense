  let best = null, bd = Infinity;
  for (const o of S.obs) {
    if (!o.totemRef || o.hp <= 0) continue;
    const d = dist(cx, cy, o.cx, o.cy);
    if (d <= st.range * 1.5 + 1 && d < bd) { bd = d; best = o; }
  }
  return best;
}

function findSealInRange(t, st) {
  const cx = t.x + 0.5, cy = t.y + 0.5;
  let best = null, bd = Infinity;
  for (const o of S.obs) {
    if (!o.sealOf || o.hp <= 0) continue;
    let d = Infinity;
    for (const c of o.cells) {
      d = Math.min(d, dist(cx, cy, c.x + 0.5, c.y + 0.5));
    }
    if (d <= st.range * 1.6 + 1.5 && d < bd) { bd = d; best = o; }
  }
  return best;
}

function attackObstacle(t, st, only) {
  const cx = t.x + 0.5, cy = t.y + 0.5;
  // 指定目标（土块/图腾/锁定）时允许更远的“救援射程”，
  // 否则搜索半径和实际射程不一致，塔会一直空洞瞄准
  const range = only ? (st.range * 1.6 + 1.5) : st.range;
  let best = null, bd = Infinity;
  for (const o of S.obs) {
    if (o.hp <= 0) continue;
    if (only && o !== only) continue;
    let d = Infinity;
    for (const c of o.cells) {
      const dd = dist(cx, cy, c.x + 0.5, c.y + 0.5);
      if (dd < d) d = dd;
    }
    if (d <= range && d < bd) { bd = d; best = o; }
  }
  if (!best) return;

  t.cd = Math.max(st.rate || 0.4, 0.35);
  const dmg = (st.dmg || st.dps || 10) * (only ? 1.5 : 0.55);
  best.hp -= dmg;
  t.angle = Math.atan2(best.cy - cy, best.cx - cx);
  addFx(best.cx, best.cy, 'chip', 0.3);

  if (best.hp <= 0) destroyObstacle(best);
}

/* ══════════════════════════════════════════════════════════════
   主动技能
   ══════════════════════════════════════════════════════════════ */
function useActive(t) {
  const act = TOWER_ACTIVE[t.type];
  if (!act) return;
  if (t.cdActive > 0) { toast('技能冷却中 ' + Math.ceil(t.cdActive) + ' 秒'); return; }

  t.cdActive = act.cd;
  const st = towerStats(t);
  const cx = t.x + 0.5, cy = t.y + 0.5;

  flashScreen(TOWER_DEF[t.type].color, 0.16);
  addFx(cx, cy, 'boom', 0.55);
  addFx(cx, cy, 'gold', 1.1, act.name);

  switch (t.type) {
    case 'holy': {
      t.invulnT = 5;
      let cnt = 0;
      for (const o of S.towers) {
        if (o === t) continue;
        if (dist(cx, cy, o.x + 0.5, o.y + 0.5) > st.range) continue;
        o.invulnT = Math.max(o.invulnT || 0, 5);
        o.litHoly = 0.4;
        cnt++;
        addFx(o.x + 0.5, o.y + 0.5, 'tp', 0.55);
      }
      addFx(cx, cy, 'boom', 0.8);
      toast('圣域展开：' + (cnt + 1) + ' 座炮塔 5 秒无敌');
      sfx('upgrade');
      break;
    }
    case 'gun':
      t.activeT = act.dur;
      break;
    case 'cannon':
      for (const e of S.enemies) {
        if (e.dead || !canTarget(t, e)) continue;
        if (dist(cx, cy, e.x, e.y) <= st.range) damageEnemy(e, st.dmg * 3, t);
      }
      addFx(cx, cy, 'boom', 0.6);
      break;
    case 'frost':
      for (const e of S.enemies) {
        if (e.dead) continue;
        e.slowF = Math.max(e.slowF, 0.75);
        e.slowT = Math.max(e.slowT, act.dur);
      }
      addFx(cx, cy, 'boom', 0.7);
      break;
    case 'sniper': {
      let best = null, bv = -1;
      for (const e of S.enemies) {
        if (e.dead || !canTarget(t, e)) continue;
        if (dist(cx, cy, e.x, e.y) > st.range) continue;
        if (e.hp > bv) { bv = e.hp; best = e; }
      }
      if (best) {
        best.markT = 6;
        best.markBoost = 0.8;
        addFx(best.x, best.y, 'boom', 0.5);
      }
      break;
    }
    case 'flame':
      t.activeT = act.dur;
      break;
    case 'tesla':
      for (const e of S.enemies) {
        if (e.dead) continue;
        damageEnemy(e, 90, t);
      }
      addFx(cx, cy, 'boom', 0.8);
      break;
    case 'barracks':
      t.activeT = act.dur;
      for (const sd of S.soldiers) {
        if (sd.tower === t) { sd.dead = false; sd.hp = towerStats(t).hp; sd.respawnT = 0; }
      }
      break;
    case 'holy':
      for (const sd of S.soldiers) if (!sd.dead) sd.hp = towerStats(sd.tower).hp;
      break;
    case 'totem':
      t.activeT = act.dur;
      break;
    case 'aa':
      for (const e of S.enemies) {
        if (e.dead || !e.flying) continue;
        stunEnemy(e, act.dur);
      }
      addFx(cx, cy, 'boom', 0.7);
      break;
  }
  sfx('upgrade');
  if (S.selected === t) renderPanel();
}

/* ══════════════════════════════════════════════════════════════
   道具
   ══════════════════════════════════════════════════════════════ */
function addItem(kind) {
  S.items[kind] = (S.items[kind] || 0) + 1;
  logEvent('获得道具：' + ITEMS[kind].name, 'item');
  renderItems();
  toast('获得道具：' + ITEMS[kind].name);
  sfx('upgrade');
}

function useItem(kind) {
  if (!S.items[kind]) return;

  // 金币袋：一次全部用掉
  if (kind === 'gold') {
    const cnt = S.items.gold;
    S.gold += 420 * cnt;
    delete S.items.gold;
    toast('+' + (420 * cnt) + ' 金币（' + cnt + ' 袋）');
    sfx('kill');
    renderItems();
    updateHud();
    return;
  }

  if (ITEMS[kind].targeted) {
    S.targeting = kind;
    toast('点击地图释放「' + ITEMS[kind].name + '」');
    return;
  }
  applyItem(kind, 0, 0);
}

function applyItem(kind, wx, wy) {
  if (!S.items[kind]) return;
  S.items[kind]--;
  if (S.items[kind] <= 0) delete S.items[kind];

  switch (kind) {
    case 'freeze': {
      const FZ_CAP = 20;   // 叠加上限 20 秒
      let total = 0;
      for (const e of S.enemies) {
        if (e.dead) continue;
        if (isBossLike(e)) {
          e.bossVuln = Math.min(16, (e.bossVuln || 0) + 6);
          addFx(e.x, e.y, 'tp', 0.4);
        } else {
          e.stunT = Math.min(FZ_CAP, (e.stunT || 0) + 6);
          if (e.stunT > total) total = e.stunT;
        }
      }
      flashScreen('#5ad1ff', 0.30);
      announce('时间冻结 · 全场定身 ' + Math.round(total) + ' 秒', '#5ad1ff');
      sfx('freeze');
      break;
    }
    case 'gold':
      S.gold += 420;
      toast('+420 金币');
      break;
    case 'repair':
      S.lives = Math.min(25, S.lives + 6);
      toast('基地 +6 血');
      break;
    case 'rage':
      S.rageT = Math.min(30, (S.rageT || 0) + 8);   // 叠加上限 30 秒
      toast('全场炮塔射速 ×2，剩余 ' + Math.round(S.rageT) + ' 秒');
      break;
    case 'airstrike':
      for (let i = 0; i < 8; i++) {
        const px = wx + rnd(-2.4, 2.4);
        const py = wy + rnd(-2.4, 2.4);
        addFx(px, py, 'boom', 0.55);
        for (const e of S.enemies) {
          if (e.dead) continue;
          if (dist(px, py, e.x, e.y) <= 2.2) damageEnemy(e, 280, null);
        }
        // 同时清理土块 / 图腾 / 障碍物
        for (const o of S.obs.slice()) {
          if (!o.cells || o.hp <= 0) continue;
          let hit = false;
          for (const c of o.cells) {
            if (dist(px, py, c.x + 0.5, c.y + 0.5) < 1.9) { hit = true; break; }
          }
          if (!hit) continue;
          o.hp -= 520;
          addFx(o.cx != null ? o.cx : px, o.cy != null ? o.cy : py, 'chip', 0.5);
          if (o.hp <= 0) destroyObstacle(o);
        }
      }
      sfx('boom');
      shake(0.35);
      break;
  }
  renderItems();
  updateHud();
}

const LOG = [];
let logSeq = 0;

function logEvent(text, kind) {
  LOG.unshift({ text: text, kind: kind || 'info', id: ++logSeq });
  if (LOG.length > 30) LOG.pop();
  renderLog();
}

function renderLog() {
  const box = document.getElementById('log');
  if (!box) return;
  box.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const e of LOG.slice(0, 8)) {
    const d = document.createElement('div');
    d.className = 'logrow ' + e.kind;
    d.textContent = e.text;
    frag.appendChild(d);
  }
  box.appendChild(frag);
}

function renderItems() {
  const box = document.getElementById('items');
  if (!box) return;
  box.innerHTML = '';
  const owned = ITEM_KEYS.filter(k => S.items[k] > 0);
  if (!owned.length) {
    box.innerHTML = '<span style="color:#5a6577;font-size:11.5px">击杀怪物可掉落道具</span>';
    return;
  }
  owned.forEach(k => {
    const d = ITEMS[k];
    const b = document.createElement('button');
    b.className = 'item' + (S.targeting === k ? ' on' : '');
    b.title = d.name + '：' + d.desc;
    b.innerHTML = '<i style="color:' + d.color + '">' + d.icon + '</i>' +
                  '<span>' + d.name + '</span><b>×' + S.items[k] + '</b>';
    b.onclick = () => useItem(k);
    box.appendChild(b);
  });
}

function destroyObstacle(o) {
  const def = OBSTACLE_DEF[o.kind] || OBSTACLE_SEAL;
  for (const c of o.cells) {
    const cid = c.id != null ? c.id : c.y * N + c.x;
    S.grid[cid] = GRASS;
    S.obsAt[cid] = -1;
  }

  if (def.reward === 'tower') {
    // 掉落一座免费炮塔
    const type = TOWER_KEYS[(Math.random() * TOWER_KEYS.length) | 0];
    const spot = o.cells[0];
    if (S.grid[spot.y * N + spot.x] === GRASS) {
      S.towers.push({
        x: spot.x, y: spot.y, type, level: 1, branch: 0,
        cd: 0, angle: -Math.PI / 2, target: null, priority: 'first',
        kills: 0, dmgDealt: 0, totalCost: 0,
      });
      S.grid[spot.y * N + spot.x] = BUILT;
      addFx(spot.x + 0.5, spot.y + 0.5, 'gold', 1.6, TOWER_DEF[type].name);
      sfx('upgrade');
    }
  } else {
    S.gold += def.gold;
    addFx(o.cx, o.cy, 'gold', 1.1, '+ ' + def.gold);
  }

  if (o.nestRef) {
    S.nests = S.nests.filter(x => x !== o);
    const cid = o.cells[0].id;
    if (cid >= 0) { S.obsAt[cid] = -1; S.grid[cid] = GRASS; }
    addFx(o.cx, o.cy, 'boom', 0.9);
    S.gold += 120;
    logEvent('摧毁了魔物巢穴', 'build');
    sfx('boom');
    const i4 = S.obs.indexOf(o);
    if (i4 >= 0) S.obs.splice(i4, 1);
    return;
  }

  if (o.totemRef) {
    S.totems = S.totems.filter(x => x !== o);
    const cid = o.cells[0].id;
    if (cid >= 0) { S.obsAt[cid] = -1; S.grid[cid] = ROAD; }
    addFx(o.cx, o.cy, 'boom', 0.7);
    logEvent('图腾被摧毁', 'build');
    sfx('rock');
    const i3 = S.obs.indexOf(o);
    if (i3 >= 0) S.obs.splice(i3, 1);
    return;
  }

  if (o.sealOf) {
    o.sealOf.sealed = null;
    S.obsAt[o.cells[0].id] = -1;
    addFx(o.cx, o.cy, 'gold', 1.2, '解封');
    logEvent('土块被清除，炮塔恢复运转', 'build');
    sfx('rock');
    const i2 = S.obs.indexOf(o);
    if (i2 >= 0) S.obs.splice(i2, 1);
    return;
  }
  if (def.dmgAll) {
    S.dmgBonus = (S.dmgBonus || 0) + def.dmgAll;
    announce('全场炮塔伤害 +' + Math.round(def.dmgAll * 100) + '%', '#ffd76a');
    addFx(o.cx, o.cy, 'gold', 1.6, '+' + Math.round(def.dmgAll * 100) + '% 伤害');
  }
  if (def.freeTower) {
    const c = o.cells[Math.floor(o.cells.length / 2)];
    if (S.grid[c.id] === GRASS) {
      const tk = TOWER_KEYS[(Math.random() * TOWER_KEYS.length) | 0];
      const tw = buildTower(c.id, tk);
      if (tw && tw !== true) {
        tw.totalCost = 0;
        announce('获得免费炮塔：' + TOWER_DEF[tk].name, '#7ce8b0');
      }
    }
  }
  if (def.itemDrop) {
    const ik = ITEM_KEYS[(Math.random() * ITEM_KEYS.length) | 0];
    S.items[ik] = (S.items[ik] || 0) + 1;
    renderItems();
    announce('获得道具：' + ITEMS[ik].name, '#c084fc');
  }
  logEvent('清除 ' + def.name, 'build');
  sfx('rock');
  const i = S.obs.indexOf(o);
  if (i >= 0) S.obs.splice(i, 1);
}

let _lastAnn = { text: '', t: -99 };
// 原来会在地图上打大字横幅，现在统一写进左侧事件栏
function announce(text, color) {
  const now = (typeof S !== 'undefined' && S && S.time) ? S.time : (performance.now() / 1000);
  if (_lastAnn.text === text && now - _lastAnn.t < 1.5) return;
  _lastAnn = { text: text, t: now };
  logEvent(text, 'event');
  const el = document.getElementById('announce');
  if (el) el.classList.remove('on');
}

function flashScreen(color, a) {
  S.flashC = color || '#ffffff';
  S.flashA = Math.max(S.flashA || 0, a || 0.22);
}

function sealTower(t) {
  if (t.sealed) return;
  const cw = cellCenter(t.cell);
  const hp = 180 + S.wave * 22;
  const o = {
    id: S.obs.length, kind: 'seal', size: 1,
    hp: hp, maxHp: hp,
    x: cw.x - 0.5, y: cw.y - 0.5, cx: cw.x, cy: cw.y,
    cells: [{ id: t.cell, x: cw.x - 0.5, y: cw.y - 0.5 }],
    sealOf: t,
  };
  S.obs.push(o);
  t.sealed = o;
  S.obsAt[t.cell] = o.id;
  addFx(cw.x, cw.y, 'boom', 0.6);
  addFx(cw.x, cw.y, 'gold', 1.2, '封印！');
  shake(0.25);
  sfx('rock');
  logEvent('炮塔被土块封印了', 'boss');
}

function spawnZoneOnPath(kind, t) {
  let best = null, bt = -1;
  const st = towerStats(t);
  for (const e of S.enemies) {
    if (e.dead || e.flying || e.ufo) continue;
    if (dist(t.x + 0.5, t.y + 0.5, e.x, e.y) > st.range + 3.5) continue;
    if (e.t > bt) { bt = e.t; best = e; }
  }
  const pos = best ? { x: best.x, y: best.y } : pathPos(S.routes[0].length * 0.4, 0);
  placeZone(kind, pos.x, pos.y);
}

function spawnTornado(t) {
  placeZone('tornado', t.x + 0.5 + rnd(-3, 3), t.y + 0.5 + rnd(-3, 3));
  shake(0.2);
}

function placeZone(kind, wx, wy) {
  const z = {
    kind: kind, x: wx, y: wy,
    r: kind === 'tornado' ? 2.6 : 1.5,
    life: kind === 'tornado' ? 7 : 5,
    max: kind === 'tornado' ? 7 : 5,
    hp: kind === 'ice' ? 420 + S.wave * 30 : 0,
    maxHp: kind === 'ice' ? 420 + S.wave * 30 : 0,
    vx: 0, vy: 0,
  };
  if (kind === 'tornado') { z.vx = rnd(-0.5, 0.5); z.vy = rnd(-0.35, 0.35); }
  S.zones.push(z);
  addFx(wx, wy, 'boom', 0.5);
  return z;
}

function updateZones(dt) {
  if (!S.zones) S.zones = [];
  for (const z of S.zones) {
    z.life -= dt;
    if (z.kind === 'tornado') {
      z.x += z.vx * dt;
      z.y += z.vy * dt;
      const b = mapBounds();
      if (z.x < b.minX || z.x > b.maxX) z.vx *= -1;
      if (z.y < b.minY || z.y > b.maxY) z.vy *= -1;
      z.x = clamp(z.x, b.minX, b.maxX);
      z.y = clamp(z.y, b.minY, b.maxY);
    }
  }
  S.zones = S.zones.filter(z => z.life > 0 && !(z.kind === 'ice' && z.hp <= 0));
}

function dropLevitator(e) {
  if (e.dropped) return;
  e.dropped = true;
  e.dead = true;
  const len = S.routes[e.route || 0].length;
  for (let k = 0; k < 5; k++) {
    spawnEnemy(['normal', 'fast', 'tank', 'splitter', 'armored'][k % 5], 1, e.route,
      { t: Math.floor(len * (0.35 + k * 0.05)), gold: 5 });
  }
  addFx(e.x, e.y, 'boom', 0.9);
  announce('空投！', '#7fe3ff');
  shake(0.3);
  sfx('event');
  logEvent('浮空法师投放了 5 只怪物', 'boss');
}

function updateGiant(e, dt) {
  // 被冻结时暂停一切技能；注意巨人走的是独立更新分支，
  // 普通兵的 stunT 递减在移动逻辑里，这里必须自己扣，否则会永久冻结
  if (e.bossVuln > 0) e.bossVuln -= dt;
  if (e.stunT > 0) { e.stunT -= dt; return; }
  const b = mapBounds();
  e.gt = (e.gt || 0) + dt;
  const cx2 = (b.minX + b.maxX) / 2;
  const cy2 = (b.minY + b.maxY) / 2;
  const spanX2 = b.maxX - b.minX;
  const spanY2 = b.maxY - b.minY;

  // 每只 BOSS 有一个游走目标点，到了就换一个新的
  e.gwait = (e.gwait || 0) - dt;
  const needNew = !e.gtgt ||
    (Math.abs(e.x - e.gtgt.x) < 1.8 && Math.abs(e.y - e.gtgt.y) < 1.8);
  if (needNew && e.gwait <= 0) {
    e.gtgt = {
      x: cx2 + rnd(-spanX2 * 0.32, spanX2 * 0.32),
      y: cy2 + rnd(-spanY2 * 0.26, spanY2 * 0.26),
    };
    e.gwait = rnd(0.8, 2.4);
  }

  const tg = e.gtgt || { x: cx2, y: cy2 };
  const dx2 = tg.x - e.x, dy2 = tg.y - e.y;
  const dd2 = Math.hypot(dx2, dy2) || 1;
  const baseSpd = e.giant === 'bomber' ? 2.6 : (e.giant === 'balloon' ? 1.15 : 1.55);
  const step2 = Math.min(dd2, baseSpd * dt);
  e.x += dx2 / dd2 * step2;
  e.y += dy2 / dd2 * step2;
  e.gvx = dx2 / dd2;
  e.gvy = dy2 / dd2;

  // 各自的姿态摆动
  if (e.giant === 'saucer') {
    e.y += Math.sin(e.gt * 1.7) * 0.7 * dt;
    e.x += Math.cos(e.gt * 0.9) * 0.4 * dt;
  } else if (e.giant === 'balloon') {
    e.x += Math.sin(e.gt * 0.85) * 0.9 * dt;
    e.y += Math.cos(e.gt * 1.25) * 0.6 * dt;
  } else {
    // 侦察机：明显的俯冲起伏
    e.y += Math.sin(e.gt * 2.6) * 2.2 * dt;
  }

  e.x = clamp(e.x, b.minX + 2, b.maxX - 2);
  e.y = clamp(e.y, b.minY + 2, b.maxY - 2);

  // ── 外星侦察机：半血护盾 + 濒死超级轰炸 ──
  if (e.giant === 'bomber') {
    e.invulnT = Math.max(0, (e.invulnT || 0) - dt);
    e.shieldCd = (e.shieldCd == null ? 10 : e.shieldCd) - dt;
    const hpr2 = e.hp / e.maxHp;
    if (hpr2 <= 0.5 && e.shieldCd <= 0) {
      e.shieldCd = 10;
      e.invulnT = 5;
      addFx(e.x, e.y, 'bombwave', 1.1);
      addFx(e.x, e.y, 'tp', 0.9);
      announce('护盾展开｜5 秒无敌', '#7fe3ff');
      sfx('event');
      logEvent('侦察机展开护盾，5 秒内免疫伤害', 'boss');
    }
    if (hpr2 <= 0.05 && !e.superAnnounced) {
      e.superAnnounced = true;
      e.invulnT = Math.max(e.invulnT || 0, 5);
      addFx(e.x, e.y, 'bombwave', 1.2);
      announce('超级广域轰炸！护盾展开', '#ff6b3d');
      shake(0.8);
      sfx('boss');
      logEvent('侦察机进入濒死状态，开始超级广域轰炸', 'boss');
    }
  }

  e.gcd = (e.gcd == null ? 4 : e.gcd) - dt;
  if (e.gcd > 0) return;
  const kind = e.giant;
  const late = S.wave >= 16;
  const fast20 = S.wave >= 20 ? 2 : 1;   // 20 波后技能速度翻倍
  if (kind === 'saucer') {
    e.gcd = ((late ? 9 : 26) / (S.wave >= 10 ? 1.8 : 1)) / fast20;
    // 小飞碟数量上限：随波次提高，后期大量释放
    const cap = S.wave >= 26 ? 30
      : S.wave >= 22 ? 22
      : S.wave >= 18 ? 16
      : (late ? 10 : 5);
    const alive = S.enemies.filter(o => !o.dead && o.type === 'ufo').length;
    if (alive < cap) spawnEnemy('ufo', 1, 0, { gold: 5 });
    addFx(e.x, e.y, 'boom', 0.8);
  } else if (kind === 'balloon') {
    e.gcd = (late ? 3.2 : 5) / fast20;
    const pool = ['normal', 'fast', 'tank', 'armored', 'splitter', 'swarm'];
    const cnt = late ? 6 : 3;
    for (let k = 0; k < cnt; k++) {
      spawnEnemy(pool[(Math.random() * pool.length) | 0], late ? 1.35 : 1, 0,
        { t: Math.floor((S.routes[0].length) * (0.25 + Math.random() * 0.5)), gold: 1 });
    }
    addFx(e.x, e.y, 'boom', 1.0);
    sfx('event');
  } else {
    // 高频 · 低伤 · 广域轰炸（濒死时超级模式）
    const sup = e.hp / e.maxHp <= 0.05;
    const w18 = S.wave >= 18;          // 18 波后进入削弱档
    e.gcd = sup ? 0.30 : (w18 ? 0.62 : (late ? 0.45 : 0.58));
    const bombs = sup ? 5 : (w18 ? 3 : (late ? 4 : 3));
    const rad = sup ? 4.0 : 2.4;
    const bdmg = sup ? 7 : (w18 ? 8 : (late ? 11 : 9));
    for (let k = 0; k < bombs; k++) {
      let bx, by;
      // 超级模式：50% 瞄准炮塔、50% 全路线随机；普通模式：75% 瞄准炮塔
      const aimTower = S.towers.length > 0 &&
        Math.random() < (sup ? 0.5 : 0.75);
      if (aimTower) {
        const tw = S.towers[(Math.random() * S.towers.length) | 0];
        const jit = sup ? 2.6 : 2.2;
        bx = tw.x + 0.5 + rnd(-jit, jit);
        by = tw.y + 0.5 + rnd(-jit, jit);
      } else {
        const nR = S.routes.length;
        const ri = (nR > 1 && Math.random() < 0.5) ? ((Math.random() * nR) | 0) : 0;
        const rt = S.routes[ri] || S.routes[0];
        const idx = Math.floor(Math.random() * Math.max(1, rt.length - 2));
        const pp = pathPos(idx, ri);
        // 沿路径法线方向抖动，落点分布到路两侧
        const c0 = rt[idx] || rt[0];
        const c1 = rt[Math.min(rt.length - 1, idx + 1)] || c0;
        const ang = Math.atan2(c1.y - c0.y, c1.x - c0.x) + Math.PI / 2;
        const off = rnd(-(sup ? 1.8 : 1.5), (sup ? 1.8 : 1.5));
        bx = pp.x + Math.cos(ang) * off;
        by = pp.y + Math.sin(ang) * off;
      }
      addFx(bx, by, 'bombwave', sup ? 1.5 : 1.05);
      if (sup) addFx(bx, by, 'boom', 0.6);
      for (const tw of S.towers.slice()) {
        if (dist(bx, by, tw.x + 0.5, tw.y + 0.5) <= rad) damageTower(tw, bdmg);
      }
    }
    shake(0.16);
    sfx('bomb');
    if (late && Math.random() < 0.5) {
      const fake = { x: e.x - 0.5, y: e.y - 0.5, t: Math.floor(S.routes[0].length * 0.5), route: 0 };
      plantTotem(fake, TOTEM_VARIANTS[(Math.random() * TOTEM_VARIANTS.length) | 0], 0);
    }
  }
}

const BASE_BRANCH = [
  { name: '机炮台', color: '#8fd694', dmg: 26, rate: 0.45, range: 5.5 },
  { name: '榴弹台', color: '#ffb86b', dmg: 62, rate: 1.10, range: 5.0, splash: 1.7 },
  { name: '光束台', color: '#7fe3ff', dmg: 18, rate: 0.22, range: 6.5 },
];
const BASE_MULT = [1, 2.2, 4.5, 8, 14];
// 基地等级带来的全局炮塔永久增益
const BASE_GD = [0, 0.06, 0.11, 0.17, 0.24, 0.32];   // 伤害加成
const BASE_GR = [0, 0.05, 0.09, 0.14, 0.20, 0.27];   // 射速加成（缩短间隔）
const BASE_COST = [800, 1800, 5500, 8000, 12000];

function buyBaseUpgrade(branch) {
  const next = S.baseTier + 1;
  if (next > 5) { toast('基地防御已满级'); return; }
  const need = next * 5;
  if (S.wave < need) { toast('需到第 ' + need + ' 波'); return; }
  const cost = BASE_COST[next - 1];
  if (S.gold < cost) { toast('金币不足 ' + cost); sfx('sell'); return; }
  S.gold -= cost;
  if (next === 1) S.baseBranch = branch;
  S.baseTier = next;
  S.baseCd = 0;
  const b = BASE_BRANCH[S.baseBranch];
  addFx(S.base.x + 0.5, S.base.y + 0.5, 'boom', 1.0);
  announce('基地强化 Lv.' + next + ' · ' + b.name + '　全局 +' +
    Math.round(BASE_GD[next] * 100) + '% 伤害', b.color);
  sfx('upgrade');
  updateHud();
}

function updateBaseFire(dt) {
  if (!S.baseTier) return;
  S.baseCd = (S.baseCd || 0) - dt;
  if (S.baseCd > 0) return;
  const b = BASE_BRANCH[S.baseBranch] || BASE_BRANCH[0];
  const m = BASE_MULT[S.baseTier - 1];
  const bx = S.base.x + 0.5, by = S.base.y + 0.5;
  let best = null, bestScore = -Infinity;
  for (const e of S.enemies) {
    if (e.dead) continue;
    const d = dist(bx, by, e.x, e.y);
    if (d > b.range) continue;
    // 越接近基地（路程进度越大）越优先，同进度优先残血
    const score = (e.t || 0) * 8 - d * 0.5 - (e.maxHp ? e.hp / e.maxHp : 0) * 6;
    if (score > bestScore) { bestScore = score; best = e; }
  }
  if (!best) { S.baseCd = 0.12; return; }
  addFx(bx, by, 'muzzle', 0.1);
  S.baseCd = b.rate;
  damageEnemy(best, b.dmg * m, null);
  addFx(best.x, best.y, 'hit', 0.22);
  if (b.splash) {
    addFx(best.x, best.y, 'boom', 0.4);
    for (const o of S.enemies) {
      if (o === best || o.dead) continue;
      if (dist(best.x, best.y, o.x, o.y) < b.splash) damageEnemy(o, b.dmg * m * 0.5, null);
    }
  }
  sfx('shoot');
}

function damageTower(t, dmg) {
  if (t.invulnT > 0) { addFx(t.x + 0.5, t.y + 0.5, 'chip', 0.15); return; }
  t.hp = (t.hp == null ? 100 : t.hp) - dmg;
  if (t.hp > 0) return;
  const refund = Math.floor((t.totalCost || 0) * 0.6);
  S.gold += refund;
  releaseTowerCell(t);
  S.soldiers = S.soldiers.filter(x => x.tower !== t);
  S.towers = S.towers.filter(x => x !== t);
  if (S.selected === t) deselect();
  addFx(t.x + 0.5, t.y + 0.5, 'boom', 1.1);
  toast('炮塔被炸毁，返还 ' + refund + ' 金');
  logEvent('炮塔被炸毁', 'boss');
}

function updateFlock(e, dt) {
  const b = mapBounds();
  const cx = (b.minX + b.maxX) / 2;
  const cy = (b.minY + b.maxY) / 2;
  const spanX = b.maxX - b.minX;
  const spanY = b.maxY - b.minY;

  e.flT = (e.flT || 0) + dt;
  // 角速度随时间轻微变化，避免匀速绕圈
  const spdJit = 1 + Math.sin(e.flT * 0.55 + (e.orbitA || 0)) * 0.28;
  e.orbitA += (e.orbitSpd || 0.35) * spdJit * dt;

  // 半径漂移 + 纵向抖动，让轨迹不规整
  const wob = Math.sin(e.flT * 0.8 + (e.orbitA || 0) * 1.7) * 0.055;
  const rx = spanX * (e.orbitR + wob);
  const ry = spanY * (e.orbitR * 0.68 + wob * 0.5);
  const bobY = Math.sin(e.flT * 1.9 + (e.orbitA || 0)) * 1.1;

  e.x = cx + Math.cos(e.orbitA) * rx;
  e.y = cy + Math.sin(e.orbitA) * ry + bobY;
}

// 原图朝左的素材：翻一次抵消，让它和朝右的素材行为一致
const ART_FACES_LEFT = { boss: true };

function enemyFace(e) {
  if (e.flying) return e.faceX || 1;
  const rt = S.routes[e.route || 0];
  if (!rt) return 1;
  const a = pathPos(e.t, e.route || 0);
  const b = pathPos(Math.min(rt.length - 1.01, e.t + 0.7), e.route || 0);
  const dx = b.x - a.x;
  if (Math.abs(dx) > 0.12) e.faceX = dx > 0 ? 1 : -1;
  return e.faceX || 1;
}

// ── 普通怪配色：预渲染染色贴图（兼容 Safari，不依赖 ctx.filter）──
const TINT_COLORS = ['#7fe3ff', '#ffd76a', '#ff9ad1', '#9dff9a', '#c084fc', '#ffb27f'];
const _tintCache = new Map();

function tintedTex(img, color) {
  const key = color + ':' + (img.src ? img.src.length : 0);
  let c = _tintCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = 0.58;
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  g.globalAlpha = 1;
  c.complete = true;   // 让调用方的 img.complete 检查通过（canvas 没有此属性）
  _tintCache.set(key, c);
  return c;
}

function enemyTex(e) {
  const base = (e.type === 'dragonYoung') ? ENEMY_IMG.dragon : (ENEMY_IMG[e.type] || null);
  if (!base) return null;
  if (e.tintIdx != null && base.complete && base.width) {
    return tintedTex(base, TINT_COLORS[e.tintIdx % TINT_COLORS.length]);
  }
  return base;
}

function drawTexEnemy(e) {
  const q = w2s(e.x, e.y);
  const img = enemyTex(e);
  if (!img || !img.complete || !img.width) return;
  const d = ENEMY_DEF[e.type];
  const H = d.r * cam.z * 3.4;
  const face = enemyFace(e) * (ART_FACES_LEFT[e.type] ? -1 : 1);
  const bob = Math.sin(S.time * 7 + (e.x * 3 + e.y * 5)) * H * 0.035;

  // 贴图（脸部朝向移动方向）
  ctx.save();
  ctx.globalAlpha = e.ghostT > 0 ? 0.5 : 1;
  ctx.translate(q[0], q[1] + bob);
  ctx.scale(face, 1);
  if (e.slowT > 0 && e.slowF < 0.9) {
    ctx.filter = 'saturate(0.55) brightness(1.15)';
  }
  ctx.drawImage(img, -H / 2, -H * 0.62, H, H);
  ctx.restore();

  // 冻结：冰霜罩
  if (e.stunT > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const fr = H * 0.42;
    const gt = ctx.createRadialGradient(q[0], q[1], fr * 0.2, q[0], q[1], fr);
    gt.addColorStop(0, 'rgba(160,230,255,.34)');
    gt.addColorStop(0.7, 'rgba(110,200,255,.22)');
    gt.addColorStop(1, 'rgba(90,209,255,0)');
    ctx.fillStyle = gt;
    ctx.beginPath(); ctx.arc(q[0], q[1], fr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,240,255,.85)';
    ctx.lineWidth = Math.max(1.5, cam.z * 0.045);
    ctx.beginPath(); ctx.arc(q[0], q[1] - H * 0.1, fr * 0.95, 0, Math.PI * 2); ctx.stroke();
    // 冰晶
    ctx.strokeStyle = 'rgba(220,250,255,.75)';
    ctx.lineWidth = Math.max(1, cam.z * 0.03);
    for (let i = 0; i < 6; i++) {
      const a7 = i * Math.PI / 3 + S.time * 0.3;
      const r1 = fr * 0.55, r2 = fr * (0.85 + Math.sin(S.time * 3 + i) * 0.05);
      ctx.beginPath();
      ctx.moveTo(q[0] + Math.cos(a7) * r1, q[1] - H * 0.1 + Math.sin(a7) * r1);
      ctx.lineTo(q[0] + Math.cos(a7) * r2, q[1] - H * 0.1 + Math.sin(a7) * r2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 护盾环
  if (e.shield > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(140,220,255,.75)';
    ctx.lineWidth = Math.max(1.5, cam.z * 0.06);
    ctx.beginPath();
    ctx.ellipse(q[0], q[1] - H * 0.1, H * 0.34, H * 0.42, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 血条
  const hpR = clamp(e.hp / e.maxHp, 0, 1);
  if (hpR < 1) {
    const bw = H * 0.5, bh = Math.max(2.5, cam.z * 0.055);
    const bx = q[0] - bw / 2, by = q[1] - H * 0.78;
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = hpR > 0.4 ? '#9df0b5' : '#ff9a9a';
    ctx.fillRect(bx, by, bw * hpR, bh);
  }
}

function drawMage(e) {
  const q = w2s(e.x, e.y);
  const R = ENEMY_DEF.totemMage.r * cam.z;
  const bob = Math.sin(S.time * 3 + (e.x + e.y)) * R * 0.10;

  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.26)';
  ctx.beginPath();
  ctx.ellipse(q[0], q[1] + R * 0.95, R * 0.7, R * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();

  // 紫色法环
  const pu = 0.5 + Math.sin(S.time * 4) * 0.5;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(192,132,252,' + (0.45 + pu * 0.4) + ')';
  ctx.lineWidth = Math.max(1.5, cam.z * 0.07);
  ctx.beginPath();
  ctx.ellipse(q[0], q[1] + R * 0.9, R * 0.95, R * 0.34, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  if (MAGE_IMG.complete && MAGE_IMG.width) {
    const sc = R * 2.6;
    ctx.drawImage(MAGE_IMG, q[0] - sc / 2, q[1] - sc / 2 + bob, sc, sc);
  } else {
    ctx.fillStyle = '#c084fc';
    ctx.beginPath(); ctx.arc(q[0], q[1], R, 0, Math.PI * 2); ctx.fill();
  }

  // 名字
  ctx.save();
  ctx.fillStyle = 'rgba(216,180,254,.95)';
  ctx.font = '700 ' + Math.max(9, cam.z * 0.24) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('图腾法师', q[0], q[1] - R * 1.6);
  ctx.textAlign = 'start';
  ctx.restore();

  // 血条
  const hpR = clamp(e.hp / e.maxHp, 0, 1);
  if (hpR < 1) {
    const bw = R * 1.3, bh = Math.max(2.5, cam.z * 0.06);
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(q[0] - bw / 2 - 1, q[1] - R * 1.4, bw + 2, bh + 2);
    ctx.fillStyle = hpR > 0.4 ? '#9df0b5' : '#ff9a9a';
    ctx.fillRect(q[0] - bw / 2, q[1] - R * 1.4 + 1, bw * hpR, bh);
  }
}

function drawFlockBird(e) {
  const q = w2s(e.x, e.y);
  const R = (ENEMY_DEF[e.type].r || 0.7) * cam.z;
  const flap = 1 + Math.sin(S.time * 9 + (e.orbitA || 0) * 3) * 0.13;

  // 每只鸟独立高度
  const hK = 0.5 + 0.5 * Math.sin((e.flT || 0) * 1.9 + (e.orbitA || 0) * 2);
  const lift = R * 0.55 * hK;

  // 地面投影：越高越小越淡
  ctx.fillStyle = 'rgba(0,0,0,' + (0.22 - 0.12 * hK) + ')';
  ctx.beginPath();
  ctx.ellipse(q[0], q[1] + R * (1.35 + 0.18 * hK),
    R * 0.7 * (1 - 0.28 * hK), R * 0.22 * (1 - 0.28 * hK), 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.globalAlpha = 0.95;
  if (e.hue) ctx.filter = 'hue-rotate(' + e.hue + 'deg)';
  ctx.translate(q[0], q[1] - lift);
  ctx.rotate(S.time * 0.6 + (e.orbitA || 0));
  ctx.scale(1, flap);
  ctx.drawImage(FLOCK_IMG, -R, -R, R * 2, R * 2);
  ctx.restore();

  // 血条
  const hpR = clamp(e.hp / e.maxHp, 0, 1);
  if (hpR < 1) {
    const bw = R * 1.3, bh = Math.max(2.5, cam.z * 0.06);
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(q[0] - bw / 2 - 1, q[1] - R - bh - 4, bw + 2, bh + 2);
    ctx.fillStyle = hpR > 0.4 ? '#9df0b5' : '#ff9a9a';
    ctx.fillRect(q[0] - bw / 2, q[1] - R - bh - 3, bw * hpR, bh);
  }
}

function updateUfo(e, dt) {
  const u = e.ufo || (e.ufo = { tgt: null, cool: 0, flee: 0 });
  u.cool -= dt;

  // 受到集火 → 闪避并换目标
  if (u.flee <= 0 && (e.hitAcc || 0) > 60) {
    u.flee = 2.2;
    u.cool = 0.6;
    e.hitAcc = 0;
    if (u.tgt && u.tgt.suppressedBy === e) u.tgt.suppressedBy = null;
    u.tgt = null;
    addFx(e.x, e.y, 'boom', 0.5);
  }
  e.hitAcc = (e.hitAcc || 0) * Math.max(0, 1 - dt * 3);
  if (u.flee > 0) u.flee -= dt;

  // 目标失效则解除
  if (u.tgt && (!S.towers.includes(u.tgt) || u.tgt.suppressedBy && u.tgt.suppressedBy !== e)) {
    if (u.tgt.suppressedBy === e) u.tgt.suppressedBy = null;
    u.tgt = null;
  }

  // 选目标
  if (!u.tgt && u.cool <= 0 && u.flee <= 0) {
    let best = null, bd = 1e9;
    for (const tw of S.towers) {
      if (tw.suppressedBy) continue;
      const d = dist(e.x, e.y, tw.x + 0.5, tw.y + 0.5);
      if (d < bd) { bd = d; best = tw; }
    }
    if (best) u.tgt = best; else u.cool = 2;
  }

  // 移动 / 悬停
  if (u.tgt && u.flee <= 0) {
    const tx = u.tgt.x + 0.5;
    const ty = u.tgt.y + 0.5 - 0.55;
    const d = dist(e.x, e.y, tx, ty);
    if (d > 0.22) {
      const step = Math.min(e.speed * dt, d);
      e.x += (tx - e.x) / d * step;
      e.y += (ty - e.y) / d * step;
    } else {
      u.tgt.suppressedBy = e;
    }
  } else {
    // 逃逸漂移
    e.x += Math.cos(S.time * 1.7) * e.speed * dt * 0.8;
    e.y += Math.sin(S.time * 1.3) * e.speed * dt * 0.8;
  }

  const b = mapBounds();
  e.x = clamp(e.x, b.minX, b.maxX);
  e.y = clamp(e.y, b.minY, b.maxY);
}

function drawGiant(e) {
  const q = w2s(e.x, e.y);
  const d = ENEMY_DEF[e.type];
  const hpr = clamp(e.hp / e.maxHp, 0, 1);
  const growK = e.giant === 'balloon' ? (1 + (1 - hpr) * 4.45) : 1;
  const R = d.r * cam.z * growK;
  const img = BOSS_IMG[e.giant];
  const GLOW = { saucer: 'rgba(120,210,255,', balloon: 'rgba(255,140,60,', bomber: 'rgba(190,120,255,' };
  const gl = GLOW[e.giant] || 'rgba(255,255,255,';

  // 高度相位：0=贴地 1=最高
  const altPh = S.time * 0.85 + (e.gt || 0);
  const hK = 0.5 + 0.5 * Math.sin(altPh);
  const lift = R * 0.46 * hK;
  const bob = Math.sin(S.time * 1.4 + (e.gt || 0)) * R * 0.03;
  const pulse = 1 + Math.sin(S.time * 2.1 + (e.gt || 0)) * 0.035;
  const cy = q[1] + bob - lift;

  // 高度参考线（从影子到本体）
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + 0.07 * hK) + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(q[0], q[1] + R * 0.95);
  ctx.lineTo(q[0], cy + R * 0.55);
  ctx.stroke();

  // 地面投影：越高越小越淡
  ctx.fillStyle = 'rgba(0,0,0,' + (0.30 - 0.17 * hK) + ')';
  ctx.beginPath();
  ctx.ellipse(q[0], q[1] + R * (1.02 + 0.10 * hK),
    R * 0.92 * pulse * (1 - 0.24 * hK), R * 0.24 * (1 - 0.25 * hK), 0, 0, Math.PI * 2);
  ctx.fill();

  // 呼吸光晕
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(q[0], cy, R * 0.15, q[0], cy, R * (1.35 + 0.08 * Math.sin(S.time * 2)));
  gg.addColorStop(0, gl + '0.34)');
  gg.addColorStop(0.55, gl + '0.12)');
  gg.addColorStop(1, gl + '0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(q[0], cy, R * 1.45, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 环形动态（母舰：旋转信号灯）
  if (e.giant === 'saucer') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 8; i++) {
      const a2 = S.time * 2.2 + i * Math.PI / 4;
      const px = q[0] + Math.cos(a2) * R * 0.86 * pulse;
      const py = cy + Math.sin(a2) * R * 0.30 * pulse;
      ctx.fillStyle = i % 2 ? 'rgba(120,255,220,.95)' : 'rgba(255,120,120,.9)';
      ctx.beginPath(); ctx.arc(px, py, R * 0.045, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 黑洞：旋臂光环
  if (e.giant === 'balloon') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const a0 = S.time * 1.9 + i * 2.1;
      ctx.strokeStyle = 'rgba(255,150,60,' + (0.5 - i * 0.12) + ')';
      ctx.lineWidth = Math.max(1.5, R * 0.05);
      ctx.beginPath();
      ctx.arc(q[0], cy, R * (0.95 + i * 0.09), a0, a0 + 1.9);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 侦察机：尾焰（沿航向反方向）
  if (e.giant === 'bomber') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const hd = Math.atan2(e.gvy || 0, e.gvx || 1);
    for (let i = 0; i < 4; i++) {
      const ph = ((S.time * 3 + i * 0.25) % 1);
      const back = R * (0.55 + ph * 0.9);
      const fx2 = q[0] - Math.cos(hd) * back + Math.cos(hd + Math.PI / 2) * Math.sin(i * 2 + S.time * 9) * R * 0.06;
      const fy2 = cy - Math.sin(hd) * back + Math.sin(hd + Math.PI / 2) * Math.sin(i * 2 + S.time * 9) * R * 0.06;
      ctx.fillStyle = 'rgba(190,130,255,' + (1 - ph) * 0.7 + ')';
      ctx.beginPath(); ctx.arc(fx2, fy2, R * 0.10 * (1 - ph * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 贴图（呼吸缩放 + 倾斜）
  if (img && img.complete && img.width) {
    ctx.save();
    ctx.translate(q[0], cy);
    if (e.giant === 'bomber') {
      // 机头朝前：贴图机头朝右，按航向旋转
      ctx.rotate(Math.atan2(e.gvy || 0, e.gvx || 1));
    } else if (e.giant === 'balloon') {
      ctx.rotate(S.time * 0.5);
    } else {
      ctx.rotate(Math.sin(S.time * 0.9) * 0.05);
    }
    const sc = R * 2 * pulse;
    ctx.drawImage(img, -sc / 2, -sc / 2, sc, sc);
    ctx.restore();
  } else {
    ctx.fillStyle = d.color;
    ctx.beginPath(); ctx.arc(q[0], cy, R * 0.85, 0, Math.PI * 2); ctx.fill();
  }

  // 血条 + 名字
  const hpR = hpr;
  const bw = R * 1.7, bh = Math.max(5, cam.z * 0.12);
  const barY = cy - R - bh - 8;
  ctx.fillStyle = 'rgba(0,0,0,.8)';
  ctx.fillRect(q[0] - bw / 2 - 2, barY, bw + 4, bh + 4);
  ctx.fillStyle = hpR > 0.4 ? '#ff6b6b' : '#ff2f2f';
  ctx.fillRect(q[0] - bw / 2, barY + 1, bw * hpR, bh);
  ctx.fillStyle = '#fff';
  ctx.font = '700 ' + Math.max(9, cam.z * 0.24) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(d.name, q[0], barY - 3);

  // 无敌护盾
  if (e.giant === 'bomber' && e.invulnT > 0) {
    const k6 = clamp(e.invulnT / 5, 0, 1);
    const pr = R * 1.35;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sg = ctx.createRadialGradient(q[0], cy, pr * 0.7, q[0], cy, pr);
    sg.addColorStop(0, 'rgba(120,220,255,0)');
    sg.addColorStop(0.75, 'rgba(120,220,255,' + (0.16 + 0.10 * Math.sin(S.time * 8)) + ')');
    sg.addColorStop(1, 'rgba(160,240,255,' + (0.42 * k6) + ')');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(q[0], cy, pr, 0, Math.PI * 2); ctx.fill();
    // 六边形网格
    ctx.strokeStyle = 'rgba(180,240,255,' + (0.45 * k6) + ')';
    ctx.lineWidth = Math.max(1, cam.z * 0.04);
    for (let ring = 0; ring < 2; ring++) {
      const rr = pr * (0.55 + ring * 0.42);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a6 = i * Math.PI / 3 + S.time * 0.6;
        const px = q[0] + Math.cos(a6) * rr, py = cy + Math.sin(a6) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
    // 脉冲边缘
    ctx.strokeStyle = 'rgba(200,250,255,' + (0.55 * k6) + ')';
    ctx.lineWidth = Math.max(1.5, cam.z * 0.06);
    ctx.beginPath(); ctx.arc(q[0], cy, pr * (0.98 + 0.03 * Math.sin(S.time * 10)), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ctx.textAlign = 'start';
}

function drawUfo(e) {
  const q = w2s(e.x, e.y);
  const R = (ENEMY_DEF[e.type].r || 0.6) * cam.z;
  const pu = 0.5 + Math.sin(S.time * 5) * 0.5;

  // 地面投影
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(q[0], q[1] + R * 0.9, R * 1.1, R * 0.34, 0, 0, Math.PI * 2); ctx.fill();

  // 压制光束
  const tgt = e.ufo && e.ufo.tgt;
  if (tgt && tgt.suppressedBy === e) {
    const tq = w2s(tgt.x + 0.5, tgt.y + 0.5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const bg = ctx.createLinearGradient(q[0], q[1], tq[0], tq[1]);
    bg.addColorStop(0, 'rgba(160,230,255,.42)');
    bg.addColorStop(1, 'rgba(160,230,255,.05)');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(q[0] - R * 0.4, q[1]);
    ctx.lineTo(q[0] + R * 0.4, q[1]);
    ctx.lineTo(tq[0] + R * 0.55, tq[1]);
    ctx.lineTo(tq[0] - R * 0.55, tq[1]);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 碟身
  const g = ctx.createLinearGradient(q[0], q[1] - R, q[0], q[1] + R);
  g.addColorStop(0, '#e8f4ff');
  g.addColorStop(0.45, '#8fb8d8');
  g.addColorStop(1, '#2e4257');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(q[0], q[1], R * 1.05, R * 0.46, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,30,45,.85)';
  ctx.lineWidth = Math.max(1.5, R * 0.09);
  ctx.stroke();

  // 舱盖
  ctx.fillStyle = 'rgba(180,240,255,.85)';
  ctx.beginPath();
  ctx.ellipse(q[0], q[1] - R * 0.32, R * 0.42, R * 0.34, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth = Math.max(1, R * 0.05);
  ctx.stroke();

  // 旋转信号灯
  for (let i = 0; i < 5; i++) {
    const a = S.time * 3 + i * Math.PI * 2 / 5;
    const px = q[0] + Math.cos(a) * R * 0.82;
    const py = q[1] + Math.sin(a) * R * 0.36;
    ctx.fillStyle = i % 2 ? 'rgba(255,90,90,.95)' : 'rgba(120,255,200,.95)';
    ctx.beginPath(); ctx.arc(px, py, R * 0.10, 0, Math.PI * 2); ctx.fill();
  }

  // 血条
  const hpR = clamp(e.hp / e.maxHp, 0, 1);
  const bw = R * 2.2, bh = Math.max(3, cam.z * 0.08);
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.fillRect(q[0] - bw / 2 - 1.5, q[1] - R * 1.05 - bh - 3, bw + 3, bh + 3);
  ctx.fillStyle = hpR > 0.4 ? '#9df0b5' : '#ff9a9a';
  ctx.fillRect(q[0] - bw / 2, q[1] - R * 1.05 - bh - 2, bw * hpR, bh);
}

function plantTotemRandom(variant) {
  for (let tries = 0; tries < 220; tries++) {
    const i = (Math.random() * S.grid.length) | 0;
    if (S.grid[i] !== ROAD) continue;
    if (S.totems.some(t => t.cells[0].id === i)) continue;
    const cw = cellCenter(i);
    if (!cw) continue;
    plantTotem({ x: cw.x, y: cw.y, t: 0, route: 0 }, variant, 0);
    return true;
  }
  return false;
}

function plantTotem(e, variant, tOff) {
  let wx0 = e.x, wy0 = e.y;
  if (tOff) {
    const pp = pathPos(Math.min(S.routes[e.route || 0].length - 1.01, e.t + tOff), e.route || 0);
    wx0 = pp.x; wy0 = pp.y;
  }
  const cw = cellCenter(cellIdAt(wx0, wy0));
  const gx = cw ? cw.x : wx0;
  const gy = cw ? cw.y : wy0;
  const hp = 1200 + S.wave * 220;
  const cellId = cellIdAt(wx0, wy0);
  const tm = {
    kind: 'totem', variant: variant, size: 1,
    hp: hp, maxHp: hp, r: 3.0,
    cx: gx, cy: gy,
    x: gx - 0.5, y: gy - 0.5,
    cells: [{ id: cellId >= 0 ? cellId : 0, x: gx - 0.5, y: gy - 0.5 }],
    id: S.obs.length,
    totemRef: true,
  };
  tm.totemRef = tm;
  S.totems.push(tm);
  S.obs.push(tm);

  // 图腾总量上限，超出则移除最旧的
  while (S.totems.length > 20) {
    const old = S.totems.shift();
    const oi = S.obs.indexOf(old);
    if (oi >= 0) S.obs.splice(oi, 1);
    if (old.cells[0] && old.cells[0].id >= 0) S.obsAt[old.cells[0].id] = -1;
  }
  addFx(gx, gy, 'boom', 0.6);
  addFx(gx, gy, 'gold', 1.3, '图腾！');
  shake(0.2);
  sfx('build');
  logEvent('图腾法师插下了' + (TOTEM_NAME[variant] || '图腾'), 'boss');
}

const TOTEM_VARIANTS = [
  'speed', 'heal', 'shield', 'ward', 'fly', 'armor', 'curse', 'boom',
  'evade', 'split', 'decay', 'blind', 'frenzy',
];

const TOTEM_NAME = {
  speed: '疾行图腾', heal: '回生图腾', shield: '守护图腾',
  ward: '净化图腾', fly: '浮空图腾',
  armor: '铁壁图腾', curse: '咒怨图腾', boom: '引爆图腾',
  evade: '闪避图腾', split: '分裂图腾', decay: '腐蚀图腾',
  blind: '致盲图腾', frenzy: '狂暴图腾',
};

function teleportTower(t) {
  const fromCell = t.cell;
  let cell = -1;
  for (let i = 0; i < 300; i++) {
    const c = Math.floor(Math.random() * S.grid.length);
    if (S.grid[c] === GRASS) { cell = c; break; }
  }
  if (cell < 0) return;
  const cw = cellCenter(cell);
  const fx0 = t.x + 0.5, fy0 = t.y + 0.5;
  addFx(fx0, fy0, 'tp', 0.7);
  addFx(cw.x, cw.y, 'tp', 0.7);
  clearSealAt(fromCell);
  S.grid[fromCell] = GRASS;
  S.grid[cell] = BUILT;
  t.cell = cell;
  t.x = cw.x - 0.5;
  t.y = cw.y - 0.5;
  t.cd = Math.max(t.cd, 0.6);
  sfx('teleport');
  logEvent('传送法师把一座炮塔传走了', 'boss');
}

function landRider(e) {
  const route = S.routes[e.route || 0];
  let bi = 0, bd = 1e9;
  for (let i = 0; i < route.length; i++) {
    const d = dist(e.x, e.y, route[i].x + 0.5, route[i].y + 0.5);
    if (d < bd) { bd = d; bi = i; }
  }
  e.flying = false;
  e.t = bi;
  e.speed = 0.78;
  e.landed = true;
}

function shake(v) {
  if (!S) return;
  S.shake = Math.max(S.shake || 0, v);
}

/* ══════════════════════════════════════════════════════════════
   特效
   ══════════════════════════════════════════════════════════════ */
function addFx(x, y, type, life, text) {
  S.fx.push({ x, y, type, life, max: life, text });
}

/* ══════════════════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════════════════ */
let lastT = 0;

function update(dt) {
  if (S.speed === 10) {
    // update() 每帧会按倍速执行多次，这里要按份数折算，保证 60 秒是真实时间
    S.fast10Left = Math.max(0, (S.fast10Left || 0) - dt / Math.max(1, S.speed));
    if (S.fast10Left <= 0) {
      S.speed = 1;
      toast('10 倍速时间到，已恢复 1×');
    }
  }
  S.stepStamp = (S.stepStamp | 0) + 1;   // 每步失效敌人空间网格
  if (S.paused || S.over) return;

  // 日志聚合：击杀与漏怪不能刷屏
  S.killBufT += dt;
  if (S.killBufT >= 1.6) {
    if (S.killBuf.n > 0) {
      S.killBuf.n = 0;
      S.killBuf.gold = 0;
    }
    S.killBufT = 0;
  }
  S.leakBufT += dt;
  if (S.leakBufT >= 1.2) {
    if (S.leakBuf.n > 0) {
      logEvent('漏怪 ' + S.leakBuf.n + ' 只，基地 -' + S.leakBuf.hp + ' 血', 'leak');
      S.leakBuf.n = 0;
      S.leakBuf.hp = 0;
    }
    S.leakBufT = 0;
  }
  S.time += dt;

  // 自动开波：上一波清完后倒计时
  if (!S.waveActive && !S.over) {
    S.nextT -= dt;
    if (S.nextT <= 0) startWave();
  }

  // 生成
  if (S.waveActive && S.spawnQueue.length) {
    S.spawnTimer -= dt;
    if (S.spawnTimer <= 0) {
      const item = S.spawnQueue.shift();
      spawnEnemy(item.type, item.hpScale, item.route);
      S.spawnTimer = item.type === 'boss' ? 1.6 : 0.55;
    }
  }

  // 敌人
  for (const t of S.towers) {
    if (t.suppressedBy && (t.suppressedBy.dead || !S.enemies.includes(t.suppressedBy))) t.suppressedBy = null;
  }

  for (const e of S.enemies) {
    if (e.dead) continue;

    // ── 区域效果 ──
    e.zoneBlock = false;
    for (const z of (S.zones || [])) {
      if (dist(e.x, e.y, z.x, z.y) > z.r) continue;
      if (z.kind === 'ice' && !e.flying) {
        e.zoneBlock = true;
      } else if (z.kind === 'storm') {
        e.slowF = Math.max(e.slowF || 0, 0.5);
        e.slowT = Math.max(e.slowT, 0.4);
        e.hp -= 9 * dt;
      } else if (z.kind === 'tornado') {
        e.disT = Math.max(e.disT || 0, 0.5);
        if (e.flying) e.t = Math.max(0, e.t - 2.2 * dt);
        e.hp -= 14 * dt;
      }
    }

    // ── 图腾增益 ──
    e.buffSpd = 1;
    e.airborne = false;
    e.armorBuff = 0;
    e.boomOnDeath = false;
    e.evadeBuff = 0;
    e.splitBuff = false;
    for (const tm of S.totems) {
      if (dist(e.x, e.y, tm.cx, tm.cy) > tm.r) continue;
      if (tm.variant === 'speed') e.buffSpd = 1.25;
      else if (tm.variant === 'heal') e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.022 * dt);
      else if (tm.variant === 'shield') {
        e.shieldMax = Math.max(e.shieldMax || 0, e.maxHp * 0.11);
        e.shield = Math.max(e.shield || 0, e.shieldMax);
      } else if (tm.variant === 'ward') {
        e.slowT = 0; e.burnT = 0; e.markT = 0; e.warded = true;
      } else if (tm.variant === 'fly') e.airborne = true;
      else if (tm.variant === 'armor') e.armorBuff = 0.82;
      else if (tm.variant === 'boom') e.boomOnDeath = true;
      else if (tm.variant === 'evade') e.evadeBuff = 0.25;
      else if (tm.variant === 'split') e.splitBuff = true;
      else if (tm.variant === 'frenzy') e.buffSpd = Math.max(e.buffSpd, 1.14);
    }

    // 咒怨图腾：压制范围内炮塔
    for (const tm2 of S.totems) {
      if (tm2.variant === 'decay') {
        for (const tw3 of S.towers) {
          if (dist(tw3.x + 0.5, tw3.y + 0.5, tm2.cx, tm2.cy) > tm2.r) continue;
          damageTower(tw3, 1.5 * dt);
        }
      }
      if (tm2.variant === 'blind') {
        for (const tw4 of S.towers) {
          if (dist(tw4.x + 0.5, tw4.y + 0.5, tm2.cx, tm2.cy) > tm2.r) continue;
          tw4.blindT = 0.4;
        }
      }
      if (tm2.variant !== 'curse') continue;
      for (const tw2 of S.towers) {
        if (dist(tw2.x + 0.5, tw2.y + 0.5, tm2.cx, tm2.cy) > tm2.r) continue;
        tw2.curseT = 0.4;
      }
    }

    // ── 图腾法师插图腾 ──

    if (e.type === 'ufo') { updateUfo(e, dt); continue; }
    if (e.type === 'flock') { updateFlock(e, dt); continue; }
    if (e.giant) { updateGiant(e, dt); continue; }

    // ── 新怪技能 ──
    if (e.type === 'ghost') {
      if (e.ghostT > 0) e.ghostT -= dt;
      else {
        e.ghostCd = (e.ghostCd == null ? 4 : e.ghostCd) - dt;
        if (e.ghostCd <= 0) { e.ghostT = 1.2; e.ghostCd = 4; }
      }
    }
    if (e.type === 'medic') {
      e.healCd = (e.healCd == null ? 1 : e.healCd) - dt;
      if (e.healCd <= 0) {
        e.healCd = 1;
        for (const o of S.enemies) {
          if (o.dead || o === e) continue;
          if (dist(e.x, e.y, o.x, o.y) < 2.6) {
            o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.03);
            o.slowT = 0;
            o.burnT = 0;
          }
        }
      }
    }
    if (e.type === 'digger') {
      if (e.burrowT > 0) {
        e.burrowT -= dt;
        if (e.burrowT <= 0) {
          // 钻出时向前窜 3 格
          const L = S.routes[e.route || 0].length;
          e.t = Math.min(L - 1.01, e.t + 3);
          addFx(e.x, e.y, 'boom', 0.5);
        }
      } else {
        e.burrowCd = (e.burrowCd == null ? 5 : e.burrowCd) - dt;
        if (e.burrowCd <= 0) { e.burrowT = 1.5; e.burrowCd = 5; }
      }
    }

    // 盗贼：一边走一边扒金币
    if (e.type === 'thief') {
      e.stealCd = (e.stealCd == null ? 4 : e.stealCd) - dt;
      if (e.stealCd <= 0) {
        e.stealCd = 4;
        const got = Math.min(12, Math.floor(S.gold));
        if (got > 0) {
          S.gold -= got;
          addFx(e.x, e.y, 'gold', 0.9, '-' + got);
        }
      }
    }
    if (e.type === 'summoner') {
      e.sumCd = (e.sumCd == null ? 9 : e.sumCd) - dt;
      if (e.sumCd <= 0) {
        e.sumCd = 9;
        for (let k = 0; k < 2; k++) {
          spawnEnemy('swarm', 1, e.route, { t: Math.max(0, e.t - 0.5), noSplit: true });
        }
        addFx(e.x, e.y, 'boom', 0.4);
      }
    }
    if (e.type === 'tpmage') {
      e.tpCd = (e.tpCd == null ? 5 : e.tpCd) - dt;
      if (e.tpCd <= 0) {
        e.tpCd = 6;
        const others = S.enemies.filter(o => o !== e && !o.dead && !o.flying && o.route === e.route);
        if (others.length) {
          const o = others[(Math.random() * others.length) | 0];
          const tmp = e.t;
          e.t = o.t;
          o.t = tmp;
          addFx(e.x, e.y, 'tp', 0.55);
          addFx(o.x, o.y, 'tp', 0.55);
          sfx('teleport');
        }
      }
    }
    if (e.type === 'earthfiend') {
      e.sealCd = (e.sealCd == null ? 2.5 : e.sealCd) - dt;
      if (e.sealCd <= 0) {
        let best = null, bd = 6.5;
        for (const tw of S.towers) {
          if (tw.sealed) continue;
          const d = dist(e.x, e.y, tw.x + 0.5, tw.y + 0.5);
          if (d < bd) { bd = d; best = tw; }
        }
        if (best) {
          sealTower(best);
          e.sealCd = 9;
        } else {
          e.sealCd = 1.5;
        }
      }
    }
    if (e.type === 'warlock') {
      e.tpCd = (e.tpCd == null ? 6 : e.tpCd) - dt;
      if (e.tpCd <= 0) {
        e.tpCd = 6;
        const before = e.t;
        e.t = Math.min(S.routes[e.route].length - 2, e.t + 4);
        if (e.t !== before) addFx(e.x, e.y, 'boom', 0.5);
      }
    }
    if (e.type === 'mimic') {
      e.mimicCd = (e.mimicCd == null ? 7 : e.mimicCd) - dt;
      if (e.mimicCd <= 0 && (e.mimicN || 0) < 2) {
        e.mimicN = (e.mimicN || 0) + 1;
        e.mimicCd = 7;
        spawnEnemy('mimic', 1, e.route, { t: e.t, hpOverride: e.maxHp * 0.5, noSplit: true });
      }
    }

    // ── 技能 ──
    if (e.type === 'fast') {
      if (e.dashT > 0) e.dashT -= dt;
      else {
        e.dashCd -= dt;
        if (e.dashCd <= 0) { e.dashT = 0.5; e.dashCd = 2.2; }
      }
    }
    if (e.type === 'tank' && e.shield < e.shieldMax) {
      e.shieldIdle += dt;
      if (e.shieldIdle > 4) {
        e.shield = Math.min(e.shieldMax, e.shield + e.shieldMax * 0.3 * dt);
      }
    }
    if (e.type === 'boss') {
      const pct = e.hp / e.maxHp;
      if (pct < 0.75 && !e.p2) {
        e.p2 = true;
        for (let k = 0; k < 3; k++) {
          spawnEnemy('larva', 1, e.route, {
            t: Math.max(0, e.t - 1.2),
            hpOverride: Math.max(20, e.maxHp * 0.05),
            noSplit: true,
          });
        }
        addFx(e.x, e.y, 'boom', 0.8);
        toast('首领召唤了援军');
        logEvent('首领召唤了 3 只援军', 'boss');
        announce('召唤援军', '#ff9a3c');
      }
      if (pct < 0.25 && !e.p4) {
        e.p4 = true;
        for (const tw of S.towers) tw.cd = Math.max(tw.cd, 2.5);
        shake(0.6);
        addFx(e.x, e.y, 'boom', 1.0);
        toast('首领发出恐惧咆哮，全体炮塔停滞');
        logEvent('首领恐惧咆哮！全场炮塔停滞 2.5 秒', 'boss');
        announce('恐惧咆哮！', '#ff3d3d');
        flashScreen('#ff3d3d', 0.45);
        sfx('lose');
      }
      if (!e.enraged && e.hp < e.maxHp * 0.5) {
        e.enraged = true;
        addFx(e.x, e.y, 'boom', 0.7);
        logEvent('首领血量过半，进入狂暴', 'boss');
        sfx('leak');
      }
      if (e.enraged) {
        e.summonCd -= dt;
        if (e.summonCd <= 0) {
          e.summonCd = 7;
          for (let k = 0; k < 2; k++) {
            spawnEnemy('larva', 1, e.route, {
              t: Math.max(0, e.t - 1.2),
              hpOverride: Math.max(20, e.maxHp * 0.055),
              noSplit: true,
            });
          }
          addFx(e.x, e.y, 'boom', 0.5);
        }
      }
    }
    // 空中母舰：定期投放飞行体
    if (e.type === 'dragon') {
      e.summonCd -= dt;
      if (e.summonCd <= 0) {
        e.summonCd = 12;
        for (let k = 0; k < 2; k++) {
          spawnEnemy('flyer', 1, e.route, {
            start: { x: e.x - 0.5 + (k - 1) * 0.45, y: e.y - 0.5 },
            hpOverride: Math.max(40, e.maxHp * 0.015),
            noSplit: true,
          });
        }
        addFx(e.x, e.y, 'boom', 0.5);
      }
    }

    if (e.stunT > 0) { e.stunT -= dt; }
    else {
      let sp = e.speed * (e.speedMul || 1);
      let blocked = false;
      if (!e.flying && S.soldiers.length) {
        for (const sd of S.soldiers) {
          if (sd.dead) continue;
          if (dist(sd.x, sd.y, e.x, e.y) < 0.95) {
            blocked = true;
            sd.hp -= (MELEE[e.type] || 10) * dt;
            break;
          }
        }
      }
      if (e.slowT > 0) { e.slowT -= dt; sp *= (1 - e.slowF); }
      if (e.disT > 0) { e.disT -= dt; sp = -Math.abs(sp) * 1.5; }
      if (e.dashT > 0) sp *= 2.6;
      if (e.enraged) sp *= 1.45;
      if (e.burrowT > 0) sp *= 3;
      if (e.buffSpd && e.buffSpd !== 1) sp *= e.buffSpd;
      if (!blocked && !e.zoneBlock) e.t += sp * dt;
    }
    if (e.burnT > 0) {
      e.burnT -= dt;
      damageEnemy(e, e.burnDps * dt, null);
    }
    if (e.markT > 0) e.markT -= dt;
    if (e.bossVuln > 0) e.bossVuln -= dt;

    // 浮空法师：飞抵基地附近或到达终点就投放
    if (e.type === 'levitator' && !e.dropped) {
      const bx2 = S.base.x + 0.5, by2 = S.base.y + 0.5;
      if (dist(e.x, e.y, bx2, by2) < 3.5 || e.t >= e.flyLen - 0.5) {
        dropLevitator(e);
        continue;
      }
    }

    const done = e.flying
      ? (e.t >= e.flyLen)
      : (e.t >= S.routes[e.route].length - 1);

    if (done) {
      if (e.type === 'levitator') {
        dropLevitator(e);
        continue;
      }
      e.dead = true;
      const loss = e.type === 'dragon' ? 12 : e.type === 'boss' ? 8 : e.type === 'tank' ? 3 : 1;
      S.lives -= loss;
    if (S.speed === 10) {
      S.speed = 1;
      toast('基地受损，10 倍速已自动关闭');
      sfx('leak');
    }
      S.leaked++;
      S.leakBuf.n++;
      S.leakBuf.hp += loss;
      addFx(e.x, e.y, 'leak', 0.6);
      sfx('leak');
      if (S.lives <= 0) { S.lives = 0; gameOver(false); }
    } else if (e.flying) {
      const f = clamp(e.t / e.flyLen, 0, 1);
      e.x = e.fx0 + (e.fx1 - e.fx0) * f;
      e.y = e.fy0 + (e.fy1 - e.fy0) * f;
    } else {
      const p = pathPos(e.t, e.route);
      e.x = p.x; e.y = p.y;
    }
  }

  // 冷却与增益计时
  if (S.rageT > 0) S.rageT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 1.8);
  if (S.flashA > 0) S.flashA = Math.max(0, S.flashA - dt * 1.6);
  for (const t of S.towers) {
    if (t.cdActive > 0) t.cdActive -= dt;
  }

  // 掉落道具倒计时（到时间自动收进背包）
  if (S.drops.length) {
    for (const d of S.drops) d.life -= dt;
    for (const d of S.drops) {
      if (d.life <= 0) addItem(d.kind);
    }
    S.drops = S.drops.filter(d => d.life > 0);
  }

  // 塔
  for (const t of S.towers) fireTower(t, dt);

  // 兵营士兵
  if (S.soldiers.length || S.towers.some(t => t.type === 'barracks')) updateSoldiers(dt);
  if (S.zones.length) updateZones(dt);
  updateSpikes(dt);
  autoTowerTick(dt);
  autoSkillTick(dt);
  updateVines(dt);
  updateBaseFire(dt);

  for (const t of S.towers) {
    if (t.invulnT > 0) t.invulnT -= dt;
    if (t.litHoly > 0) t.litHoly -= dt;
    if (t.litTotem > 0) t.litTotem -= dt;
  }

  // 圣光塔：修复范围内炮塔耐久
  for (const ht of S.towers) {
    if (ht.type !== 'holy') continue;
    const hs = towerStats(ht);
    for (const tw of S.towers) {
      if (dist(ht.x + 0.5, ht.y + 0.5, tw.x + 0.5, tw.y + 0.5) > hs.range) continue;
      if ((tw.hp || 100) >= (tw.maxHp || 100)) continue;
      // 自己只能缓慢自愈（约 40% 效率）
      const rate = (tw === ht) ? 3.6 : 9;
      tw.hp = Math.min(tw.maxHp || 100, (tw.hp || 100) + rate * dt);
      tw.litHoly = 0.25;
    }
  }

  // 金矿地块：建在上面的塔持续产金
  for (const t of S.towers) {
    if (t.goldGen) { S.gold += t.goldGen * dt; }
  }

  // 魔物巢穴：定时放怪
  if (S.nests && S.nests.length) {
    for (const nst of S.nests) {
      nst.cool -= dt;
      if (nst.cool <= 0) {
        nst.cool = 7 + Math.random() * 4;
        const pool = ['normal', 'fast', 'swarm', 'splitter'];
        spawnEnemy(pool[(Math.random() * pool.length) | 0], 1, 0, { t: nst.pathT });
        addFx(nst.cx, nst.cy, 'boom', 0.5);
        sfx('leak');
      }
    }
  }

  // 子弹
  for (const s of S.shots) {
    const e = s.target;
    s.px = s.x; s.py = s.y;
    let tx, ty;
    if (e && !e.dead) { tx = e.x; ty = e.y; }
    else { tx = s.x; ty = s.y; }
    const dx = tx - s.x, dy = ty - s.y;
    const d = Math.hypot(dx, dy);
    const stepLen = s.speed * dt;
    if (d <= stepLen) {
      s.x = tx; s.y = ty;
      s.done = true;
      impact(s);
    } else {
      s.x += dx / d * stepLen;
      s.y += dy / d * stepLen;
    }
  }

  // 清理
  S.enemies = S.enemies.filter(e => !e.dead);
  S.shots = S.shots.filter(s => !s.done);
  S.fx = S.fx.filter(f => (f.life -= dt) > 0);

  // 波次结束
  if (S.waveActive && S.spawnQueue.length === 0) {
    S.waveActive = false;
    if (S.enemies.length) logEvent('新一波已开始，场上仍有残敌', 'wave');
    S.event = null;
    const bonus = 40 + S.wave * 6;
    S.gold += bonus;
    S.nextT = 20;
    toast('第 ' + S.wave + ' 波结束  +' + bonus + ' 金币');
    updateHud();
    if (S.wave >= WAVE_MAX && !S.won && !S.awaitChoice && S.enemies.length === 0) {
      if (endlessMode) {
        if (!S.endlessAnnounced) {
          S.endlessAnnounced = true;
          announce('无尽模式 · 继续挑战', '#ffcf6b');
          logEvent('已开启无尽模式，波次持续提升', 'event');
        }
        S.won = false;
      } else {
        S.awaitChoice = true;
        showEndChoice();
      }
    }
  }
  updateHud();
}

function impact(s) {
  const critMul = (s.crit && Math.random() < s.crit) ? 2 : 1;

  // 毒气塔：命中位置留下一团持续扩散的毒雾
  if (s.type === 'poison') {
    S.fx.push({ type: 'fog', x: s.x, y: s.y, life: 1.6, max: 1.6 });
    S.fx.push({ type: 'fog', x: s.x + rnd(-0.3, 0.3), y: s.y + rnd(-0.3, 0.3), life: 1.9, max: 1.9 });
  }

  // 终极溅射塔：沿路径连炸
  if (s.chainBlast > 0 && s.target && !s.target.dead) {
    const route = S.routes[s.target.route || 0];
    const base = s.target.t;
    for (let k = 1; k <= s.chainBlast; k++) {
      const tt = Math.min(route.length - 1.01, base + k * 1.5);
      const p = pathPos(tt, s.target.route || 0);
      addFx(p.x, p.y, 'boom', 0.42 + k * 0.03);
      for (const o of S.enemies) {
        if (o.dead) continue;
        if (dist(p.x, p.y, o.x, o.y) <= 1.55) {
          damageEnemy(o, s.dmg * 0.5, s.src);
        }
      }
    }
    shake(0.18);
    sfx('boom');
  }

  if (s.splash > 0) {
    addFx(s.x, s.y, 'boom', 0.35);
    if (s.chainBlast > 0) {
      addFx(s.x, s.y, 'boom', 0.55);
      shake(0.22);
    }
    for (const e of S.enemies) {
      if (e.dead) continue;
      const d = dist(s.x, s.y, e.x, e.y);
      if (d <= s.splash) {
        const falloff = 1 - 0.45 * (d / s.splash);
        damageEnemy(e, s.dmg * falloff * critMul, s.src);
      }
    }
    // 集束弹：主爆点周围再炸几个小点
    if (s.cluster > 0) {
      for (let i = 0; i < s.cluster; i++) {
        const a = (i / s.cluster) * Math.PI * 2 + Math.random() * 0.5;
        const px = s.x + Math.cos(a) * s.splash * 0.85;
        const py = s.y + Math.sin(a) * s.splash * 0.85;
        addFx(px, py, 'boom', 0.28);
        for (const e of S.enemies) {
          if (e.dead) continue;
          if (dist(px, py, e.x, e.y) <= s.splash * 0.55) {
            damageEnemy(e, s.dmg * 0.35, s.src);
          }
        }
      }
    }
    sfx('boom');
    return;
  }

  const e = s.target;
  if (!e || e.dead) return;
  let dmg = s.dmg * critMul;
  if (s.bonusSlowed && e.slowT > 0) dmg *= s.bonusSlowed;
  damageEnemy(e, dmg, s.src);
  if (s.slow) { e.slowF = s.slow; e.slowT = Math.max(e.slowT, s.slowT); }
  if (s.push) { e.t = Math.max(0, e.t - s.push); }
  if (s.dis && e.flying) e.disT = Math.max(e.disT || 0, s.dis);
  if (s.mark) { e.markT = 3.0; e.markBoost = s.mark; }
  if (s.pierce > 0) {
    let n = 0;
    for (const o of S.enemies) {
      if (o.dead || o === e) continue;
      if (n >= Math.round(s.pierce)) break;
      if (dist(e.x, e.y, o.x, o.y) < 1.2) { damageEnemy(o, s.dmg * 0.7, s.src); n++; }
    }
  }
  addFx(e.x, e.y, 'hit', 0.2);
}

function applyMobileLayout() {
  const pal = document.getElementById('palette');
  if (!pal) return;
  const portrait = cw < 760 && ch > cw;
  if (cw < 760) {
    pal.style.setProperty('position', 'fixed', 'important');
    pal.style.setProperty('left', '0', 'important');
    pal.style.setProperty('right', '0', 'important');
    pal.style.setProperty('transform', 'none', 'important');
    pal.style.setProperty('margin', '0', 'important');
    pal.style.setProperty('box-sizing', 'border-box', 'important');
    pal.style.setProperty('width', cw + 'px', 'important');
    pal.style.setProperty('max-width', cw + 'px', 'important');
    if (portrait) {
      pal.style.setProperty('display', 'grid', 'important');
      pal.style.setProperty('grid-auto-flow', 'column', 'important');
      pal.style.setProperty('grid-template-rows', 'repeat(2, 84px)', 'important');
      pal.style.setProperty('grid-auto-columns', '86px', 'important');
      pal.style.setProperty('grid-template-columns', 'none', 'important');
      pal.style.setProperty('grid-auto-rows', 'auto', 'important');
      pal.style.setProperty('height', '184px', 'important');
      pal.style.setProperty('max-height', '184px', 'important');
      pal.style.setProperty('overflow-x', 'auto', 'important');
      pal.style.setProperty('overflow-y', 'hidden', 'important');
      pal.style.setProperty('justify-content', 'start', 'important');
      pal.style.setProperty('align-content', 'center', 'important');

  } else {
    ['position','left','right','transform','margin','box-sizing','width','max-width',
     'display','grid-template-columns','grid-auto-rows','height','max-height',
     'overflow-x','overflow-y'].forEach(k => pal.style.removeProperty(k));
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cw = window.innerWidth; ch = window.innerHeight;
  cv.width = cw * DPR; cv.height = ch * DPR;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (typeof applyMobileLayout === 'function') applyMobileLayout();
  if (S) {
    clampCam();
    if (typeof framePath === 'function') setTimeout(framePath, 60);
    if (typeof applyMobileLayout === 'function') setTimeout(applyMobileLayout, 0);
  }
}
window.addEventListener('resize', () => {
  resize();
  if (typeof framePath === 'function') framePath();
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { resize(); if (typeof framePath === 'function') framePath(); }, 260);
});
screen.orientation && screen.orientation.addEventListener &&
  screen.orientation.addEventListener('change', () => {
    setTimeout(() => { resize(); if (typeof framePath === 'function') framePath(); }, 260);
  });

/** 把镜头限制在地图内；视野比地图大时居中 */
function mapBounds() {
  // 地图边界以整张格子为准，避免 bounds 偏移导致画面不居中
  if (S.mode === 'hex') return S.bounds || { minX: 0, maxX: N, minY: 0, maxY: N };
  return { minX: 0, maxX: N, minY: 0, maxY: N };
}

function clampCam() {
  const b = mapBounds();
  const halfW = cw / 2 / cam.z, halfH = ch / 2 / cam.z;
  const w = b.maxX - b.minX, h = b.maxY - b.minY;
  const mx = (b.minX + b.maxX) / 2, my = (b.minY + b.maxY) / 2;
  if (cw < 760 && ch > cw) {
    // 竖屏：强制水平居中，避免后续镜头重设把画面推偏
    cam.x = mx;
  } else {
    cam.x = (halfW * 2 >= w) ? mx : clamp(cam.x, b.minX + halfW, b.maxX - halfW);
  }
  cam.y = (halfH * 2 >= h) ? my : clamp(cam.y, b.minY + halfH, b.maxY - halfH);
}

/** 开局把镜头对准整条路（留 4 格边距） */
function framePath() {
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const c of S.path) {
    minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
    minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y);
  }
  const b = mapBounds();
  cam.x = (minX + maxX) / 2 + 0.5;
  cam.y = (minY + maxY) / 2 + 0.5;
  if (S.mode === 'hex') {
    cam.x = (b.minX + b.maxX) / 2;
    cam.y = (b.minY + b.maxY) / 2;
  }

  const fullW = (b.maxX - b.minX) + 2, fullH = (b.maxY - b.minY) + 2;
  const wCells = Math.max((maxX - minX) + 4, fullW);
  const hCells = Math.max((maxY - minY) + 4, fullH);
  // 预留顶部 HUD 和底部工具栏的空间
  const availW = cw - 60, availH = ch - 150;
  let z;
  if (cw < 760) {
    const portrait = ch > cw;
    // 用地图真实跨度，做到左右铺满屏幕
    const spanW = Math.max(1, (b.maxX - b.minX) + 1.2);
    const spanH = Math.max(1, (b.maxY - b.minY) + 1.2);
    z = cw / spanW;                       // 先按宽度铺满
    const regionTop = 96;                 // HUD 高度
    const regionH = portrait ? (ch * 0.60 - regionTop) : (ch - regionTop - 150);
    if (spanH * z > regionH) z = regionH / spanH;
    // 地图中心对齐到可用区域的中心
    const mapPxH = spanH * z;
    const wantY = regionTop + Math.max(0, (regionH - mapPxH) / 2) + mapPxH / 2;
    cam.oy = portrait ? (wantY - ch / 2) : 0;
    cam.x = (b.minX + b.maxX) / 2;
    cam.y = (b.minY + b.maxY) / 2;
  } else {
    z = Math.min(availW / wCells, availH / hCells);
    z = Math.max(z, availW / fullW);
    if (hCells * z > availH) z = availH / hCells;
    // 六边形地图格子小，至少放到能看清塔的倍率（允许平移查看）
    if (S.mode === 'hex') z = Math.max(z, 20);
  }
  cam.z = clamp(z, 8, 60);
  clampCam();
  // 竖屏：水平方向强制居中，避免视野大于地图时被 clampCam 推偏
  if (cw < 760 && ch > cw) {
    // 用真实地图列数重新贴合宽度并居中
    let rx0 = 1e9, rx1 = -1e9, ry0 = 1e9, ry1 = -1e9;
    for (let i = 0; i < S.grid.length; i++) {
      if (S.grid[i] === GRASS) continue;
      const gx = i % N, gy = (i / N) | 0;
      if (gx < rx0) rx0 = gx;
      if (gx > rx1) rx1 = gx;
      if (gy < ry0) ry0 = gy;
      if (gy > ry1) ry1 = gy;
    }
    if (rx1 < rx0) { rx0 = 0; rx1 = N - 1; ry0 = 0; ry1 = N - 1; }
    // 整张地图（N×N）放进上方可用区域并居中
    const palH = 184 + 54;                    // 两行建造栏 + 道具栏
    const regionH2 = Math.max(130, ch - 96 - palH);
    const zW = cw / N;
    const zH = regionH2 / N;
    cam.z = clamp(Math.min(zW, zH), 8, 60);
    cam.x = N / 2;
    cam.y = N / 2;
    const mapPx = N * cam.z;
    cam.oy = (96 + Math.max(0, (regionH2 - mapPx) / 2) + mapPx / 2) - ch / 2;
  }
}

function portraitLayout() {
  return cw < 760 && ch > cw;
}
function w2s(wx, wy) {
  return [(wx - cam.x) * cam.z + cw / 2, (wy - cam.y) * cam.z + ch / 2 + (cam.oy || 0)];
}
function s2w(sx, sy) {
  return [(sx - cw / 2) / cam.z + cam.x, (sy - ch / 2 - (cam.oy || 0)) / cam.z + cam.y];
}

// 地形离屏缓存：把整张草地一次性画进位图，之后每帧只需 1 次 drawImage
let terrainCv = null, terrainDirty = true;
const TCELL = 40;   // 每格像素（越大越清晰，内存也越大）

function buildTerrain() {
  const size = N * TCELL;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const n = hash2(x, y);
      g.fillStyle = 'hsl(' + (130 + n * 30) + ', 18%, ' + (17 + n * 5) + '%)';
      g.fillRect(x * TCELL, y * TCELL, TCELL + 1, TCELL + 1);
      const n2 = hash2(x + 5, y + 13);
      if (n2 > 0.74) {
        g.fillStyle = 'rgba(150,200,130,0.09)';
        g.beginPath();
        g.arc(x * TCELL + TCELL * n, y * TCELL + TCELL * n2, TCELL * 0.07, 0, Math.PI * 2);
        g.fill();
      }
    }
  }
  terrainCv = c;
  terrainDirty = false;
}

function render() {
  ctx.save();
  if (S.shake > 0) {
    const m = S.shake * 7;
    ctx.translate(rnd(-m, m), rnd(-m, m));
  }
  ctx.clearRect(0, 0, cw, ch);

  // 背景
  ctx.fillStyle = '#0a0f16';
  ctx.fillRect(0, 0, cw, ch);

  const z = cam.z;
  const left = cam.x - cw / 2 / z, right = cam.x + cw / 2 / z;
  const top = cam.y - ch / 2 / z, bot = cam.y + ch / 2 / z;
  const x0 = clamp(Math.floor(left) - 1, 0, N - 1), x1 = clamp(Math.ceil(right) + 1, 0, N - 1);
  const y0 = clamp(Math.floor(top) - 1, 0, N - 1), y1 = clamp(Math.ceil(bot) + 1, 0, N - 1);

  // 格子
  if (S.mode !== 'hex') {
    if (terrainDirty || !terrainCv) buildTerrain();
    const [tx0, ty0] = w2s(0, 0);
    ctx.drawImage(terrainCv, tx0, ty0, N * cam.z, N * cam.z);
  } else for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = y * N + x;
      const [sx, sy] = w2s(x, y);
      const g = S.grid[i];
      const n = hash2(x, y);

      // 草地：路会盖在上面，转角处露出草地正好形成圆角过渡
      ctx.fillStyle = `hsl(${130 + n * 30}, 18%, ${17 + n * 5}%)`;
      ctx.fillRect(sx, sy, z + 0.6, z + 0.6);
      const n2 = hash2(x + 5, y + 13);
      if (S.q >= 2 && n2 > 0.74) {
        ctx.fillStyle = 'rgba(150,200,130,0.09)';
        ctx.beginPath();
        ctx.arc(sx + z * n, sy + z * n2, z * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  if (S.mode !== 'hex') {
  // 地图外框
  const [ox, oy] = w2s(0, 0);
  ctx.strokeStyle = 'rgba(120,160,210,.22)';
  ctx.lineWidth = 2;
  ctx.strokeRect(ox, oy, N * cam.z, N * cam.z);

  // ── 道路：用带圆角的粗线绘制，转角自然，不再是方块拼接 ──
  const lift = z * BRIDGE_LIFT;

  const _pathCache = render._pc || (render._pc = new Map());
  const toPath = (cells, dy) => {
    if (!cells || !cells.length) return new Path2D();
    // 关键帧：路线首格 + 长度 + 镜头（量化到 0.01）
    const key = cells[0].x + ',' + cells[0].y + ',' + cells.length + ',' + dy +
      '|' + cam.x.toFixed(2) + ',' + cam.y.toFixed(2) + ',' + cam.z.toFixed(2);
    let p2 = _pathCache.get(key);
    if (p2) return p2;
    p2 = new Path2D();
    const q0 = w2s(cells[0].x + 0.5, cells[0].y + 0.5);
    p2.moveTo(q0[0], q0[1] + dy);
    for (let i = 1; i < cells.length; i++) {
      const q = w2s(cells[i].x + 0.5, cells[i].y + 0.5);
      p2.lineTo(q[0], q[1] + dy);
    }
    if (_pathCache.size > 32) _pathCache.clear();
    _pathCache.set(key, p2);
    return p2;
  };

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 地面路（下路 + 主干）
  const groundB = toPath(S.routes[1].slice(0, S.mergeIdx[1]), 0);
  const trunkP = toPath(S.trunk, 0);
  for (const poly of [groundB, trunkP]) {
    ctx.strokeStyle = '#150e07';
    ctx.lineWidth = z * 1.18;
    ctx.stroke(poly);
    ctx.strokeStyle = '#523d27';
    ctx.lineWidth = z;
    ctx.stroke(poly);
    ctx.strokeStyle = '#6a5132';
    ctx.lineWidth = z * 0.5;
    ctx.stroke(poly);
  }

  // ── 高架桥 ──
  const elevCells = S.routes[0].slice(0, S.mergeIdx[0]);
  if (elevCells.length) {
    const deckP = toPath(elevCells, -lift);

    // 投影落在地面上
    ctx.globalAlpha = 0.38;
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = z * 1.02;
    ctx.stroke(toPath(elevCells, lift * 0.55));
    ctx.globalAlpha = 1;

    // 桥墩（带基座）
    for (let i = 1; i < elevCells.length; i += 3) {
      const q = w2s(elevCells[i].x + 0.5, elevCells[i].y + 0.5);
      const top = q[1] - lift + z * 0.26;
      const ph = lift + z * 0.34;
      ctx.fillStyle = '#19110a';
      ctx.fillRect(q[0] - z * 0.13, top, z * 0.26, ph);
      ctx.fillStyle = 'rgba(255,235,195,.14)';
      ctx.fillRect(q[0] - z * 0.13, top, z * 0.08, ph);
      ctx.fillStyle = '#241a11';
      ctx.fillRect(q[0] - z * 0.20, top + ph - z * 0.10, z * 0.40, z * 0.10);
    }

    // 桥面：深色外框 → 护栏边 → 桥面 → 中央高光
    ctx.strokeStyle = '#0f0a05';
    ctx.lineWidth = z * 1.16;
    ctx.stroke(deckP);
    ctx.strokeStyle = '#c9a468';
    ctx.lineWidth = z * 1.00;
    ctx.stroke(deckP);
    ctx.strokeStyle = '#7d5e35';
    ctx.lineWidth = z * 0.78;
    ctx.stroke(deckP);
    ctx.strokeStyle = '#96733f';
    ctx.lineWidth = z * 0.32;
    ctx.stroke(deckP);
  }

  // 行进方向箭头：暖色=上路，冷色=下路
  if (z > 9 && S.routeArrows) {
    for (const ar of S.routeArrows) {
      const [ax, ay0] = w2s(ar.x, ar.y);
      const ay = ay0 - (ar.r === 0 ? lift : 0);
      if (ax < -z || ay < -z || ax > cw + z || ay > ch + z) continue;
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(ar.ang);
      ctx.strokeStyle = ar.r === 0 ? 'rgba(255,214,150,.55)' : 'rgba(150,220,255,.45)';
      ctx.lineWidth = Math.max(1.1, z * 0.07);
      ctx.beginPath();
      ctx.moveTo(-z * 0.13, -z * 0.12);
      ctx.lineTo(z * 0.07, 0);
      ctx.lineTo(-z * 0.13, z * 0.12);
      ctx.stroke();
      ctx.restore();
    }
  }

  } else {
    drawHexField(z);
  }

  // 符文地块
  if (S.boon) {
    for (let i = 0; i < S.boon.length; i++) {
      if (!S.boon[i]) continue;
      const cc = cellCenter(i);
      const q = w2s(cc.x, cc.y);
      if (q[0] < -z || q[1] < -z || q[0] > cw + z || q[1] > ch + z) continue;
      const pu = 0.5 + Math.sin(S.time * 2 + i * 0.7) * 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,214,110,' + (0.30 + pu * 0.35) + ')';
      ctx.lineWidth = Math.max(1, z * 0.05);
      ctx.beginPath(); ctx.arc(q[0], q[1], z * 0.30, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(q[0], q[1], z * 0.15, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,230,150,' + (0.22 + pu * 0.3) + ')';
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a2 = k * Math.PI / 2 + S.time * 0.8;
        const px = q[0] + Math.cos(a2) * z * 0.30;
        const py = q[1] + Math.sin(a2) * z * 0.30;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  // 障碍物
  for (const o of S.obs) {
    if (o.totemRef || o.nestRef || o.kind === 'vine') continue;
    if (o.x + o.size < x0 || o.x > x1 || o.y + o.size < y0 || o.y > y1) continue;
    drawObstacle(o, z);
  }

  // 图腾
  if (S.totems) for (const tm of S.totems) drawTotem(tm, z);

  // 藤蔓：本体贴图 + 用藤蔓图片连接被缠绕的单位
  for (const o of S.obs) {
    if (o.kind !== 'vine' || o.hp <= 0) continue;
    const q = w2s(o.cx, o.cy);
    const zz = cam.z;

    // 被连接的单位（怪物 + 炮塔）
    const links = [];
    if (o.held) for (const en of o.held) if (!en.dead) links.push({ x: en.x, y: en.y, worm: true });
    for (const t of S.towers) {
      if (t.vineT > 0) links.push({ x: t.x + 0.5, y: t.y + 0.5, worm: false });
    }

    // 藤蔓贴图连接
    if (VINE_IMG.complete && VINE_IMG.width) {
      for (const lk of links) {
        const lq = w2s(lk.x, lk.y);
        const dx = lq[0] - q[0], dy = lq[1] - q[1];
        const len = Math.hypot(dx, dy);
        if (len < 2) continue;
        const ang = Math.atan2(dy, dx);
        const thick = zz * (lk.worm ? 0.42 : 0.55);
        const sway = Math.sin(S.time * 2.4 + lk.x * 3) * 0.05;
        ctx.save();
        ctx.translate(q[0], q[1]);
        ctx.rotate(ang + Math.PI / 2 + sway);
        ctx.globalAlpha = 0.92;
        ctx.drawImage(VINE_IMG, -thick / 2, 0, thick, len);
        ctx.restore();
      }
    }

    // 本体
    const bodyR = zz * 1.15;
    // 根部的绿色底座
    ctx.save();
    ctx.fillStyle = 'rgba(77,124,58,.85)';
    ctx.beginPath();
    ctx.ellipse(q[0], q[1] + zz * 0.18, zz * 0.42, zz * 0.20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,110,.55)';
    ctx.lineWidth = Math.max(1, zz * 0.05);
    ctx.stroke();
    ctx.restore();
    if (VINE_IMG.complete && VINE_IMG.width) {
      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.drawImage(VINE_IMG, q[0] - zz * 0.85, q[1] - zz * 1.25, zz * 1.7, zz * 2.5);
      ctx.restore();
    } else {
      ctx.fillStyle = '#4d7c3a';
      ctx.beginPath(); ctx.arc(q[0], q[1], zz * 0.3, 0, Math.PI * 2); ctx.fill();
    }

    // 血条
    const vh = clamp(o.hp / o.maxHp, 0, 1);
    if (vh < 1) {
      const bw = zz * 0.9, bh = Math.max(3, zz * 0.07);
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      ctx.fillRect(q[0] - bw / 2 - 1, q[1] - bodyR - bh - 4, bw + 2, bh + 2);
      ctx.fillStyle = vh > 0.4 ? '#a3e635' : '#ff6b6b';
      ctx.fillRect(q[0] - bw / 2, q[1] - bodyR - bh - 3, bw * vh, bh);
    }
  }

  // 区域（冰墙 / 磁暴云 / 龙卷风）
  if (S.zones) for (const zn of S.zones) drawZone(zn, z);

  // 塔
  for (const t of S.towers) {
    const [sx, sy] = w2s(t.x + 0.5, t.y + 0.5);
    if (t.sealed) ctx.globalAlpha = 0.35;
    drawTower(sx, sy - z * 0.15, z, t, false);
    ctx.globalAlpha = 1;
    if (t.litHoly > 0) {
      const pu = 0.5 + Math.sin(S.time * 5) * 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,225,120,' + (0.45 + pu * 0.45) + ')';
      ctx.lineWidth = Math.max(1.5, z * 0.09);
      ctx.beginPath(); ctx.arc(sx, sy, z * 0.46, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,245,190,' + (0.55 + pu * 0.4) + ')';
      const cy2 = sy - z * 0.62;
      ctx.fillRect(sx - z * 0.035, cy2 - z * 0.13, z * 0.07, z * 0.26);
      ctx.fillRect(sx - z * 0.12, cy2 - z * 0.04, z * 0.24, z * 0.07);
      ctx.restore();
    }
    if (t.litTotem > 0) {
      const pu = 0.5 + Math.sin(S.time * 6) * 0.5;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(192,132,252,' + (0.4 + pu * 0.45) + ')';
      ctx.lineWidth = Math.max(1.5, z * 0.08);
      ctx.beginPath();
      ctx.arc(sx, sy, z * 0.42, -Math.PI / 2 + S.time * 2, -Math.PI / 2 + S.time * 2 + Math.PI * 1.3);
      ctx.stroke();
      ctx.fillStyle = 'rgba(216,180,254,' + (0.6 + pu * 0.4) + ')';
      for (let k = 0; k < 3; k++) {
        const ay = sy - z * 0.30 - ((S.time * 40 + k * 14) % (z * 0.5));
        ctx.beginPath();
        ctx.moveTo(sx - z * 0.06, ay);
        ctx.lineTo(sx + z * 0.06, ay);
        ctx.lineTo(sx, ay - z * 0.08);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    if ((t.hp || 100) < (t.maxHp || 100)) {
      const hr = clamp((t.hp || 0) / (t.maxHp || 100), 0, 1);
      const bw2 = z * 0.8, bh2 = Math.max(3, z * 0.07);
      ctx.fillStyle = 'rgba(0,0,0,.72)';
      ctx.fillRect(sx - bw2 / 2 - 1, sy + z * 0.52, bw2 + 2, bh2 + 2);
      ctx.fillStyle = hr > 0.4 ? '#4ad991' : '#ff6b6b';
      ctx.fillRect(sx - bw2 / 2, sy + z * 0.52 + 1, bw2 * hr, bh2);
    }
    if (t.sealed) {
      ctx.save();
      ctx.translate(sx, sy);
      ctx.fillStyle = '#6b4f2a';
      ctx.beginPath();
      ctx.moveTo(-z * 0.40, z * 0.36);
      ctx.lineTo(-z * 0.32, -z * 0.24);
      ctx.lineTo(z * 0.04, -z * 0.42);
      ctx.lineTo(z * 0.40, -z * 0.14);
      ctx.lineTo(z * 0.34, z * 0.38);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = Math.max(1.5, z * 0.06);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,230,190,.22)';
      ctx.beginPath(); ctx.arc(-z * 0.10, -z * 0.16, z * 0.11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(40,25,10,.7)';
      ctx.lineWidth = Math.max(1, z * 0.035);
      ctx.beginPath();
      ctx.moveTo(-z * 0.20, -z * 0.05); ctx.lineTo(-z * 0.02, z * 0.14);
      ctx.moveTo(z * 0.16, -z * 0.10); ctx.lineTo(z * 0.22, z * 0.12);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 射程提示
  const isSpike = S.build === 'spike';
  const showRange = S.selected || (S.build && !isSpike && hoverCell);
  if (showRange) {
    const t = S.selected;
    if (t) {
      const st = towerStats(t);
