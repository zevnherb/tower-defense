<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>塔防 · Grid Defense 50</title>
<style>
  :root{
    --bg:#0b0f14; --panel:rgba(14,19,26,.94); --line:rgba(255,255,255,.10);
    --ink:#e8eef6; --muted:#7f8da0; --gold:#ffc94a; --accent:#6ea8ff;
    --ok:#4ad991; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
       font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       user-select:none;-webkit-font-smoothing:antialiased}
  canvas{display:block;position:absolute;inset:0;cursor:crosshair}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
       align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:10}
  .stat{display:flex;gap:22px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:9px 18px;backdrop-filter:blur(10px);pointer-events:auto}
  .stat div{text-align:center;min-width:64px}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:.1em}
  .stat .gold b{color:var(--gold)}
  .stat .life b{color:#ff8080}

  .ctrls{display:flex;gap:8px;pointer-events:auto}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);
       border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;
       font-family:inherit;transition:.15s;backdrop-filter:blur(10px);white-space:nowrap}
  .btn:hover{color:var(--ink);border-color:rgba(255,255,255,.28)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:650}

  .palette{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
           display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);
           border-radius:16px;padding:10px;backdrop-filter:blur(12px);z-index:10}
  .tw{width:74px;border-radius:11px;border:1px solid transparent;background:rgba(255,255,255,.03);
      padding:6px 4px 5px;cursor:pointer;transition:.15s;text-align:center;position:relative}
  .tw:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
  .tw.sel{border-color:var(--accent);background:rgba(110,168,255,.16)}
  .tw.poor{opacity:.4}
  .tw canvas{width:40px;height:40px;display:block;margin:0 auto}
  .tw .nm{font-size:11px;color:#c8d4e4;margin-top:2px;white-space:nowrap}
  .tw .pr{font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums}
  .tw .key{position:absolute;top:3px;left:6px;font-size:9px;color:rgba(255,255,255,.3)}

  .panel{position:absolute;right:16px;top:88px;width:240px;background:var(--panel);
         border:1px solid var(--line);border-radius:14px;padding:14px;z-index:10;
         backdrop-filter:blur(12px);display:none}
  .panel.on{display:block}
  .panel h3{margin:0 0 2px;font-size:15px;font-weight:650}
  .panel .lv{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .rows{font-size:12.5px;line-height:1.9;color:#b9c6d8;margin-bottom:12px}
  .rows span{color:var(--ink);font-variant-numeric:tabular-nums}
  .panel .btn{width:100%;margin-top:6px;text-align:center}
  .panel .btn.gold{border-color:rgba(255,201,74,.5);color:var(--gold)}
  .panel .btn.gold:hover{background:rgba(255,201,74,.15)}
  .prio{display:flex;gap:5px;margin-top:8px}
  .prio .btn{flex:1;padding:6px 4px;font-size:11px;margin:0}

  .toast{position:absolute;left:50%;top:76px;transform:translateX(-50%) translateY(-12px);
         background:rgba(20,26,36,.96);border:1px solid var(--line);border-radius:10px;
         padding:9px 18px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .items{position:absolute;left:16px;bottom:96px;display:flex;gap:7px;flex-wrap:wrap;
         max-width:320px;z-index:10}
  .item{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:12px;
        background:var(--panel);border:1px solid var(--line);cursor:pointer;
        font-family:inherit;color:#c8d4e4;font-size:14.5px;transition:.15s;
        backdrop-filter:blur(10px)}
  .item:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}
  .item.on{border-color:var(--accent);background:rgba(110,168,255,.2)}
  .item i{font-style:normal;font-size:19px;line-height:1}
  .item b{color:#7f8da0;font-weight:600;font-size:11.5px}

  .log{position:absolute;left:16px;bottom:150px;width:292px;max-height:44vh;
       display:flex;flex-direction:column;gap:4px;z-index:9;pointer-events:none;overflow:hidden}
  .logrow{font-size:11.5px;line-height:1.45;padding:5px 9px;border-radius:7px;
          background:rgba(13,18,25,.86);border-left:2px solid #3b4557;color:#b9c6d8;
          animation:logIn .18s ease-out;backdrop-filter:blur(6px)}
  @keyframes logIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .logrow:nth-child(n+4){opacity:.78}
  .logrow:nth-child(n+6){opacity:.55}
  .logrow:nth-child(n+8){opacity:.34}
  .logrow.kill{border-left-color:#4ad991;color:#a8e6c0}
  .logrow.build{border-left-color:#ffc94a;color:#f0d79a}
  .logrow.boss{border-left-color:#ff5a5a;color:#ffb0b0}
  .logrow.event{border-left-color:#c084fc;color:#dcb8ff}
  .logrow.item{border-left-color:#5ad1ff;color:#b3ecff}
  .logrow.leak{border-left-color:#ff6b3d;color:#ffb59a}
  .logrow.info{border-left-color:#6ea8ff;color:#b8cdf0}

  .over{position:absolute;inset:0;background:rgba(6,9,13,.9);display:none;
        align-items:center;justify-content:center;z-index:30;backdrop-filter:blur(6px)}
  .over.on{display:flex}
  .card{text-align:center;background:linear-gradient(180deg,#151c26,#0d1219);
        border:1px solid var(--line);border-radius:18px;padding:34px 44px;
        box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .card h2{margin:0 0 8px;font-size:26px}
  .card p{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.8}
  .card .btn{padding:12px 28px;font-size:14px}
  .hint{position:absolute;left:18px;bottom:18px;font-size:11.5px;color:rgba(180,195,215,.45);
        line-height:1.7;z-index:9;pointer-events:none}

  .palette { max-width: 95vw; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
  .palette::-webkit-scrollbar { height: 5px; }
  .palette::-webkit-scrollbar-thumb { background: rgba(120,150,190,.4); border-radius: 3px; }
  .tw { min-width: 60px; width: 60px; padding: 5px 3px 4px; }
  .tw canvas { width: 52px; height: 68px; }
  .tw .nm { display: block; font-size: 10px; line-height: 1.2; white-space: nowrap;
            max-width: 58px; overflow: hidden; text-overflow: ellipsis;
            text-align: center; color: #dbe6f5; margin-top: 1px; }
  .tw .pr { display: block; font-size: 9.5px; line-height: 1.2; }
  .btn.all {
    background: linear-gradient(135deg, #ff7a3d, #ff3d7a);
    color: #fff; border: none; font-weight: 800; letter-spacing: .5px;
    box-shadow: 0 0 18px rgba(255,90,110,.55);
    animation: allpulse 1.8s ease-in-out infinite;
  }
  @keyframes allpulse {
    0%, 100% { box-shadow: 0 0 10px rgba(255,90,110,.45); }
    50%      { box-shadow: 0 0 26px rgba(255,120,140,.9); }
  }
  .btn.all:active { transform: scale(.96); }
  .btn.danger {
    background: rgba(255,70,70,.22) !important;
    border-color: rgba(255,90,90,.75) !important;
    color: #ffb0b0 !important;
  }

  /* 建造图例移到右侧竖排 */
  .palette {
    left: auto; right: 14px; bottom: auto; top: 50%;
    transform: translateY(-50%);
    flex-wrap: wrap; width: 340px; max-height: 80vh;
    overflow-y: auto; overflow-x: hidden;
    gap: 8px; padding: 10px; justify-content: flex-start;
    cursor: move;
  }
  .palette::-webkit-scrollbar { width: 5px; height: 5px; }
  .palette::-webkit-scrollbar-thumb { background: rgba(120,150,190,.4); border-radius: 3px; }
  .tw { box-sizing: border-box; width: 100px; min-width: 100px; flex: 0 0 100px;
        height: 96px; align-self: flex-start; padding: 4px 3px 4px; cursor: pointer; overflow: visible; }
  .tw canvas { width: 82px; height: 82px; }
  /* 塔详情面板挪到左侧，避免与图例重叠 */
  #panel { right: auto; left: 16px; }
  #bestiary { left: 300px; right: auto; }

  /* 全屏公告 */
  .announce {
    position: absolute; left: 50%; top: 26%;
    transform: translate(-50%, -50%) scale(.7);
    font-size: 46px; font-weight: 900; letter-spacing: 3px;
    text-shadow: 0 0 24px currentColor, 0 4px 18px rgba(0,0,0,.9);
    opacity: 0; pointer-events: none; z-index: 60; white-space: nowrap;
  }
  .announce.on { animation: annIn 1.9s cubic-bezier(.2,1.2,.3,1) forwards; }
  @keyframes annIn {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
    12%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
    24%  { transform: translate(-50%,-50%) scale(1); }
    72%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-70%) scale(1.05); }
  }

  /* 右下角署名 */
  #basePanel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 320px; padding: 14px 16px; border-radius: 14px;
    background: rgba(14, 19, 26, .97);
    border: 1px solid rgba(110, 168, 255, .35);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .65);
    display: none; z-index: 90;
    font-family: inherit; color: #dbe6f5;
  }
  #basePanel.on { display: block; }
  #basePanel h3 { margin: 0 0 8px; font-size: 16px; color: #ffd76a; }
  #basePanel p { margin: 6px 0 10px; font-size: 13px; color: #9aa7b8; }
  #basePanel .btn { display: block; width: 100%; margin-bottom: 6px; }

  #credit {
    position: fixed;
    right: 16px;
    bottom: 12px;
    z-index: 60;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    color: rgba(150, 170, 195, .55);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    pointer-events: none;
    user-select: none;
  }
  #credit b { color: rgba(110, 168, 255, .8); font-weight: 700; }

  /* ── 手机：基地面板改成满宽，避免居中偏移 ── */
  @media (max-width: 760px) {
    #basePanel {
      left: 8px;
      right: 8px;
      width: auto;
      max-width: none;
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 14px;
      box-sizing: border-box;
    }
    #basePanel h3 { font-size: 15px; }
    #basePanel p { font-size: 12px; }
    #basePanel .btn { padding: 9px 10px; font-size: 13px; }
  }

  /* ── 手机：事件栏缩小，别挡地图 ── */
  @media (max-width: 760px) {
    .log {
      left: 6px;
      bottom: auto;
      top: 104px;
      width: 148px;
      max-height: 96px;
      gap: 2px;
      opacity: .82;
      -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
    }
    .logrow {
      font-size: 9.5px;
      line-height: 1.3;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(13,18,25,.62);
      backdrop-filter: none;
    }
  }

  /* ── 手机横屏：超级紧凑布局 ── */
  @media (orientation: landscape) and (max-height: 560px) {
    .hud {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 8px;
      font-size: 11px;
    }
    .hud .stat { gap: 8px; }
    .hud .stat b { font-size: 13px; }
    .hud .stat span { font-size: 9px; }
    .hud .ctrls { gap: 4px; flex-wrap: nowrap; }
    .hud .ctrls .btn {
      flex: 0 0 auto;
      padding: 4px 7px;
      font-size: 11px;
      border-radius: 7px;
    }
    .palette {
      left: 4px;
      right: 4px;
      top: auto;
      bottom: 4px;
      transform: none;
      width: auto;
      max-height: none;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px;
      gap: 4px;
      justify-content: flex-start;
    }
    .tw {
      flex: 0 0 56px;
      width: 56px;
      min-width: 56px;
      height: 60px;
      padding: 2px 1px;
    }
    .tw canvas { width: 42px; height: 42px; }
    .tw .nm { font-size: 8px; }
    .log {
      top: 48px;
      left: 4px;
      width: 116px;
      max-height: 60px;
      opacity: .66;
    }
    .logrow { font-size: 8.5px; padding: 2px 4px; }
    #credit { display: none; }
    .hint, #hint { font-size: 9px; bottom: 2px; }
  }

  /* ── 竖屏：地图上部 60%，建造面板下部 40% ── */
  @media (max-width: 760px) and (orientation: portrait) {
    .palette {
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      height: 40vh;
      max-height: 40vh;
      transform: none;
      width: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 82px;
      gap: 6px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      border-radius: 14px 14px 0 0;
      background: rgba(10, 14, 20, .96);
      border-top: 1px solid rgba(255, 255, 255, .10);
      overflow-y: auto;
      overflow-x: hidden;
      align-content: start;
    }
    .palette .tw {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      justify-self: stretch;
      flex: none;
      height: 82px;
      overflow: hidden;
    }
    .palette .tw canvas { width: 40px; height: 40px; }
    .palette .tw .nm { font-size: 11px; }
    .palette .tw .pr { font-size: 10px; }
    .palette .tw .key { font-size: 9px; }
    .hint, #hint { display: none; }
    .items {
      bottom: 192px !important;
      left: 8px;
      right: 8px;
    }
  }

  /* ── 手机 / 平板适配 ── */
  @media (max-width: 760px) {
    .hud {
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
      padding: 6px 8px;
      max-width: 100vw;
      overflow: hidden;
    }
    .hud .ctrls {
      display: flex;
      flex-wrap: nowrap;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      width: 100%;
      box-sizing: border-box;
    }
    .hud .ctrls::-webkit-scrollbar { height: 0; display: none; }
    .hud .ctrls .btn {
      flex: 0 0 auto;
      min-width: 0;
      padding: 7px 10px;
      font-size: 11.5px;
      white-space: nowrap;
    }
    .items {
      left: 6px;
      right: 6px;
      top: auto;
      bottom: 96px;
      max-width: none;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .items::-webkit-scrollbar { height: 0; display: none; }
    .item {
      flex: 0 0 auto;
      padding: 7px 11px;
      font-size: 12.5px;
      gap: 6px;
    }
    .item i { font-size: 15px; }
    .item b { font-size: 10.5px; }
    .palette {
      left: 6px;
      right: 6px;
      top: auto;
      bottom: 6px;
      transform: none;
      width: auto;
      max-height: none;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px;
      gap: 6px;
      justify-content: flex-start;
    }
    .tw {
      flex: 0 0 66px;
      width: 66px;
      min-width: 66px;
      height: 72px;
      padding: 3px 2px;
    }
    .tw canvas { width: 50px; height: 50px; }
    #credit { font-size: 11px; right: 10px; bottom: 86px; }
  }

  /* ── iOS / 移动端通用修正 ── */
  html, body {
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    height: 100%;
  }
  body {
    height: 100vh;
    height: 100dvh;              /* 支持 iOS 动态视口 */
    overflow: hidden;
    position: fixed;
    inset: 0;
  }
  #cv, canvas {
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .hud, #basePanel, .palette {
    -webkit-backdrop-filter: blur(6px);
  }
  /* 刘海屏安全区 */
  .hud { padding-top: max(10px, env(safe-area-inset-top)); }
  .palette { padding-bottom: max(4px, env(safe-area-inset-bottom)); }
  /* ── 竖屏修正：建造面板卡片等分列宽，避免右侧裁切 ── */
  @media (max-width: 760px) and (orientation: portrait) {
    .palette {
      overflow-x: hidden !important;
      padding-right: 6px !important;
      padding-left: 6px !important;
    }
    .palette .tw {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      flex: none !important;
      height: 100% !important;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .palette .tw canvas {
      width: 38px !important;
      height: 38px !important;
      flex: none;
    }
    .palette .tw .nm { font-size: 11px; line-height: 1.1; }
    .palette .tw .pr { font-size: 10px; }
  }

  @media (max-width: 760px) {
    .palette {
      position: fixed !important;
      left: 0 !important;
      right: 0 !important;
      width: 100vw !important;
      max-width: 100vw !important;
      min-width: 0 !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      transform: none !important;
    }
  }
  @media (max-width: 760px) and (orientation: portrait) {
    .palette {
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      grid-auto-rows: 84px !important;
      gap: 5px !important;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom)) !important;
      overflow-x: hidden !important;
    }
    .palette .tw {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      height: 84px !important;
      box-sizing: border-box !important;
    }
  }

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="stat">
    <div class="gold"><b id="uiGold">0</b><span>金币</span></div>
    <div class="life"><b id="uiLife">25</b><span>基地血量</span></div>
    <div><b id="uiWave">0/30</b><span>波次</span></div>
    <div><b id="uiEnemy">0</b><span>场上怪物</span></div>
    <div><b id="uiFps">60</b><span>FPS</span></div>
  </div>
  <div class="ctrls">
    <button class="btn" id="btnWave">开始第 1 波</button>
    <button class="btn" id="btnSpeed">1×</button>
    <button class="btn" id="btnPause">暂停</button>
    <button class="btn" id="btnAutoBuild">自动建造</button>
    <button class="btn on" id="btnAutoSkill">自动技能</button>
    <button class="btn" id="btnEndless">无尽</button>
    <button class="btn" id="btnBase">基地强化</button>
    <button class="btn" id="btnBgm">音乐</button>
    <button class="btn" id="btnLevel">第 1 关</button>
    <button class="btn" id="btnRestart">重开</button>
  </div>
</div>

<div class="palette" id="palette"></div>

<div class="items" id="items"></div>

<div class="log" id="log"></div>

<div class="panel" id="panel">
  <h3 id="pName"></h3>
  <div class="lv" id="pLv"></div>
  <div class="rows" id="pRows"></div>
  <div class="prio" id="pPrio"></div>
  <div id="pActions"></div>
</div>

<div class="panel" id="bestiary" style="left:16px;right:auto;width:300px;top:88px">
  <h3>怪物图鉴</h3>
  <div class="lv" style="margin-bottom:12px">每种怪一个技能</div>
  <div id="bestiaryList"></div>
</div>

<div class="toast" id="toast"></div>
<div class="announce" id="announce"></div>

/* ══════════════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════════════ */
let S = null;                 // 游戏状态
const cam = { x: 25, y: 25, z: 26 };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let cw = 0, ch = 0, DPR = 1;

/* ══════════════════════════════════════════════════════════════
   工具
   ══════════════════════════════════════════════════════════════ */
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);

function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}

/* ══════════════════════════════════════════════════════════════
   地图生成
   ══════════════════════════════════════════════════════════════ */
function segH(arr, xa, xb, y) {
  const d = xa <= xb ? 1 : -1;
  for (let x = xa; x !== xb + d; x += d) arr.push({ x, y });
}
function segV(arr, ya, yb, x) {
  const d = ya <= yb ? 1 : -1;
  for (let y = ya; y !== yb + d; y += d) arr.push({ x, y });
}

/**
 * 上下两条支路从不同入口出发，在中点汇合成主干通向基地。
 * 返回两条完整路线（每条 = 支路 + 主干）。
 */
/**
 * 上半区 / 下半区各自蛇形来回横穿，走到中途汇合，再一条主干通向基地。
 * 这样两条路会把整张图铺满，而不是只在中间绕两下。
 */
/**
 * 蛇形支路：在给定行带上来回横穿。
 * 行与行之间至少空 1 格，绝不贴在一起；竖向连接只走两端，不会穿过横向路段。
 */
function segVSkip(arr, ya, yb, x) {
  const d = yb > ya ? 1 : -1;
  for (let y = ya + d; y !== yb + d; y += d) arr.push({ x: x, y: y });
}

/**
 * 上路（A）：架空的高架，横穿整幅地图，用内部竖井上下折返。
 * 下路（B）：地面路线，走地图左右两端折返。
 * 两路会交错多次 —— A 在 B 上方跨过，视觉上有明确层级。
 */
function generateRoutes3() {
  const rowA = [1, 4], rowB = [7, 10], rowC = [13, 16];
  const mergeRow = 18;
  const cxA = irnd(15, 17), cxB = irnd(14, 16), cxC = irnd(6, 9);

  const A = [];
  segH(A, 0, cxA, rowA[0]);
  segVSkip(A, rowA[0], rowA[1], cxA);
  segH(A, cxA, 12, rowA[1]);
  segVSkip(A, rowA[1], mergeRow, 12);

  const B = [];
  segH(B, 0, N - 1, rowB[0]);
  segVSkip(B, rowB[0], rowB[1], N - 1);
  segH(B, N - 1, cxB, rowB[1]);
  segVSkip(B, rowB[1], mergeRow, cxB);

  const C = [];
  segH(C, 0, cxC, rowC[0]);
  segVSkip(C, rowC[0], rowC[1], cxC);
  segH(C, cxC, 3, rowC[1]);
  segVSkip(C, rowC[1], mergeRow, 3);

  const T = [];
  segH(T, 3, N - 1, mergeRow);

  const iA = T.findIndex(c => c.x === 12 && c.y === mergeRow);
  const iB = T.findIndex(c => c.x === cxB && c.y === mergeRow);
  const iC = T.findIndex(c => c.x === 3 && c.y === mergeRow);

  const routeA = A.concat(T.slice(iA + 1));
  const routeB = B.concat(T.slice(iB + 1));
  const routeC = C.concat(T.slice(iC + 1));

  return {
    routes: [routeA, routeB, routeC],
    trunk: T,
    mergeIdx: [A.length, B.length, C.length],
    mx: 3, my: mergeRow,
  };
}

function generateRoutes() {
  // 随机化：行距、连接列、汇合点 —— 每次重开都是新地图
  const top = irnd(1, 3);
  const g1 = irnd(2, 3), g2 = irnd(2, 3), g3 = irnd(2, 3), g4 = irnd(2, 3);
  const rowA = [top, top + g1, top + g1 + g2];
  const rowB = [rowA[2] + g3, rowA[2] + g3 + g4, Math.min(N - 4, rowA[2] + g3 + g4 + 2)];
  const mergeRow = Math.min(N - 2, rowB[2] + 2);

  const cx1 = irnd(13, N - 4);        // A 第一根竖井
  const cx2 = irnd(2, 5);             // A 第二根竖井
  const mxA = irnd(10, N - 7);        // A 落地列
  const mxB = clamp(mxA + irnd(2, 3), mxA + 2, N - 2);   // B 落地列

  const A = [];
  segH(A, 0, cx1, rowA[0]);
  segVSkip(A, rowA[0], rowA[1], cx1);
  segH(A, cx1, cx2, rowA[1]);
  segVSkip(A, rowA[1], rowA[2], cx2);
  segH(A, cx2, mxA, rowA[2]);
  segVSkip(A, rowA[2], mergeRow, mxA);

  const B = [];
  segH(B, 0, N - 1, rowB[0]);
  segVSkip(B, rowB[0], rowB[1], N - 1);
  segH(B, N - 1, 0, rowB[1]);
  segVSkip(B, rowB[1], rowB[2], 0);
  segH(B, 0, mxB, rowB[2]);
  segVSkip(B, rowB[2], mergeRow, mxB);

  const T = [];
  segH(T, mxA, N - 1, mergeRow);

  const bIdx = T.findIndex(c => c.x === mxB && c.y === mergeRow);
  let routeA = A.concat(T.slice(1));
  let routeB = B.concat(T.slice(bIdx + 1));

  // 随机整体水平镜像：出生点与基地左右互换
  if (Math.random() < 0.5) {
    const seen = new Set();
    for (const arr of [routeA, routeB, T]) {
      for (const c of arr) {
        if (seen.has(c)) continue;   // 同一格被多条路线共享，只能镜像一次
        seen.add(c);
        c.x = N - 1 - c.x;
      }
    }
  }

  return {
    routes: [routeA, routeB],
    trunk: T,
    mergeIdx: [A.length, B.length],
    mx: mxA, my: mergeRow,
  };
}

/* ══════════════════════════════════════════════════════════════
   六边形网格（第二关）
   ══════════════════════════════════════════════════════════════ */
const HEX_R = 11;              // 边长 12 → 半径 11（397 格）
const HEX_S = 0.5;             // 外接圆半径（世界单位）

function hexAxial(q, r) {
  return { x: Math.sqrt(3) * HEX_S * (q + r / 2), y: 1.5 * HEX_S * r };
}

/** 点顶六边形，axial 坐标，半径 R 的完整网格 */
function buildHexGrid(R) {
  const W = 2 * R + 1;
  const cells = [];
  const idx = new Int16Array(W * W).fill(-1);
  for (let r = -R; r <= R; r++) {
    const lo = Math.max(-R, -R - r), hi = Math.min(R, R - r);
    for (let q = lo; q <= hi; q++) {
      const p = hexAxial(q, r);
      idx[(r + R) * W + (q + R)] = cells.length;
      cells.push({ id: cells.length, q: q, r: r, x: p.x, y: p.y });
    }
  }
  return { R: R, W: W, cells: cells, idx: idx };
}

function hexIdAt(g, q, r) {
  if (q < -g.R || q > g.R || r < -g.R || r > g.R) return -1;
  if (Math.abs(q + r) > g.R) return -1;
  return g.idx[(r + g.R) * g.W + (q + g.R)];
}

const HEX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];

function hexNeighbors(g, id) {
  const c = g.cells[id], out = [];
  for (let i = 0; i < 6; i++) {
    const n = hexIdAt(g, c.q + HEX_DIRS[i][0], c.r + HEX_DIRS[i][1]);
    if (n >= 0) out.push(n);
  }
  return out;
}

function hexDist(a, b) {
  return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2;
}

/** 世界坐标 → 六边形 id */
function hexAt(g, wx, wy) {
  const fq = (Math.sqrt(3) / 3 * wx - wy / 3) / HEX_S;
  const fr = (2 / 3 * wy) / HEX_S;
  const fx = fq, fz = fr, fy = -fx - fz;
  let rx = Math.round(fx), ry = Math.round(fy), rz = Math.round(fz);
  const dx = Math.abs(rx - fx), dy = Math.abs(ry - fy), dz = Math.abs(rz - fz);
  if (dx > dy && dx > dz) rx = -ry - rz;
  else if (dy > dz) ry = -rx - rz;
  else rz = -rx - ry;
  return hexIdAt(g, rx, rz);
}

/** 蛇形穿越大半个六边形 */
function buildHexPath(g) {
  const rows = [];
  for (let r = -g.R; r <= g.R; r += 7) rows.push(r);
  if (rows[rows.length - 1] !== g.R) rows.push(g.R);

  const path = [];
  const used = new Set();
  const push = id => {
    if (id >= 0 && !used.has(id)) { used.add(id); path.push(id); }
  };

  let prevEnd = -1;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const lo = Math.max(-g.R, -g.R - r), hi = Math.min(g.R, g.R - r);
    const seq = [];
    for (let q = lo; q <= hi; q++) seq.push(hexIdAt(g, q, r));
    if (i % 2 === 1) seq.reverse();

    if (prevEnd >= 0 && seq.length) {
      const target = g.cells[seq[0]];
      let cur = prevEnd, guard = 0;
      while (cur !== seq[0] && guard++ < 80) {
        const cn = g.cells[cur];
        let best = -1, bd = hexDist(cn, target);
        for (const nid of hexNeighbors(g, cur)) {
          if (used.has(nid)) continue;
          const d = hexDist(g.cells[nid], target);
          if (d < bd) { bd = d; best = nid; }
        }
        if (best < 0) break;
        push(best);
        cur = best;
      }
    }
    for (const id of seq) push(id);
    if (seq.length) prevEnd = seq[seq.length - 1];
  }
  return path;
}

/** 画一个六边形 */
function buildHexPathB(g, mainIds) {
  const rows = [];
  for (let r = -g.R + 3; r <= g.R - 3; r += 7) rows.push(r);

  const path = [];
  const used = new Set();
  const push = id => { if (id >= 0 && !used.has(id)) { used.add(id); path.push(id); } };

  let prev = -1;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const lo = Math.max(-g.R, -g.R - r), hi = Math.min(g.R, g.R - r);
    const seq = [];
    for (let q = lo; q <= hi; q++) seq.push(hexIdAt(g, q, r));
    if (i % 2 === 1) seq.reverse();

    if (prev >= 0 && seq.length) {
      const tgt0 = g.cells[seq[0]];
      let cur = prev, guard = 0;
      while (cur !== seq[0] && guard++ < 90) {
        let best = -1, bd = hexDist(g.cells[cur], tgt0);
        for (const nid of hexNeighbors(g, cur)) {
          const d = hexDist(g.cells[nid], tgt0);
          if (d < bd) { bd = d; best = nid; }
        }
        if (best < 0) break;
        push(best);
        cur = best;
      }
    }
    for (const id of seq) push(id);
    if (seq.length) prev = seq[seq.length - 1];
  }

  // 并入主线中段
  const joinIdx = Math.floor(mainIds.length * 0.55);
  const joinId = mainIds[joinIdx];
  const jt = g.cells[joinId];
  let cur = path.length ? path[path.length - 1] : -1, guard = 0;
  while (cur >= 0 && cur !== joinId && guard++ < 140) {
    let best = -1, bd = hexDist(g.cells[cur], jt);
    for (const nid of hexNeighbors(g, cur)) {
      const d = hexDist(g.cells[nid], jt);
      if (d < bd) { bd = d; best = nid; }
    }
    if (best < 0) break;
    push(best);
    cur = best;
  }
  for (let k = joinIdx + 1; k < mainIds.length; k++) push(mainIds[k]);
  return path;
}

function hexPath2D(sx, sy, rad) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (60 * i + 30) * Math.PI / 180;
    const px = sx + rad * Math.cos(a), py = sy + rad * Math.sin(a);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function newState(keepSeed, level) {
  const lv = level || 1;
  const st = {
    level: lv,
    mode: lv === 2 ? 'hex' : 'square',
    routeCount: lv === 1 ? 2 : 1,
    grid: new Uint8Array(N * N),
    obs: [],
    obsAt: new Int32Array(N * N).fill(-1),
    towers: [],
    soldiers: [],
    totems: [],
    spikes: [],
    boxSel: null,
    zones: [],
    enemies: [],
    shots: [],
    fx: [],
    drops: [],
    shake: 0,
    flashA: 0,
    flashC: '#fff',
    killBuf: { n: 0, gold: 0 },
    killBufT: 0,
    leakBuf: { n: 0, hp: 0 },
    leakBufT: 0,
    event: null,
    items: {},
    rageT: 0,
    targeting: null,
    baseTier: 0, baseBranch: 0, baseCd: 0, regenT: 8,
    focus: null,
    gold: 2500,
    lives: 25,
    wave: 0,
    waveActive: false,
    spawnQueue: [],
    spawnTimer: 0,
    nextT: 8,
    speed: 1,
    fast10Left: 60,   // 10 倍速剩余可用秒数
    paused: false,
    over: false,
    won: false,
    path: [],
    pathLen: 0,
    selected: null,
    build: null,
    time: 0,
    kills: 0,
    leaked: 0,
  };

  if (lv === 2) return initHexState(st);

  st.bounds = { minX: 0, maxX: N, minY: 0, maxY: N };
  const makeGen = () => (lv === 3 ? generateRoutes3() : generateRoutes());
  let gen = makeGen();
  for (let attempt = 0; attempt < 12; attempt++) {
    const b0 = gen.trunk[gen.trunk.length - 1];
    const okFar = gen.routes.every(r => {
      const sp = r[0];
      return Math.abs(sp.x - b0.x) + Math.abs(sp.y - b0.y) >= 10;
    });
    if (okFar) break;
    gen = makeGen();
  }
  // 丢弃没有接入主干的断头支路（避免怪走到断点）
  {
    const trunk = gen.routes[0] || [];
    st.routes = gen.routes.filter((r, ri) => {
      if (ri === 0 || !r || !r.length) return true;
      const last = r[r.length - 1];
      return trunk.some(c => Math.abs(c.x - last.x) + Math.abs(c.y - last.y) <= 1);
    });
    if (!st.routes.length) st.routes = gen.routes;
  }
  st.trunk = gen.trunk;
  st.mergeIdx = gen.mergeIdx;

  // 所有路面格子（用于绘制/取景）
  const road = [], seen = new Set();
  for (const r of st.routes) {
    for (const c of r) {
      const k = c.x + ',' + c.y;
      if (!seen.has(k)) { seen.add(k); road.push(c); }
    }
  }
  st.path = road;
  st.pathLen = road.length;
  for (const c of road) st.grid[c.y * N + c.x] = ROAD;

  // 高架路段：上路在汇合之前的整段都架空
  st.elev = new Int8Array(N * N);
  for (let i = 0; i < st.mergeIdx[0]; i++) {
    const c = st.routes[0][i];
    st.elev[c.y * N + c.x] = 1;
  }

  // 每格归属：1=上路 2=下路 3=汇合后共用
  st.roadTint = new Int8Array(N * N);
  for (let r = 0; r < st.routes.length; r++) {
    for (const c of st.routes[r]) st.roadTint[c.y * N + c.x] |= (1 << r);
  }

  // 行进方向箭头（只在专属路段画，避免汇合后重叠）
  st.routeArrows = [];
  for (let r = 0; r < 2; r++) {
    const route = st.routes[r];
    for (let i = 0; i < route.length - 1; i += 2) {
      const a = route[i], b = route[i + 1];
      if (st.roadTint[a.y * N + a.x] === 3) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (!dx && !dy) continue;
      st.routeArrows.push({ x: a.x + 0.5, y: a.y + 0.5, ang: Math.atan2(dy, dx), r: r });
    }
  }

  placeObstacles(st);

  // 特殊地块：符文 / 金矿 / 高地
  st.boon = new Uint8Array(N * N);
  st.goldT = new Uint8Array(N * N);
  st.highT = new Uint8Array(N * N);
  const scatter = (arr, count) => {
    for (let k = 0, tries = 0; k < count && tries < 5000; tries++) {
      const i = (Math.random() * arr.length) | 0;
      if (st.grid[i] !== GRASS || st.boon[i] || st.goldT[i] || st.highT[i]) continue;
      arr[i] = 1;
      k++;
    }
  };
  scatter(st.boon, 12);
  scatter(st.goldT, 5);
  scatter(st.highT, 6);
  st.nests = [];
  st.nestT = 0;

  // 两个入口 + 一个基地
  st.spawns = [st.routes[0][0], (st.routes[1] || st.routes[0])[0]];
  st.spawn = st.spawns[0];
  st.base = st.trunk[st.trunk.length - 1];

  cam.x = N / 2;
  cam.y = N / 2;
  cam.z = 26;
  return st;
}

/** 沿路密集堆放障碍物，空地再稀疏散一些 */

/* ══════════════════════════════════════════════════════════════
   第二关：六边形地图
   ══════════════════════════════════════════════════════════════ */
function nearestPathT(st, x, y) {
  let bi = 0, bd = 1e9;
  for (let i = 0; i < st.path.length; i++) {
    const d = dist(x, y, st.path[i].x + 0.5, st.path[i].y + 0.5);
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}

function initNests(st) {
  for (let k = 0; k < 1; k++) {
    for (let tries = 0; tries < 400; tries++) {
      const i = (Math.random() * st.grid.length) | 0;
      if (st.grid[i] !== GRASS) continue;
      if (st.boon[i] || st.goldT[i] || st.highT[i]) continue;
      const cw = st.mode === 'hex' ? st.hex.cells[i] : { x: (i % N) + 0.5, y: Math.floor(i / N) + 0.5 };
      const hp = 520 + st.wave * 40;
      const o = {
        id: st.obs.length, kind: 'nest', size: 1,
        hp: hp, maxHp: hp,
        x: cw.x - 0.5, y: cw.y - 0.5, cx: cw.x, cy: cw.y,
        cells: [{ id: i, x: cw.x - 0.5, y: cw.y - 0.5 }],
        nestRef: true,
        cool: 6 + Math.random() * 4,
        pathT: nearestPathT(st, cw.x, cw.y),
      };
      st.obs.push(o);
      st.nests.push(o);
      st.grid[i] = ROCK;
      st.obsAt[i] = o.id;
      break;
    }
  }
}

function placeHexObstacles(st) {
  const g = st.hex;
  const near = new Set();
  for (const id of st.pathIds) {
    for (const a of hexNeighbors(g, id)) {
      near.add(a);
      for (const b of hexNeighbors(g, a)) near.add(b);
    }
  }
  const kinds = ['rock', 'rock', 'tree', 'tree', 'crate', 'crystal', 'boulder', 'ruin'];

  const addObs = id => {
    if (st.grid[id] !== GRASS || st.obsAt[id] >= 0) return;
    const kind = kinds[(Math.random() * kinds.length) | 0];
    const def = OBSTACLE_DEF[kind];
    if (!def || def.size > 1) return;
    const c = g.cells[id];
    const hp = def.hp * rnd(0.85, 1.2) * 3;
    const o = {
      id: st.obs.length, kind: kind, size: 1, hp: hp, maxHp: hp,
      x: c.x - 0.5, y: c.y - 0.5, cx: c.x, cy: c.y,
      cells: [{ id: id, x: c.x - 0.5, y: c.y - 0.5 }],
    };
    st.grid[id] = ROCK;
    st.obsAt[id] = o.id;
    st.obs.push(o);
  };

  for (const id of near) if (Math.random() < 0.46) addObs(id);
  for (let i = 0; i < g.cells.length; i++) if (Math.random() < 0.085) addObs(i);
}

function initHexState(st) {
  const g = buildHexGrid(HEX_R);
  st.hex = g;
  st.grid = new Uint8Array(g.cells.length);
  st.obsAt = new Int32Array(g.cells.length).fill(-1);

  const ids = buildHexPath(g);
  const idsB = buildHexPathB(g, ids);
  st.pathIds = ids;
  st.path = ids.map(id => ({ x: g.cells[id].x - 0.5, y: g.cells[id].y - 0.5 }));
  st.pathLen = st.path.length;
  for (const id of ids) st.grid[id] = ROAD;
  for (const id of idsB) if (st.grid[id] !== ROAD) st.grid[id] = ROAD;
  st.obsAt = st.obsAt || new Int32Array(g.cells.length).fill(-1);
  for (const id of idsB) st.obsAt[id] = -1;

  const pathB = idsB.map(id => ({ x: g.cells[id].x - 0.5, y: g.cells[id].y - 0.5 }));
  // 清掉压在路上的障碍
  st.obs = st.obs.filter(o => {
    if (o.cells.some(c => st.grid[c.id] === ROAD)) {
      for (const c of o.cells) { st.grid[c.id] = ROAD; st.obsAt[c.id] = -1; }
      return false;
    }
    return true;
  });

  st.routes = [st.path, pathB];
  st.routeCount = 2;
  st.trunk = [];
  st.mergeIdx = [st.path.length, pathB.length];
  st.elev = new Uint8Array(g.cells.length);
  st.roadTint = new Uint8Array(g.cells.length);
  for (const id of ids) st.roadTint[id] = 3;

  st.routeArrows = [];
  for (let i = 0; i < st.path.length - 1; i += 2) {
    const a = st.path[i], b = st.path[i + 1];
    st.routeArrows.push({
      x: a.x + 0.5, y: a.y + 0.5,
      ang: Math.atan2(b.y - a.y, b.x - a.x),
      r: 0,
    });
  }

  st.spawns = [st.path[0]];
  st.spawn = st.spawns[0];
  st.base = st.path[st.path.length - 1];

  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const c of g.cells) {
    if (c.x < minX) minX = c.x;
    if (c.x > maxX) maxX = c.x;
    if (c.y < minY) minY = c.y;
    if (c.y > maxY) maxY = c.y;
  }
  st.bounds = { minX: minX, maxX: maxX, minY: minY, maxY: maxY };

  placeHexObstacles(st);

  st.boon = new Uint8Array(g.cells.length);
  st.goldT = new Uint8Array(g.cells.length);
  st.highT = new Uint8Array(g.cells.length);
  const scatter2 = (arr, count) => {
    for (let k = 0, tries = 0; k < count && tries < 6000; tries++) {
      const i = (Math.random() * arr.length) | 0;
      if (st.grid[i] !== GRASS || st.boon[i] || st.goldT[i] || st.highT[i]) continue;
      arr[i] = 1;
      k++;
    }
  };
  scatter2(st.boon, 12);
  scatter2(st.goldT, 5);
  scatter2(st.highT, 6);
  st.nests = [];
  st.nestT = 0;

  cam.x = 0;
  cam.y = 0;
  cam.z = 22;
  return st;
}


function drawHexField(z) {
  const g = S.hex;
  if (!g) return;
  const rad = z * HEX_S;
  const left = cam.x - cw / 2 / z - 1, right = cam.x + cw / 2 / z + 1;
  const top = cam.y - ch / 2 / z - 1, bot = cam.y + ch / 2 / z + 1;

  for (let i = 0; i < g.cells.length; i++) {
    const c = g.cells[i];
    if (c.x < left || c.x > right || c.y < top || c.y > bot) continue;
    const q = w2s(c.x, c.y);
    const st = S.grid[i];
    const nn = hash2(c.q * 7 + 3, c.r * 5 + 1);

    let fill;
    if (st === ROAD) fill = 'hsl(33, 32%, ' + (22 + nn * 9) + '%)';
    else if (st === ROCK || st === BUILT) fill = 'hsl(120, 12%, ' + (19 + nn * 4) + '%)';
    else fill = 'hsl(' + (126 + nn * 34) + ', 18%, ' + (16 + nn * 6) + '%)';

    hexPath2D(q[0], q[1], rad - 0.6);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = st === ROAD ? 'rgba(255,220,170,.13)' : 'rgba(0,0,0,.26)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 方向箭头
  for (const ar of S.routeArrows) {
    const q = w2s(ar.x, ar.y);
    ctx.save();
    ctx.translate(q[0], q[1]);
    ctx.rotate(ar.ang);
    ctx.strokeStyle = 'rgba(255,214,150,.5)';
    ctx.lineWidth = Math.max(1.1, z * 0.07);
    ctx.beginPath();
    ctx.moveTo(-z * 0.13, -z * 0.12);
    ctx.lineTo(z * 0.07, 0);
    ctx.lineTo(-z * 0.13, z * 0.12);
    ctx.stroke();
    ctx.restore();
  }
}

function placeObstacles(st) {
  // 桥面被抬高绘制，会盖住它正下方那一格的障碍物，所以那里不放东西
  const underDeck = (x, y) => y + 1 < N && st.elev && st.elev[(y + 1) * N + x] === 1;
  const free = (x, y) => x >= 0 && y >= 0 && x < N && y < N &&
    st.grid[y * N + x] === GRASS && !underDeck(x, y);

  function add(kind, x, y) {
    const def = OBSTACLE_DEF[kind];
    const sw = def.w || def.size;
    const sh = def.h || def.size;
    const cells = [];
    for (let dy = 0; dy < sh; dy++) {
      for (let dx = 0; dx < sw; dx++) {
        if (!free(x + dx, y + dy)) return false;
        cells.push({ x: x + dx, y: y + dy, id: (y + dy) * N + (x + dx) });
      }
    }
    const hp = def.hp * rnd(0.85, 1.2) * 3;
    const o = {
      id: st.obs.length, kind, cells, x, y, size: Math.max(sw, sh),
      w: sw, h: sh,
      hp, maxHp: hp,
      cx: x + sw / 2, cy: y + sh / 2,
    };
    for (const c of cells) {
      st.grid[c.y * N + c.x] = ROCK;
      st.obsAt[c.y * N + c.x] = o.id;
    }
    st.obs.push(o);
    return true;
  }

  // 1) 沿路 2 格内密集堆放
  for (const c of st.path) {
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        if (Math.abs(dx) + Math.abs(dy) > 2) continue;
        const x = c.x + dx, y = c.y + dy;
        if (!free(x, y)) continue;
        const r = Math.random();
        if (r < 0.030) {
          const bigQ = Math.random();
          add(bigQ < 0.30 ? 'megalith' : bigQ < 0.62 ? 'wall' : bigQ < 0.82 ? 'chest'
              : bigQ < 0.92 ? 'boulder' : 'ruin', x, y);
        } else if (r < 0.24) {
          // 掉落炮塔的晶体要稀有，否则太送
          const q = Math.random();
          const kind = q < 0.44 ? 'rock'
                     : q < 0.74 ? 'tree'
                     : q < 0.94 ? 'crate'
                     : 'crystal';
          add(kind, x, y);
        }
      }
    }
  }

  // 2) 空地稀疏散布
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      if (!free(x, y)) continue;
      if (Math.random() < 0.060) add('tree', x, y);
      else if (Math.random() < 0.030) add('rock', x, y);
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   波次
   ══════════════════════════════════════════════════════════════ */
function waveComposition(w) {
  const list = [];
  const hpScale = Math.pow(1.16, w - 1);
  const add = (type, count) => {
    const c = Math.max(1, Math.round(count * rnd(0.75, 1.25)));
    for (let i = 0; i < c; i++) list.push(type);
  };

  add('normal', 12 + Math.floor(w * 2.2));
  if (w >= 2) add('fast', 3 + Math.floor(w * 1.0));
  if (w >= 3) add('swarm', 5 + Math.floor(w * 1.2));
  if (w >= 4) add('flyer', 3 + Math.floor(w * 0.9));
  if (w >= 4) add('ghost', 2 + Math.floor(w / 6));
  if (w >= 6) add('tank', Math.max(1, Math.floor(w / 8)));
  if (w >= 8) add('splitter', 1 + Math.floor(w / 10));
  if (w >= 6) add('earthfiend', 2 + Math.floor((w - 6) / 3));
  if (w >= 9) add('armored', 1 + Math.floor(w / 14));
  if (w >= 7) add('tpmage', 1 + Math.floor(w / 14));
  if (w >= 5) add('levitator', 1);
  if (w >= 5) add('ufo', 1 + Math.floor((w - 5) / 10));
  if (w >= 6 && w % 2 === 0) add('rider', 2 + Math.floor(w / 7));
  if (w >= 2) {
    add('totemMage', 1 + Math.floor(w / 14));
  }
  if (w <= 5) add('dragonYoung', 1 + (w >= 4 ? 1 : 0));
  if (w === 12 || w === 18) add('dragonYoung', 10);
  if (w >= 8 && w % 6 === 0) add('dragonYoung', 3 + Math.floor(w / 10));
  if (w >= 24 && w % 6 === 0) add('dragon', 1);
  if (w % 5 === 0) add('boss', 1 + Math.floor(w / 15));
  if (w === 20 || w === 25 || w === 30) {
    add('giantSaucer', 1); add('giantBalloon', 1); add('giantBomber', 1);
  } else if (w > 18) {
    add(['giantSaucer', 'giantBalloon', 'giantBomber'][(Math.random() * 3) | 0], 1);
  } else if (w % 5 === 0 && w >= 5) {
    add(['giantSaucer', 'giantBalloon', 'giantBomber'][(w / 5 - 1) % 3], 1);
  }
  if (w >= 20 && w % 10 === 0) add('dragon', 1);

  // 首领和空中母舰压到最后出场
  // 随机混编：每波额外加入 1~3 组随机怪物
  {
    const pool = [
      ['normal', 1], ['fast', 2], ['swarm', 3], ['tank', 6], ['ghost', 4],
      ['armored', 9], ['splitter', 8], ['earthfiend', 6], ['tpmage', 7],
      ['rider', 6], ['levitator', 5], ['ufo', 10], ['flock', 12],
    ].filter(x => w >= x[1]);
    const picks = w >= 3 ? irnd(1, 3) : 0;
    for (let i = 0; i < picks; i++) {
      const t = pool[irnd(0, pool.length - 1)][0];
      add(t, irnd(2, 5) + Math.floor(w / 20));
    }
  }

  const bosses = list.filter(t => t === 'boss' || t === 'dragon');
  const rest = list.filter(t => t !== 'boss' && t !== 'dragon');
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  return { list: rest.concat(bosses), hpScale };
}

function startWave() {
  if (S.waveActive || S.over) return;
  S.wave++;
  const { list, hpScale } = waveComposition(S.wave);
  // 两条支路交替出怪
  S.spawnQueue = list.map((type, i) => ({
    type,
    hpScale,
    route: i % (S.routes.length || 2),
    delay: i,
  }));
  S.spawnTimer = 0;
  S.waveActive = true;
  S.waveHpScale = hpScale;
  if (S.wave >= 10 && S.wave % 4 === 0 && S.nests.length < 3) initNests(S);
  // 每波再生 4 个障碍物（30 波约 120 个）
  for (let k = 0; k < 6; k++) spawnRegenObstacle();
  logEvent('第 ' + S.wave + ' 波开始 · ' + S.spawnQueue.length + ' 只敌人', 'info');

  // 每 5 波来一次随机事件
  S.event = null;
  if (S.wave % 5 === 0) applyRandomEvent();

  updateHud();
  sfx('wave');
}

function applyRandomEvent() {
  const ev = EVENTS[(Math.random() * EVENTS.length) | 0];
  S.event = { def: ev, t: 0 };
  toast('【' + ev.name + '】' + ev.desc);
  announce(ev.name, ev.color);
  flashScreen(ev.color, 0.34);
  sfx('event');
  S.fx.push({ type: 'penta', x: S.base.x + 0.5, y: S.base.y + 0.5,
              life: 1.3, max: 1.3, col: ev.color });
  logEvent('随机事件【' + ev.name + '】' + ev.desc, 'event');

  if (ev.instant === 'gold') {
    S.gold += 400;
    addFx(S.base.x + 0.5, S.base.y + 0.5, 'gold', 1.4, '+ 400');
  }
  if (ev.instant === 'rift') {
    for (let i = 0; i < 10; i++) {
      spawnEnemy('flyer', S.waveHpScale || 1, i % (S.routes.length || 2));
    }
  }
  if (ev.extra) {
    const n = Math.round(S.spawnQueue.length * ev.extra);
    for (let i = 0; i < n; i++) {
      S.spawnQueue.splice(Math.floor(Math.random() * S.spawnQueue.length), 0, {
        type: 'normal', hpScale: S.waveHpScale, route: i % (S.routes.length || 2), delay: 0,
      });
    }
  }
  shake(0.35);
}

/** 事件倍率 */
function evMul(key) {
  return (S.event && S.event.def[key]) || 1;
}

const _drawBuf = [];
const _bufGround = [], _bufAir = [], _bufGiant = [];

function spawnEnemy(type, hpScale, route, opts) {
  if (S.enemies.length >= 520) return;
  // 出生点兜底：路线被裁剪/未定义时不要让游戏崩掉
  if (!S.spawns || !S.spawns.length || !S.spawns[0]) {
    S.spawns = (S.routes && S.routes[0] && S.routes[0].length)
      ? [S.routes[0][0], S.routes[0][0]] : [];
    if (!S.spawns.length) return;
  }   // 数量上限，防止召唤/空投导致卡顿
  if (!ENEMY_DEF[type]) {
    console.warn('[TD] 未知怪物类型：', type);
    type = 'normal';
  }
  const d = ENEMY_DEF[type];
  const r = (S.routeCount === 1) ? 0 : (route === 1 ? 1 : 0);
  opts = opts || {};
  let hp = (opts.hpOverride != null ? opts.hpOverride : d.hp * hpScale) * evMul('enemyHp');
  // 后期整体难度 +10%（16 波起）
  if (S.wave >= 16) hp *= 1.10;
  let t0 = opts.t || 0;
  if (d.emerge && opts.t == null) {
    const len = S.routes[r].length - 2;
    t0 = Math.max(0, Math.floor(len * 0.6 * Math.random()));
  }
  const p0 = pathPos(t0, r);
  const e = {
    type,
    route: r,
    t: t0,
    hp,
    maxHp: hp,
    speed: d.speed,
    speedMul: evMul('enemySpeed'),
    gold: Math.max(1, Math.round((opts.gold != null ? opts.gold : d.gold) * (1 + (hpScale - 1) * 0.3))),
    slowT: 0, slowF: 1,
    markT: 0, stunT: 0,
    burnT: 0, burnDps: 0,
    shield: 0, shieldMax: 0, shieldIdle: 99,
    dashCd: rnd(1.0, 2.4), dashT: 0,
    enraged: false, summonCd: 7,
    noSplit: !!opts.noSplit,
    gen: opts.gen || 0,
    x: p0.x, y: p0.y,
    dead: false,
  };
  // 普通怪随机配色
  if (type === 'normal') e.tintIdx = (Math.random() * TINT_COLORS.length) | 0;
  if (d.giant) { e.giant = d.giant; e.gt = 0; e.gcd = 4; if (S.wave >= 16) e.hp = e.maxHp = Math.round(e.hp * 0.8); }
  if (d.noLeak) e.noLeak = true;
  if (type === 'tank') {
    e.shieldMax = hp * 0.6;
    e.shield = e.shieldMax;
  }
  if (d.flying) {
    e.flying = true;
    const start = opts.start || S.spawns[r % 2] || S.spawns[0];
    e.fx0 = start.x + 0.5;
    e.fy0 = start.y + 0.5;
    e.fx1 = S.base.x + 0.5;
    e.fy1 = S.base.y + 0.5;
    e.flyLen = Math.max(1, Math.hypot(e.fx1 - e.fx0, e.fy1 - e.fy0));
    e.t = opts.t || 0;
    const f0 = clamp(e.t / e.flyLen, 0, 1);
    e.x = e.fx0 + (e.fx1 - e.fx0) * f0;
    e.y = e.fy0 + (e.fy1 - e.fy0) * f0;
  }
  if (d.plants) {
    for (let k = 0; k < 2; k++) {
      plantTotemRandom(TOTEM_VARIANTS[(Math.random() * TOTEM_VARIANTS.length) | 0]);
    }
  }

  if (type === 'flock') {
    e.hue = [0, 35, -35, 75, -75, 150][(Math.random() * 6) | 0];
    e.orbitA = Math.random() * Math.PI * 2;
    e.orbitR = 0.30 + Math.random() * 0.12;
    e.orbitSpd = 0.28 + Math.random() * 0.14;
  }

  if (type === 'ufo') {
    const b = mapBounds();
    e.x = b.minX + (b.maxX - b.minX) * (0.25 + Math.random() * 0.5);
    e.y = b.minY + (b.maxY - b.minY) * (0.25 + Math.random() * 0.5);
  }

  S.enemies.push(e);

  if (d.emerge) {
    // 破土而出
    for (let i = 0; i < 6; i++) {
      addFx(e.x + rnd(-0.4, 0.4), e.y + rnd(-0.4, 0.4), 'chip', 0.5);
    }
    addFx(e.x, e.y, 'boom', 0.5);
    shake(0.2);
  }

  if (type === 'boss' || type === 'dragon') {
    shake(0.5);
    sfx('boss');
    logEvent(d.name + ' 出现！', 'boss');
    announce(d.name + ' 出现', '#ff5a5a');
    flashScreen('#ff5a5a', 0.3);
  }
}

/* ══════════════════════════════════════════════════════════════
   路径插值
   ══════════════════════════════════════════════════════════════ */
function pathPos(t, route) {
  const p = S.routes[route || 0];
  const i = clamp(Math.floor(t), 0, p.length - 2);
  const f = clamp(t - i, 0, 1);
  const a = p[i], b = p[i + 1];
  return { x: a.x + (b.x - a.x) * f + 0.5, y: a.y + (b.y - a.y) * f + 0.5 };
}

/* ══════════════════════════════════════════════════════════════
   塔逻辑
   ══════════════════════════════════════════════════════════════ */
let _statFrame = 0;
const _statCache = new WeakMap();

function towerStats(t) {
  const hit = _statCache.get(t);
  // 同一帧且等级/分支未变才复用，避免升级后读到旧数值
  if (hit && hit.__f === _statFrame && hit.__lv === t.level && hit.__br === t.branch) return hit;
  const s2 = towerStatsRaw(t);
  s2.__f = _statFrame;
  s2.__lv = t.level;
  s2.__br = t.branch;
  _statCache.set(t, s2);
  return s2;
}

function towerStatsRaw(t) {
  const def = TOWER_DEF[t.type];
  if (t.level <= 2) {
    const s0 = Object.assign({}, def.lv[t.level - 1]);
    const lp0 = (t.level === 1 ? 0.90 : 1.15);
    if (s0.dmg) s0.dmg *= lp0;
    if (s0.burn) s0.burn *= lp0;
    if (s0.dps) s0.dps *= lp0;
    if (s0.range) s0.range *= (1 + (lp0 - 1) * 0.25);
    return s0;
  }
  const br = def.evolve[t.branch];
  const s = Object.assign({}, br.stats);
  if (t.level >= 4 && br.l4 && br.l4.mult) {
    for (const k in br.l4.mult) {
      if (s[k] != null) s[k] = s[k] * br.l4.mult[k];
    }
  }
  // 等级强度：越高等级越强（同一份金币投入，升级收益高于铺塔）
  const LV_POWER = { 1: 0.90, 2: 1.15, 3: 1.45, 4: 1.85 };
  const lp = LV_POWER[t.level] || 1;
  if (lp !== 1) {
    if (s.dmg) s.dmg = s.dmg * lp;
    if (s.burn) s.burn = s.burn * lp;
    if (s.dps) s.dps = s.dps * lp;
    if (s.range) s.range = s.range * (1 + (lp - 1) * 0.25);
  }

  // 高射炮强化
  if (t.type === 'aa') {
    if (s.dmg) s.dmg *= 1.35;
    if (s.range) s.range += 0.5;
  }

  // 基地等级全局增益
  if (S.baseTier > 0) {
    const gd = BASE_GD[S.baseTier] || 0;
    const gr = BASE_GR[S.baseTier] || 0;
    if (s.dmg) s.dmg *= 1 + gd;
    if (s.dps) s.dps *= 1 + gd;
    if (s.rate) s.rate *= 1 - gr;
  }

  // 图腾塔光环：范围内炮塔射速提升（图腾塔本身不享受）
  if (t.type !== 'totem') {
    let aura = 0;
    for (const o of S.towers) {
      if (o === t || o.type !== 'totem') continue;
      const d = dist(o.x + 0.5, o.y + 0.5, t.x + 0.5, t.y + 0.5);
      if (d > 3.6) continue;
      aura = Math.max(aura, 0.22);
    }
    if (aura > 0) {
      s.rate *= (1 - aura);
      t.totemAura = true;
      t.totemBonus = aura;
    } else {
      t.totemAura = false;
      t.totemBonus = 0;
    }
  }

  // 巨石阵加成
  if (S.dmgBonus) {
    if (s.dmg) s.dmg *= 1 + S.dmgBonus;
    if (s.dps) s.dps *= 1 + S.dmgBonus;
  }

  // 终极狙击塔：全屏射程
  if (t.type === 'sniper' && t.level >= 4) s.range = 80;

  // 高地加成
  if (t.high) {
    if (s.range) s.range *= 1.15;
    if (s.dmg) s.dmg *= 1.10;
    if (s.dps) s.dps *= 1.10;
  }

  // 符文地块加成
  if (t.boon) {
    if (s.dmg) s.dmg *= 1.25;
    if (s.dps) s.dps *= 1.25;
    if (s.range) s.range *= 1.10;
  }

  // 全场狂怒药水
  if (S && S.rageT > 0 && s.rate) s.rate *= 0.5;
  return s;
}

function towerName(t) {
  const def = TOWER_DEF[t.type];
  if (t.level <= 2) return def.name;
  const br = def.evolve[t.branch];
  return t.level >= 4 ? br.l4.name : br.name;
}

function cellCenter(id) {
  if (S.mode === 'hex') return S.hex.cells[id];
  return { x: (id % N) + 0.5, y: Math.floor(id / N) + 0.5 };
}

function cellIdAt(wx, wy) {
  if (S.mode === 'hex') return hexAt(S.hex, wx, wy);
  const gx = Math.floor(wx), gy = Math.floor(wy);
  if (gx < 0 || gy < 0 || gx >= N || gy >= N) return -1;
  return gy * N + gx;
}

function canBuild(id) {
  if (id < 0) return false;
  if (S.grid[id] === GRASS) return true;
  // 自愈：标记为已建但场上没有塔（塔被传送/摧毁后残留）
  if (S.grid[id] === BUILT && !S.towers.some(t => t.cell === id)) {
    S.grid[id] = GRASS;
    return true;
  }
  return false;
}

function clearSealAt(cellId) {
  const oi = S.obsAt[cellId];
  if (oi == null || oi < 0) return;
  const o = S.obs[oi];
  if (!o || !o.sealOf) return;
  const idx = S.obs.indexOf(o);
  if (idx >= 0) S.obs.splice(idx, 1);
  if (o.cells) for (const c of o.cells) S.obsAt[c.id] = -1;
}

function releaseTowerCell(t) {
  clearSealAt(t.cell);
  S.grid[t.cell] = GRASS;
}

/** 军火补给事件期间建塔/升级半价 */
// 各塔基础血量（等级 1），按定位区分：脆皮输出 / 重装辅助
const TOWER_HP = {
  gun: 68, frost: 72, tesla: 78, aa: 80, sniper: 82, flame: 88,
  wind: 86, cannon: 92, poison: 94, missile: 96, magnet: 104,
  railgun: 110, holy: 118, totem: 130,
};
const HP_LV = { 1: 0.85, 2: 1.15, 3: 1.6, 4: 2.2 };   // 升级显著加血

function towerMaxHp(t) {
  const base = TOWER_HP[t.type] || 90;
  return Math.round(base * (HP_LV[t.level] || 1));
}
function refreshTowerHp(t, heal) {
  const m = towerMaxHp(t);
  t.maxHp = m;
  t.hp = heal ? m : Math.min(m, t.hp || m);
}

function costOf(base) {
  return Math.round(base * ((S.event && S.event.def.discount) ? 0.5 : 1));
}

function buildTower(id, type) {
  if (id < 0) return false;
  const def = TOWER_DEF[type];
  const cost = costOf(def.lv[0].cost);
  if (S.gold < cost) { toast('金币不够'); return false; }
  if (!canBuild(id)) { toast('这里不能建'); return false; }
  S.gold -= cost;
  const cw = cellCenter(id);
  const t = {
    cell: id, x: cw.x - 0.5, y: cw.y - 0.5, type, level: 1, branch: 0,
    cd: 0, angle: -Math.PI / 2,
    target: null, priority: 'first',
    kills: 0, dmgDealt: 0,
    totalCost: cost,
    activeT: 0, cdActive: 0,
  };
  S.grid[id] = BUILT;
  refreshTowerHp(t, true);
  if (S.boon && S.boon[id]) t.boon = true;
  if (S.goldT && S.goldT[id]) t.goldGen = 2.5;
  if (S.highT && S.highT[id]) t.high = true;
  if (type === 'barracks') t.rally = findRally(t, def.lv[0].range);
  S.towers.push(t);
  sfx('build');
  return t;   // 返回塔对象，方便调用方继续处理
}

function canTarget(t, e) {
  if (e.ghostT > 0) return false;
  const cap = TOWER_AIR[t.type] || 'ground';
  if (e.flying || e.airborne) return cap === 'air' || cap === 'both';
  return cap === 'ground' || cap === 'both';
}

const EGRID_CELL = 3;
const _egrid = new Map();
let _egridStamp = -1, _egridS = null;

function ensureEnemyGrid() {
  if (_egridS === S && _egridStamp === S.stepStamp) return;
  _egridS = S;
  _egridStamp = S.stepStamp;
  _egrid.clear();
  for (const e of S.enemies) {
    if (e.dead) continue;
    const k = Math.floor(e.x / EGRID_CELL) + ',' + Math.floor(e.y / EGRID_CELL);
    let a = _egrid.get(k);
    if (!a) { a = []; _egrid.set(k, a); }
    a.push(e);
  }
}

function pickTarget(t, range) {
  const cx = t.x + 0.5, cy = t.y + 0.5;
  const r2 = range * range;

  // 手动锁定的怪物优先
  const fo = S.focus;
  if (fo && !fo.dead && fo.maxHp !== undefined && !fo.cells) {
    const fdx = fo.x - cx, fdy = fo.y - cy;
    if (fdx * fdx + fdy * fdy <= r2) return fo;
  }

  let best = null, bestVal = -Infinity;      // 普通目标
  let bestF = null, bestFVal = -Infinity;    // 鸟群（最低优先）
  ensureEnemyGrid();
  const gx0 = Math.floor((cx - range) / EGRID_CELL), gx1 = Math.floor((cx + range) / EGRID_CELL);
  const gy0 = Math.floor((cy - range) / EGRID_CELL), gy1 = Math.floor((cy + range) / EGRID_CELL);
  for (let gx = gx0; gx <= gx1; gx++) {
  for (let gy = gy0; gy <= gy1; gy++) {
  const cellArr = _egrid.get(gx + ',' + gy);
  if (!cellArr) continue;
  for (const e of cellArr) {
    if (e.dead) continue;
    const dx = e.x - cx, dy = e.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 > r2) continue;
    if (!canTarget(t, e)) continue;
    let v;
    if (t.priority === 'first') v = e.t;
    else if (t.priority === 'last') v = -e.t;
    else if (t.priority === 'strong') v = e.hp;
    else v = -d2;
    if (e.type === 'flock') {
      if (v > bestFVal) { bestFVal = v; bestF = e; }
    } else if (v > bestVal) {
      bestVal = v; best = e;
    }
  }
  }
  }
  return best || bestF;   // 只有没有别的目标时才打鸟群
}

// BOSS 级单位：不被冰冻/眩晕，改为积累"易伤"
function isBossLike(e) {
  return e.type === 'boss' || e.type === 'dragon' || !!e.giant;
}
// 施加眩晕；对 BOSS 转为易伤，返回是否真的被冻住
function stunEnemy(e, dur) {
  if (!e || e.dead) return false;
  if (isBossLike(e)) {
    e.bossVuln = Math.min(16, (e.bossVuln || 0) + dur);
    addFx(e.x, e.y, 'tp', 0.35);
    return false;
  }
  e.stunT = Math.max(e.stunT || 0, dur);
  return true;
}

function damageEnemy(e, dmg, src) {
  if (e.dead) return 0;
  if (e.invulnT > 0) {
    if (Math.random() < 0.25) addFx(e.x, e.y, 'chip', 0.18);
    return 0;
  }
  if (e.evadeBuff && Math.random() < e.evadeBuff) { addFx(e.x, e.y, 'chip', 0.2); return 0; }
  if (e.armorBuff) dmg *= e.armorBuff;
  if (e.type === 'ufo') e.hitAcc = (e.hitAcc || 0) + dmg;
  if (e.type === 'digger' && e.burrowT > 0) return 0;
  let real = dmg * (e.markT > 0 ? (1 + (e.markBoost || 0.35)) : 1)
    * (e.bossVuln > 0 ? 1.35 : 1);   // BOSS 被控时转为易伤 +35%
  if (e.type === 'armored') real = Math.max(1, real - 25);
  if (e.enraged) real *= 0.8;          // 狂暴减伤

  // 护盾优先吸收，且护盾存在时额外减伤 25%
  if (e.shield > 0) {
    e.shieldIdle = 0;
    real *= 0.75;
    const absorb = Math.min(e.shield, real);
    e.shield -= absorb;
    real -= absorb;
    if (e.shield <= 0) {
      e.shield = 0;
      addFx(e.x, e.y, 'boom', 0.3);
      sfx('rock');
    }
  }

  e.hp -= real;
  if (src) src.dmgDealt += real;

  // 骑鸟人：血量过半 → 骑手落地、坐骑脱缰
  if (e.type === 'rider' && !e.splitDone && e.hp > 0 && e.hp <= e.maxHp * 0.5) {
    e.splitDone = true;
    spawnEnemy('bird', 1, e.route, {
      start: { x: Math.max(0, e.x - 0.5), y: Math.max(0, e.y - 0.5) },
      hpOverride: e.maxHp * 0.32,
      noSplit: true,
    });
    landRider(e);
    addFx(e.x, e.y, 'boom', 0.7);
    addFx(e.x, e.y, 'gold', 1.2, '落鸟！');
    shake(0.18);
    sfx('leap');
    logEvent('骑手跳下坐骑，坐骑脱缰加速', 'boss');
  }

  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    const goldGain = Math.round(e.gold * evMul('goldMul') * KILL_GOLD_RATE * killGoldDecay());
    S.gold += goldGain;
    S.kills++;
    if (e.type === 'boss' || e.type === 'dragon') {
      logEvent(ENEMY_DEF[e.type].name + ' 被击杀', 'boss');
    } else {
      S.killBuf.n++;
      S.killBuf.gold += goldGain;
    }
    addFx(e.x, e.y, 'death', 0.6);
    addFx(e.x, e.y, 'gold', 0.9, '+ ' + goldGain);
    sfx('kill');

    if (e.type === 'bomber' || e.type === 'kamikaze') {
      for (const tw of S.towers) {
        if (dist(tw.x + 0.5, tw.y + 0.5, e.x, e.y) < 2.5) tw.cd = Math.max(tw.cd, 2);
      }
      addFx(e.x, e.y, 'boom', 0.8);
      shake(0.35);
    }
    if (e.type === 'thief') {
      S.gold = Math.max(0, S.gold - 30);
      addFx(e.x, e.y, 'gold', 1.1, '-30 金');
    }
    if (e.type === 'giantBalloon') {
      // 黑洞坍缩：范围更大、伤害更高、特效更夸张
      const bhW = Math.max(0, S.wave - 15);
      const bhR = 6.5 + Math.min(6.5, bhW * 0.35);        // 15 波后 6.5 → 13
      const bhKill = 4 + Math.floor(bhW / 3);             // 可摧毁炮塔数
      const bhDmg = 140 + bhW * 7;                        // 单塔伤害
      const hitList = S.towers
        .filter(tw => dist(e.x, e.y, tw.x + 0.5, tw.y + 0.5) <= bhR)
        .sort((a, b) => dist(e.x, e.y, a.x + 0.5, a.y + 0.5) - dist(e.x, e.y, b.x + 0.5, b.y + 0.5));
      // 同时炸毁范围内的障碍物（土块 / 图腾 / 岩石等）
      for (const o of S.obs.slice()) {
        if (!o.cells || o.hp <= 0) continue;
        let od = Infinity;
        for (const c of o.cells) od = Math.min(od, dist(e.x, e.y, c.x + 0.5, c.y + 0.5));
        if (od > bhR) continue;
        o.hp -= 900 + bhW * 45;
        addFx(o.cx != null ? o.cx : e.x, o.cy != null ? o.cy : e.y, 'boom', 0.6);
        if (o.hp <= 0) destroyObstacle(o);
      }
      // 以及范围内的怪物
      for (const en of S.enemies.slice()) {
        if (en === e || en.dead) continue;
        if (dist(e.x, e.y, en.x, en.y) <= bhR) damageEnemy(en, 380 + bhW * 22, null);
      }

      let killed = 0;
      for (const tw of hitList) {
        if (killed >= bhKill) {
          // 其余炮塔最多掉到半血
          const half = (tw.maxHp || 100) * 0.5;
          tw.hp = Math.max(half, (tw.hp || 100) - bhDmg);
          addFx(tw.x + 0.5, tw.y + 0.5, 'boom', 0.4);
          continue;
        }
        const before = S.towers.length;
        damageTower(tw, bhDmg);
        if (S.towers.length < before) killed++;
      }
      for (let i = 0; i < 16 + Math.min(20, bhW * 2); i++) {
        const a2 = Math.random() * Math.PI * 2;
        const rr = Math.random() * bhR * 0.7;
        addFx(e.x + Math.cos(a2) * rr, e.y + Math.sin(a2) * rr, 'boom', 1.4 + Math.random() * 0.6);
      }
      addFx(e.x, e.y, 'boom', 2.6);
      addFx(e.x, e.y, 'boom', 2.2);
      addFx(e.x, e.y, 'tp', 1.6);
      shake(1.6);
      sfx('boom');
      sfx('event');
      flashScreen('#ff8c3c', 0.5);
      announce('黑洞坍缩！', '#ff9f43');
      logEvent('黑洞坍缩，范围内的炮塔受到重创', 'boss');
    }
    if (e.splitBuff && !e.noSplit) {
      // 分裂出来的小怪不再分裂，也不掉钱，避免无限刷
      for (let kk = 0; kk < 2; kk++) {
        spawnEnemy('normal', 0.6, e.route || 0, {
          t: Math.max(0, e.t - 1 - kk),
          noSplit: true,
          gold: 1,
        });
      }
      addFx(e.x, e.y, 'boom', 0.5);
    }
    if (e.boomOnDeath) {
      for (const o of S.enemies) {
        if (o === e || o.dead) continue;
        if (dist(e.x, e.y, o.x, o.y) <= 1.8) damageEnemy(o, e.maxHp * 0.20, null);
      }
      addFx(e.x, e.y, 'boom', 0.8);
      addFx(e.x, e.y, 'boom', 0.5);
      shake(0.12);
    }
    if (e.type === 'totemMage') {
      for (let k = 0; k < 2; k++) {
        plantTotemRandom(TOTEM_VARIANTS[(Math.random() * TOTEM_VARIANTS.length) | 0]);
      }
      addFx(e.x, e.y, 'tp', 0.9);
      logEvent('图腾法师临死前又插下 2 根图腾', 'boss');
    }
    if (e.type === 'ghost') {
      let best = null, bd = 7;
      for (const tw of S.towers) {
        const d = dist(e.x, e.y, tw.x + 0.5, tw.y + 0.5);
        if (d < bd) { bd = d; best = tw; }
      }
      if (best) {
        best.cursedT = 7;
        addFx(best.x + 0.5, best.y + 0.5, 'tp', 0.6);
        addFx(best.x + 0.5, best.y + 0.5, 'gold', 1.2, '诅咒！');
        logEvent('幽灵临死诅咒了一座炮塔', 'boss');
      }
    }
    if (e.type === 'tpmage') {
      let best = null, bd = 6;
      for (const tw of S.towers) {
        const d = dist(e.x, e.y, tw.x + 0.5, tw.y + 0.5);
        if (d < bd) { bd = d; best = tw; }
      }
      if (best) teleportTower(best);
    }
    if (e.type === 'splitter') {
      const gen = e.gen || 0;
      if (gen < 2) {
        const cnt = gen === 0 ? 3 : 2;
        for (let k = 0; k < cnt; k++) {
          spawnEnemy('splitter', 1, e.route, {
            t: Math.max(0, e.t - 0.4),
            hpOverride: e.maxHp * (gen === 0 ? 0.4 : 0.5),
            noSplit: true, gen: gen + 1,
          });
        }
      }
    }

    // 概率掉落道具
    const dropChance = (e.type === 'boss' || e.type === 'dragon' || e.giant) ? 1 : 0.025;
    if (Math.random() < dropChance) {
      const pool = ['airstrike', 'freeze', 'gold', 'gold', 'rage', 'rage', 'repair'];
      const kind = pool[(Math.random() * pool.length) | 0];
      S.drops.push({ x: e.x, y: e.y, life: 1.1, max: 1.1, kind });
    }

    // 普通怪：分裂
    if (e.type === 'normal' && !e.noSplit && Math.random() < 0.35) {
      for (let k = 0; k < 2; k++) {
        spawnEnemy('larva', 1, e.route, {
          t: Math.max(0, e.t - 0.6),
          hpOverride: Math.max(8, e.maxHp * 0.12),
          noSplit: true,
        });
      }
      addFx(e.x, e.y, 'boom', 0.35);
    }
  }
  return real;
}

function fireTower(t, dt) {
  if (t.vineT > 0) { t.vineT -= dt; return; }
  if (t.sealed || t.suppressedBy) return;
  if (t.type === 'barracks' || t.type === 'totem') return;

  // 终极塔：周期性在战场生成区域
  if (t.level >= 4) {
    t.zoneCd = (t.zoneCd || 0) - dt;
    if (t.zoneCd <= 0) {
      const stz = towerStats(t);
      if (t.type === 'frost') { t.zoneCd = 9; spawnZoneOnPath('ice', t); sfx('frost'); }
      else if (t.type === 'magnet') { t.zoneCd = 9; spawnZoneOnPath('storm', t); }
      else if (t.type === 'wind' && stz.tornado) { t.zoneCd = 13; spawnTornado(t); sfx('wind'); }
      else t.zoneCd = 1;
    }
  }
  const st = towerStats(t);
  if (t.activeT > 0) t.activeT -= dt;
  const overdrive = (t.type === 'gun' && t.activeT > 0);
  let rate = overdrive ? st.rate / 3 : st.rate;
  rate *= evMul('towerRate');
  const cx = t.x + 0.5, cy = t.y + 0.5;

  // 圣光：持续治疗周围士兵
  if (t.type === 'holy' && st.heal && S.soldiers.length) {
    for (const sd of S.soldiers) {
      if (sd.dead) continue;
      if (dist(cx, cy, sd.x, sd.y) < st.range) {
        sd.hp = Math.min(towerStats(sd.tower).hp, sd.hp + st.heal * dt);
      }
    }
  }

  // 被致盲图腾削弱
  if (t.blindT > 0) { t.blindT -= dt; if (st.dmg) st.dmg *= 0.85; }

  // 被咒怨图腾压制
  if (t.curseT > 0) { t.curseT -= dt; rate *= 1.15; }

  // 被幽灵诅咒：射速下降
  if (t.cursedT > 0) { t.cursedT -= dt; rate *= 1.4; }

  // 图腾光环：提升周围炮塔射速
  if (t.totemAura) t.litTotem = 0.25;
  for (const o of S.towers) {
    if (o === t || o.type !== 'totem') continue;
    const so = towerStats(o);
    if (dist(cx, cy, o.x + 0.5, o.y + 0.5) < so.range) { rate *= (so.aura || 0.8); break; }
  }

  // 首领 / 空中母舰的恐惧光环：附近的塔射速变慢
  for (const e2 of S.enemies) {
    if (e2.dead) continue;
    if (e2.type === 'frostTroll') {
      if (dist(cx, cy, e2.x, e2.y) < 4) { rate *= 1.3; break; }
      continue;
    }
    if (e2.type !== 'boss' && e2.type !== 'dragon') continue;
    if (dist(cx, cy, e2.x, e2.y) < 5) { rate *= 1.35; break; }
  }

  t.cd -= dt;

  if (t.type === 'flame' || t.type === 'poison') {
    // 毒气塔：把 dmg/rate 折算成每秒伤害，持续作用于范围内所有敌人
    const dps = st.dps || (st.dmg || 10) / Math.max(0.15, st.rate || 1);
    // 烈焰风暴：技能期间额外伤害
    if (t.activeT > 0) {
      for (const e of S.enemies) {
        if (e.dead || !canTarget(t, e)) continue;
        if (dist(cx, cy, e.x, e.y) <= st.range) damageEnemy(e, 70 * dt, t);
      }
    }
    // 范围塔也能烧掉范围内的封印土块
    for (const ob of S.obs) {
      if (!ob.sealOf || ob.hp <= 0) continue;
      let od = Infinity;
      for (const c of ob.cells) od = Math.min(od, dist(cx, cy, c.x + 0.5, c.y + 0.5));
      if (od <= st.range) {
        ob.hp -= (dps * 0.8) * dt;
        if (ob.hp <= 0) destroyObstacle(ob);
      }
    }

    let any = false;
    for (const e of S.enemies) {
      if (e.dead) continue;
      if (!canTarget(t, e)) continue;
      const d = dist(cx, cy, e.x, e.y);
      if (d <= st.range) {
        any = true;
        damageEnemy(e, dps * dt, t);
        if (st.burn) { e.burnT = 2.0; e.burnDps = st.burn; }
      }
    }
    if (any) {
      const tg = pickTarget(t, st.range);
      if (tg) t.angle = Math.atan2(tg.y - cy, tg.x - cx);
    }
    t.firing = any;
    return;
  }

  if (t.cd > 0) return;

  // 土块封印优先：射程内有被封印的炮塔时先拆封印
  const seal = findSealInRange(t, st);
  if (seal) { attackObstacle(t, st, seal); return; }

  // 手动锁定的障碍物优先
  const fo = S.focus;
  if (fo && fo.cells && fo.hp > 0) {
    const cx2 = t.x + 0.5, cy2 = t.y + 0.5;
    let foD = Infinity;
    for (const c of fo.cells) foD = Math.min(foD, dist(cx2, cy2, c.x + 0.5, c.y + 0.5));
    if (foD <= st.range) { attackObstacle(t, st, fo); return; }
  }

  const tot = findTotemInRange(t, st);
  if (tot) { attackObstacle(t, st, tot); return; }

  const tgt = pickTarget(t, st.range);
  if (!tgt) {
    attackObstacle(t, st);
    return;
  }

  t.angle = Math.atan2(tgt.y - cy, tgt.x - cx);

  if (t.type === 'tesla') {
    t.cd = rate;
    // 电弧：可以同时从多个目标起跳
    const starts = [tgt];
    if (st.arcs && st.arcs > 1) {
      for (const e of S.enemies) {
        if (e.dead || e === tgt || !canTarget(t, e)) continue;
        if (starts.length >= Math.round(st.arcs)) break;
        if (dist(cx, cy, e.x, e.y) <= st.range) starts.push(e);
      }
    }
    for (const s0 of starts) {
      let cur = s0;
      const hit = new Set();
      const pts = [{ x: cx, y: cy }, { x: s0.x, y: s0.y }];
      for (let i = 0; i < Math.round(st.chain) && cur; i++) {
        hit.add(cur);
        damageEnemy(cur, st.dmg, t);
        if (st.stun) stunEnemy(cur, st.stun);
        let next = null, bd = 3.4;
        for (const e of S.enemies) {
          if (e.dead || hit.has(e) || !canTarget(t, e)) continue;
          const d = dist(cur.x, cur.y, e.x, e.y);
          if (d < bd) { bd = d; next = e; }
        }
        if (next) pts.push({ x: next.x, y: next.y });
        cur = next;
      }
      S.fx.push({ type: 'chain', pts, life: 0.14, max: 0.14 });
    }
    sfx('tesla');
    return;
  }

  t.cd = rate;
  S.shots.push({
    x: cx, y: cy, target: tgt,
    speed: t.type === 'sniper' ? 26 : 14,
    dmg: st.dmg,
    splash: st.splash || 0,
    slow: st.slow || 0,
    slowT: st.slowT || 0,
    pierce: st.pierce || 0,
    mark: st.mark || 0,
    push: st.push || 0,
    dis: st.dis || 0,
    chainBlast: (t.type === 'cannon' && t.level >= 4) ? 4 : 0,
    crit: st.crit || 0,
    bonusSlowed: st.bonusSlowed || 0,
    cluster: st.cluster ? Math.round(st.cluster) : 0,
    type: t.type,
    src: t,
    hit: new Set(),
  });
  S.fx.push({
    type: 'muzzle',
    x: cx + Math.cos(t.angle) * 0.46,
    y: cy + Math.sin(t.angle) * 0.46,
    ang: t.angle,
    col: TOWER_DEF[t.type].color,
    life: 0.11, max: 0.11,
  });
  // 重炮开火震屏
  if (t.type === 'sniper' || t.type === 'railgun' || t.type === 'cannon' || t.type === 'missile') {
    if (S.shake < 0.12) shake(t.type === 'railgun' ? 0.22 : 0.15);
  }
  const sk = (t.type === 'sniper' || t.type === 'railgun') ? 'sniper'
           : t.type === 'frost' ? 'frost'
           : t.type === 'wind' ? 'wind'
           : 'shoot';
  sfx(sk);
}


/* 兵营士兵 */
const MELEE = { normal: 12, fast: 10, tank: 22, boss: 45, dragon: 60, swarm: 7, larva: 5, flyer: 0 };

function findRally(t, range) {
  const cx = t.x + 0.5, cy = t.y + 0.5;
  let best = null, bd = range + 0.6;
  for (const c of S.path) {
    const d = dist(cx, cy, c.x + 0.5, c.y + 0.5);
    if (d < bd) { bd = d; best = c; }
  }
  return best ? { x: best.x + 0.5, y: best.y + 0.5 } : { x: cx, y: cy };
}

function ensureSoldiers(t) {
  const st = towerStats(t);
  const need = Math.max(1, Math.round(st.count || 1));
  const mine = S.soldiers.filter(x => x.tower === t);
  for (let i = mine.length; i < need; i++) {
    const rally = t.rally || { x: t.x + 0.5, y: t.y + 0.5 };
    const ang = i * (Math.PI * 2 / need);
    S.soldiers.push({
      tower: t,
      x: rally.x + Math.cos(ang) * 0.34,
      y: rally.y + Math.sin(ang) * 0.34,
      hp: st.hp, cd: 0, dead: false, respawnT: 0,
    });
  }
}

function updateSoldiers(dt) {
  for (const t of S.towers) if (t.type === 'barracks') ensureSoldiers(t);

  for (const s of S.soldiers) {
    const t = s.tower;
    const st = towerStats(t);
    if (s.dead) {
      s.respawnT -= dt;
      if (s.respawnT <= 0) { s.dead = false; s.hp = st.hp; s.cd = 0; }
      continue;
    }
    if (s.hp > st.hp) s.hp = st.hp;
    s.cd -= dt;

    let best = null, bd = 1.15;
    for (const e of S.enemies) {
      if (e.dead || e.flying) continue;
      const d = dist(s.x, s.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (best && s.cd <= 0) {
      s.cd = st.rate;
      damageEnemy(best, st.dmg * (t.activeT > 0 ? 1.6 : 1), null);
      addFx(best.x, best.y, 'hit', 0.2);
      sfx('shoot');
    }
    if (s.hp <= 0) {
      s.dead = true;
      s.respawnT = st.respawn;
      addFx(s.x, s.y, 'death', 0.5);
      sfx('leak');
    }
  }
}

const SPIKE_DEF = { cost: 25, dmg: 22, uses: 14, cd: 0.55 };

function placeSpike(cellId) {
  if (cellId < 0) return false;
  if (S.grid[cellId] !== ROAD) return false;
  if (S.spikes.some(sp => sp.cell === cellId)) return false;
  if (S.gold < SPIKE_DEF.cost) return false;
  S.gold -= SPIKE_DEF.cost;
  const cw = cellCenter(cellId);
  S.spikes.push({ cell: cellId, x: cw.x, y: cw.y, uses: SPIKE_DEF.uses, cd: 0, max: SPIKE_DEF.uses });
  return true;
}

function updateSpikes(dt) {
  if (!S.spikes.length) return;
  for (const sp of S.spikes) {
    if (sp.cd > 0) { sp.cd -= dt; continue; }
    for (const e of S.enemies) {
      if (e.dead || e.flying) continue;
      if (dist(sp.x, sp.y, e.x, e.y) > 0.72) continue;
      damageEnemy(e, SPIKE_DEF.dmg, null);
      addFx(e.x, e.y, 'hit', 0.22);
      sp.uses--;
      sp.cd = SPIKE_DEF.cd;
      if (sp.uses <= 0) { addFx(sp.x, sp.y, 'chip', 0.4); sfx('rock'); }
      break;
    }
  }
  S.spikes = S.spikes.filter(sp => sp.uses > 0);
}

function addObstacleCell(cid, kind) {
  if (cid < 0 || S.grid[cid] !== GRASS) return false;
  const def = OBSTACLE_DEF[kind];
  if (!def) return false;
  const cw = cellCenter(cid);
  if (!cw) return false;
  if (S.towers.some(t => t.cell === cid)) return false;
  const hp = Math.round(def.hp * 0.85);
  const o = {
    id: S.obs.length, kind, size: def.size || 1,
    cells: [{ id: cid, x: cw.x - 0.5, y: cw.y - 0.5 }],
    x: cw.x - 0.5, y: cw.y - 0.5,
    hp, maxHp: hp, cx: cw.x, cy: cw.y,
  };
  S.grid[cid] = ROCK;
  S.obsAt[cid] = o.id;
  S.obs.push(o);
  return true;
}

function spawnRegenObstacle() {
  for (let tries = 0; tries < 80; tries++) {
    const cid = (Math.random() * S.grid.length) | 0;
    if (S.grid[cid] !== GRASS) continue;
    const r = Math.random();
    const kind = r < 0.55 ? 'tree' : 'rock';
    if (addObstacleCell(cid, kind)) {
      const cw = cellCenter(cid);
      if (cw) addFx(cw.x, cw.y, 'chip', 0.5);
      return true;
    }
  }
  return false;
}

let autoBuild = false, autoBuildT = 1.5;
let autoSkill = true, autoSkillT = 1;

function tryUpgradeAuto(t) {
  const def = TOWER_DEF[t.type];
  if (!def) return false;
  let cost = 0;
  if (t.level === 1) cost = costOf(def.lv[1].cost);
  else if (t.level === 2) cost = costOf(def.evolve[0].cost);
  else if (t.level === 3) cost = costOf(def.evolve[t.branch || 0].l4.cost);
  else return false;
  if (S.gold < cost) return false;
  S.gold -= cost;
  t.totalCost = (t.totalCost || 0) + cost;
  if (t.level === 1) t.level = 2;
  else if (t.level === 2) { t.level = 3; t.branch = 0; }
  else t.level = 4;
    refreshTowerHp(t, true);
  refreshTowerHp(t, true);
  addFx(t.x + 0.5, t.y + 0.5, 'gold', 0.9, 'Lv' + t.level);
  sfx('upgrade');
  return true;
}

function findBuildSpot() {
  let best = -1, bd = 1e9;
  for (let i = 0; i < S.grid.length; i++) {
    if (S.grid[i] !== GRASS) continue;
    if (S.towers.some(t => t.cell === i)) continue;
    const cw = cellCenter(i);
    if (!cw) continue;
    // 必须靠近路径（有打击价值）
    let d = 1e9;
    for (const c of S.path) {
      const dd = dist(cw.x, cw.y, c.x + 0.5, c.y + 0.5);
      if (dd < d) d = dd;
    }
    if (d < 0.80 || d > 6.0) continue;
    // 优先从基地附近向外铺开
    const db = dist(cw.x, cw.y, S.base.x + 0.5, S.base.y + 0.5);
    if (db < bd) { bd = db; best = i; }
  }
  return best;
}

const AUTO_TYPES = ['gun', 'cannon', 'frost', 'sniper', 'aa', 'tesla', 'poison', 'wind', 'holy', 'missile'];

function autoTowerTick(dt) {
  if (!autoBuild) return;
  autoBuildT -= dt;
  if (autoBuildT > 0) return;
  autoBuildT = 0.8;

  const cap = 200;                              // 上限 200 座
  const upg = S.towers.filter(t => t.level < 4)
    .sort((a, b) => (a.totalCost || 0) - (b.totalCost || 0))[0];

  // 金币充裕时优先提升质量
  if (upg && S.gold > 2600 && Math.random() < 0.45) {
    if (tryUpgradeAuto(upg)) { updateHud(); return; }
  }

  if (S.towers.length < cap) {
    const cid = findBuildSpot();
    if (cid >= 0) {
      const type = AUTO_TYPES[(Math.random() * AUTO_TYPES.length) | 0];
      if (buildTower(cid, type)) { updateHud(); return; }
    }
  }

  // 建不了就升级
  if (upg && tryUpgradeAuto(upg)) updateHud();
}

function autoSkillTick(dt) {
  if (!autoSkill) return;
  autoSkillT -= dt;
  if (autoSkillT > 0) return;
  autoSkillT = 0.7;

  const bx = S.base.x + 0.5, by = S.base.y + 0.5;
  let near = 0;
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (dist(e.x, e.y, bx, by) < 9) near++;
  }
  const bossOn = S.enemies.some(e => !e.dead && (e.giant || e.type === 'boss' || e.type === 'dragon'));
  if (!(near >= 6 || S.lives <= 8 || bossOn)) return;

  for (const t of S.towers) {
    if (!TOWER_ACTIVE[t.type]) continue;
    if (t.cdActive > 0) continue;
    if (t.sealed || t.suppressedBy || t.vineT > 0) continue;
    useActive(t);
    return;
  }
}

function updateVines(dt) {
  let hasVine = false;
  for (const o of S.obs) { if (o.kind === 'vine' && o.hp > 0) { hasVine = true; break; } }
  if (!hasVine) return;

  for (const o of S.obs) {
    if (o.kind !== 'vine' || o.hp <= 0) continue;

    // 缠住范围内的炮塔
    for (const t of S.towers) {
      if (dist(t.x + 0.5, t.y + 0.5, o.cx, o.cy) < 1.8) t.vineT = 0.35;
    }

    // 缠住地面怪物，最多 5 只
    if (!o.held) o.held = [];
    o.held = o.held.filter(e => !e.dead && !e.flying && dist(e.x, e.y, o.cx, o.cy) < 1.8);
    if (o.held.length < 5) {
      for (const e of S.enemies) {
        if (e.dead || e.flying) continue;
        if (o.held.length >= 5) break;
        if (o.held.indexOf(e) >= 0) continue;
        if (dist(e.x, e.y, o.cx, o.cy) < 1.8) o.held.push(e);
      }
    }

    // 被缠住的怪物会挣扎撕扯藤蔓
    let dmg = 0;
    for (const e of o.held) {
      if (e.dead) continue;
      stunEnemy(e, 0.3);
      dmg += (10 + e.maxHp * 0.025) * dt;
    }
    if (dmg > 0) {
      o.hp -= dmg;
      if (Math.random() < dt * 4) {
        addFx(o.cx + rnd(-0.5, 0.5), o.cy + rnd(-0.5, 0.5), 'chip', 0.25);
      }
      if (o.hp <= 0) { destroyObstacle(o); continue; }
    }
  }
}

function findTotemInRange(t, st) {
  const cx = t.x + 0.5, cy = t.y + 0.5;
